<!DOCTYPE html>
<!-- v6 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICE HOCKEY v6</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0514;font-family:'Impact','Arial Black',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;color:#fff;user-select:none;}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;position:absolute;width:100%;height:100%;}
.screen.active{display:flex;}
.game-title{font-size:clamp(48px,8vw,96px);letter-spacing:14px;background:linear-gradient(180deg,#88ddff,#0077cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 28px #44aaff);}
.subtitle{font-size:14px;color:#444;letter-spacing:10px;margin-bottom:14px;}
.menu-btn{padding:12px 44px;font-size:18px;font-family:inherit;border:none;border-radius:10px;cursor:pointer;font-weight:bold;letter-spacing:3px;text-transform:uppercase;transition:all 0.2s;margin:5px;}
.btn-blue{background:linear-gradient(45deg,#44aaff,#0055cc);color:#fff;box-shadow:0 4px 20px rgba(68,170,255,0.4);}
.btn-blue:hover{transform:scale(1.06);}
.btn-red{background:linear-gradient(45deg,#ff4444,#cc0000);color:#fff;box-shadow:0 4px 20px rgba(255,68,68,0.4);}
.btn-red:hover{transform:scale(1.06);}
.btn-gold{background:linear-gradient(45deg,#ffd700,#ff8800);color:#1a1a2e;box-shadow:0 4px 20px rgba(255,215,0,0.35);}
.btn-gold:hover{transform:scale(1.06);}
.trophy-btn{background:none;border:2px solid #333;border-radius:10px;padding:7px 18px;cursor:pointer;font-size:20px;transition:all 0.2s;color:#ffd700;font-family:inherit;}
.trophy-btn:hover{border-color:#ffd700;transform:scale(1.07);}
#teamSelect{gap:12px;padding:20px;}
.ts-title{font-size:24px;letter-spacing:8px;color:#88ddff;margin-bottom:6px;}
.ts-panels{display:flex;gap:34px;align-items:flex-start;}
.ts-panel{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:220px;}
.ts-label{font-size:11px;letter-spacing:4px;color:#555;}
.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.team-card{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1);border-radius:9px;padding:9px 12px;text-align:center;cursor:pointer;transition:all 0.2s;min-width:100px;}
.team-card:hover{transform:scale(1.05);border-color:rgba(255,255,255,0.35);}
.team-card.sel-p1{border-color:#44aaff;background:rgba(68,170,255,0.14);}
.team-card.sel-p2{border-color:#ff4444;background:rgba(255,68,68,0.14);}
.team-swatch{width:32px;height:32px;border-radius:50%;margin:0 auto 5px;border:2px solid rgba(255,255,255,0.2);}
.team-name{font-size:9px;letter-spacing:2px;color:#aaa;}
.play-btn{padding:12px 40px;font-size:18px;font-family:inherit;border:none;border-radius:10px;cursor:pointer;letter-spacing:4px;background:linear-gradient(45deg,#ffd700,#ff8800);color:#1a1a2e;font-weight:bold;opacity:0.4;pointer-events:none;transition:all 0.2s;}
.play-btn.ready{opacity:1;pointer-events:auto;}
.play-btn.ready:hover{transform:scale(1.06);}
#gameScreen{flex-direction:column;align-items:center;}
.scorebar{width:100%;max-width:960px;display:flex;align-items:center;justify-content:space-between;padding:6px 18px 3px;}
.score-side{display:flex;align-items:center;gap:9px;}
.score-side.right{flex-direction:row-reverse;}
.team-circle{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);}
.score-info{display:flex;flex-direction:column;}
.score-info.right{text-align:right;}
.sname{font-size:11px;letter-spacing:2px;}
.snum{font-size:36px;line-height:1;}
.tcenter{text-align:center;}
.ttime{font-size:30px;color:#ffd700;letter-spacing:4px;}
.tround{font-size:9px;color:#333;letter-spacing:4px;margin-top:1px;}
#gameCanvas{display:block;border-radius:4px;}
.ctrl-bar{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;padding:2px 18px 4px;font-size:10px;color:#2a2a2a;}
.ck{display:inline-block;background:rgba(255,255,255,0.06);border:1px solid #1a1a1a;border-radius:3px;padding:1px 4px;font-family:monospace;font-size:9px;}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;z-index:10;}
.omsg{font-size:68px;letter-spacing:10px;animation:pop .3s cubic-bezier(.17,.67,.12,1.5) forwards;opacity:0;}
.osub{font-size:26px;color:#aaa;animation:pop .3s .15s cubic-bezier(.17,.67,.12,1.5) forwards;opacity:0;}
@keyframes pop{0%{opacity:0;transform:scale(0.4);}100%{opacity:1;transform:scale(1);}}
.cgoal{color:#ffd700;filter:drop-shadow(0 0 20px #ffd700);}
.cround{color:#44aaff;filter:drop-shadow(0 0 20px #44aaff);}
#trophyOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:12px;}
#trophyOverlay.show{display:flex;}
.tov-title{font-size:44px;letter-spacing:8px;color:#ffd700;}
.tov-count{font-size:110px;color:#fff;line-height:1;}
.tov-sub{font-size:13px;letter-spacing:4px;color:#555;}
#tournPickScreen{gap:14px;padding:18px;}
#bracketScreen{gap:9px;padding:14px;overflow-y:auto;}
.bracket-title{font-size:28px;letter-spacing:8px;color:#ffd700;}
.bracket-rounds{display:flex;gap:16px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
.bracket-col{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:180px;}
.bracket-col-title{font-size:9px;letter-spacing:4px;color:#333;margin-bottom:2px;}
.bm{background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.08);border-radius:9px;padding:7px 11px;width:180px;display:flex;flex-direction:column;gap:4px;}
.bm.your-match{border-color:#ffd700;background:rgba(255,215,0,0.07);}
.bm.done{opacity:0.65;}
.bm-row{display:flex;align-items:center;gap:6px;}
.bm-sw{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.bm-tn{font-size:10px;letter-spacing:1px;flex:1;}
.bm-g{font-size:12px;font-weight:bold;color:#ffd700;min-width:12px;text-align:right;}
.bm-win .bm-tn{color:#ffd700;}
.bm-los .bm-tn{color:#333;text-decoration:line-through;}
.bm-tbd .bm-tn{color:#2a2a2a;}
.bm-div{height:1px;background:rgba(255,255,255,0.05);}
.your-tag{font-size:8px;letter-spacing:3px;color:#ffd700;text-align:center;margin-top:1px;}
.bracket-btns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;}
.bracket-info{font-size:10px;color:#333;letter-spacing:3px;}
.tourn-pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.tp-card{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.08);border-radius:9px;padding:10px;text-align:center;cursor:pointer;transition:all 0.2s;}
.tp-card:hover{transform:scale(1.05);border-color:rgba(255,255,255,0.28);}
.tp-card.sel{border-color:#ffd700;background:rgba(255,215,0,0.1);}
.tp-sw{width:38px;height:38px;border-radius:50%;margin:0 auto 6px;border:2px solid rgba(255,255,255,0.18);}
.tp-nm{font-size:9px;letter-spacing:2px;color:#bbb;}
</style>
</head>
<body>

<div id="titleScreen" class="screen active">
    <div class="game-title">ICE HOCKEY</div>
    <div class="subtitle">WORLD CHAMPIONSHIP</div>
    <button class="menu-btn btn-blue" onclick="goTeamSelect(false)">VS AI</button>
    <button class="menu-btn btn-red" onclick="goTeamSelect(true)">2 PLAYERS</button>
    <button class="menu-btn btn-gold" onclick="goTournPick()">TOURNAMENT</button>
    <button class="trophy-btn" onclick="showTrophies()">🏆 <span id="trophyTitleCount">0</span> TROPHIES</button>
</div>

<div id="trophyOverlay">
    <div class="tov-title">🏆 TROPHIES</div>
    <div class="tov-count" id="trophyCount">0</div>
    <div class="tov-sub">TOURNAMENT CHAMPIONSHIPS WON</div>
    <button class="menu-btn btn-blue" onclick="hideTrophies()" style="margin-top:16px;">CLOSE</button>
</div>

<div id="teamSelect" class="screen">
    <div class="ts-title">CHOOSE YOUR TEAMS</div>
    <div class="ts-panels">
        <div class="ts-panel">
            <div class="ts-label">— PLAYER 1 (A / D / E / R) —</div>
            <div class="team-grid" id="gridP1"></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:26px;">
            <div style="font-size:26px;color:#1a1a1a;">VS</div>
            <button class="play-btn" id="playBtn" onclick="startGame()">PLAY!</button>
            <button onclick="goTitle()" style="background:rgba(255,255,255,0.05);border:2px solid #222;color:#555;padding:6px 18px;border-radius:8px;cursor:pointer;font-size:11px;font-family:inherit;letter-spacing:2px;">← BACK</button>
        </div>
        <div class="ts-panel">
            <div class="ts-label" id="p2tsLabel">— PLAYER 2 (← / → / / / .) —</div>
            <div class="team-grid" id="gridP2"></div>
        </div>
    </div>
</div>

<div id="tournPickScreen" class="screen">
    <div class="bracket-title">TOURNAMENT</div>
    <div style="font-size:11px;letter-spacing:4px;color:#555;margin-bottom:6px;">CHOOSE YOUR TEAM</div>
    <div class="tourn-pick-grid" id="tournPickGrid"></div>
    <div style="display:flex;gap:9px;margin-top:8px;">
        <button class="menu-btn btn-gold" id="tournStartBtn" onclick="initTournament()" style="opacity:0.4;pointer-events:none;padding:9px 32px;font-size:15px;">START!</button>
        <button onclick="goTitle()" style="background:rgba(255,255,255,0.05);border:2px solid #222;color:#555;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:11px;font-family:inherit;letter-spacing:2px;">← BACK</button>
    </div>
</div>

<div id="bracketScreen" class="screen">
    <div class="bracket-title">🏆 TOURNAMENT</div>
    <div class="bracket-rounds" id="bracketRounds"></div>
    <div class="bracket-info" id="bracketInfo"></div>
    <div class="bracket-btns" id="bracketBtns"></div>
</div>

<div id="gameScreen" class="screen">
    <div class="scorebar">
        <div class="score-side">
            <canvas class="team-circle" id="badge1" width="26" height="26"></canvas>
            <div class="score-info"><div class="sname" id="tname1">-</div><div class="snum" id="score1">0</div></div>
        </div>
        <div class="tcenter">
            <div class="ttime" id="timerDisplay">0:20</div>
            <div class="tround" id="roundDisplay">ROUND 1 / 6</div>
        </div>
        <div class="score-side right">
            <canvas class="team-circle" id="badge2" width="26" height="26"></canvas>
            <div class="score-info right"><div class="sname" id="tname2">-</div><div class="snum" id="score2">0</div></div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="ctrl-bar">
        <div style="color:#44aaff;">P1: <span class="ck">A</span><span class="ck">D</span> Move &nbsp;<span class="ck">E</span> Shot &nbsp;<span class="ck">R</span> Tackle</div>
        <button onclick="goTitle()" style="background:rgba(255,255,255,0.04);border:1px solid #111;color:#333;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:10px;font-family:inherit;">← MENU</button>
        <div id="p2ctrl" style="color:#ff4444;">P2: <span class="ck">←</span><span class="ck">→</span> Move &nbsp;<span class="ck">/</span> Shot &nbsp;<span class="ck">.</span> Tackle</div>
    </div>
</div>
<div id="overlay"></div>

<script>
const TEAMS=[
    {name:'CANADA', short:'CAN',color:'#CC0000',accent:'#FFFFFF'},
    {name:'USA',    short:'USA',color:'#002868',accent:'#BF0A30'},
    {name:'RUSSIA', short:'RUS',color:'#E31E24',accent:'#003DA5'},
    {name:'SWEDEN', short:'SWE',color:'#006AA7',accent:'#FECC02'},
    {name:'FINLAND',short:'FIN',color:'#003F87',accent:'#FFFFFF'},
    {name:'CZECH',  short:'CZE',color:'#D7141A',accent:'#11457E'},
    {name:'GERMANY',short:'GER',color:'#333',   accent:'#DD0000'},
    {name:'SLOVAKIA',short:'SVK',color:'#003DA5',accent:'#EE1C25'},
];

// ═══ GAME CONSTANTS ═══════════════════════════════════
const GAME_W=900, GAME_H=500;
const GOAL_LINE_L=62, GOAL_LINE_R=GAME_W-62;
const PUCK_R=7;
const PLAYER_SPD=3.6;
const SHOT_PWR=15;
const TACKLE_RANGE=50;
const GRAVITY=0.22;
const FRICTION=0.987;
const ROUND_TIME=20;
const TOTAL_ROUNDS=6;

// ═══ 3/4 PERSPECTIVE PROJECTION ═══════════════════════
// The ice is shown as a trapezoid — wide at bottom (near), narrow at top (far)
// depth: 0 = near viewer (bottom of screen), 1 = far from viewer (top)
const CAM={
    nearY:455, farY:100,
    nearL:0,   nearR:GAME_W,
    farL:160,  farR:740,
};
function toScreen(gx,depth){
    const sy=CAM.nearY+(CAM.farY-CAM.nearY)*depth;
    const xL=CAM.nearL+(CAM.farL-CAM.nearL)*depth;
    const xR=CAM.nearR+(CAM.farR-CAM.nearR)*depth;
    const sx=xL+(gx/GAME_W)*(xR-xL);
    const sc=1.0-depth*0.52;
    return{sx,sy,sc};
}
// Depth assigned to each player index (0=near/big, 1=far/small)
const PDEPTH=[0.5, 0.28, 0.50, 0.72, 0.5, 0.72, 0.50, 0.28];
// players: [goalie0, fwd0a, fwd0b, fwd0c, goalie1, fwd1a, fwd1b, fwd1c]

// ═══ GAME STATE ════════════════════════════════════════
let vsAI,selP1=-1,selP2=-1,tsVsAI=false;
let players=[],puck,scores=[0,0],currentRound=1,timerSecs=ROUND_TIME;
let timerInterval,gameActive=false,roundActive=false;
let p1Player=null,p2Player=null;
let puckDepth=0.5;
const keys={};

// ═══ TOURNAMENT ════════════════════════════════════════
let isTournament=false,tournPlayerTeam=-1,tournSeeds=[];
let tournPhase='QF',tournPlayerMatchIdx=0;
let tRes={QF:[],SF:[],'3rd':null,F:null};

// ═══ CANVAS ════════════════════════════════════════════
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
function resize(){
    const mw=Math.min(window.innerWidth-20,GAME_W);
    canvas.width=GAME_W; canvas.height=GAME_H;
    canvas.style.width=mw+'px';
    canvas.style.height=(mw*GAME_H/GAME_W)+'px';
}
window.addEventListener('resize',resize); resize();

// ═══ HELPERS ══════════════════════════════════════════
function rrect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r);
    ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
}
function getTrophies(){return parseInt(localStorage.getItem('hockey_trophies')||'0');}
function addTrophy(){localStorage.setItem('hockey_trophies',getTrophies()+1);refreshTrophyBtn();}
function refreshTrophyBtn(){document.getElementById('trophyTitleCount').textContent=getTrophies();}
function showTrophies(){document.getElementById('trophyCount').textContent=getTrophies();document.getElementById('trophyOverlay').classList.add('show');}
function hideTrophies(){document.getElementById('trophyOverlay').classList.remove('show');}
refreshTrophyBtn();

// ═══ TEAM SELECT ══════════════════════════════════════
function buildGrids(){
    ['gridP1','gridP2'].forEach((gid,pi)=>{
        const g=document.getElementById(gid); g.innerHTML='';
        TEAMS.forEach((t,i)=>{
            const d=document.createElement('div'); d.className='team-card'; d.id=`tc-${pi+1}-${i}`;
            const sw=document.createElement('div'); sw.className='team-swatch';
            sw.style.background=`linear-gradient(135deg,${t.color} 45%,${t.accent})`;
            const nm=document.createElement('div'); nm.className='team-name'; nm.textContent=t.name;
            d.appendChild(sw); d.appendChild(nm); d.onclick=()=>selTeam(pi+1,i); g.appendChild(d);
        });
    });
}
function selTeam(pl,idx){
    if(pl===1){selP1=idx;document.querySelectorAll('[id^="tc-1-"]').forEach(e=>e.classList.remove('sel-p1'));document.getElementById(`tc-1-${idx}`).classList.add('sel-p1');}
    else{selP2=idx;document.querySelectorAll('[id^="tc-2-"]').forEach(e=>e.classList.remove('sel-p2'));document.getElementById(`tc-2-${idx}`).classList.add('sel-p2');}
    if(selP1>=0&&selP2>=0)document.getElementById('playBtn').classList.add('ready');
}
function goTeamSelect(two){
    isTournament=false; tsVsAI=!two; selP1=-1; selP2=-1;
    document.getElementById('playBtn').classList.remove('ready');
    document.getElementById('p2tsLabel').textContent=tsVsAI?'— A.I. OPPONENT —':'— PLAYER 2 (← / → / / / .) —';
    buildGrids();
    if(tsVsAI){selP2=Math.floor(Math.random()*TEAMS.length);selTeam(2,selP2);}
    showScreen('teamSelect');
}

// ═══ TOURNAMENT ════════════════════════════════════════
function goTournPick(){
    isTournament=true; tournPlayerTeam=-1;
    const btn=document.getElementById('tournStartBtn');
    btn.style.opacity='0.4'; btn.style.pointerEvents='none';
    const g=document.getElementById('tournPickGrid'); g.innerHTML='';
    TEAMS.forEach((t,i)=>{
        const d=document.createElement('div'); d.className='tp-card'; d.id=`tp-${i}`;
        const sw=document.createElement('div'); sw.className='tp-sw';
        sw.style.background=`linear-gradient(135deg,${t.color} 45%,${t.accent})`;
        const nm=document.createElement('div'); nm.className='tp-nm'; nm.textContent=t.name;
        d.appendChild(sw); d.appendChild(nm);
        d.onclick=()=>{tournPlayerTeam=i;document.querySelectorAll('.tp-card').forEach(c=>c.classList.remove('sel'));d.classList.add('sel');btn.style.opacity='1';btn.style.pointerEvents='auto';};
        g.appendChild(d);
    });
    showScreen('tournPickScreen');
}
function initTournament(){
    if(tournPlayerTeam<0)return;
    const all=[0,1,2,3,4,5,6,7];
    for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
    tournSeeds=all; tournPhase='QF'; tRes={QF:[],SF:[],'3rd':null,F:null};
    const qfM=getQFMatches();
    tournPlayerMatchIdx=qfM.findIndex(m=>m.includes(tournPlayerTeam));
    qfM.forEach((m,i)=>{if(i!==tournPlayerMatchIdx)tRes.QF[i]=simMatch(m[0],m[1]);});
    showBracket();
}
function getQFMatches(){return[[tournSeeds[0],tournSeeds[7]],[tournSeeds[1],tournSeeds[6]],[tournSeeds[2],tournSeeds[5]],[tournSeeds[3],tournSeeds[4]]];}
function getSFMatches(){const q=tRes.QF;return[[q[0].w,q[1].w],[q[2].w,q[3].w]];}
function get3rdMatch(){const s=tRes.SF;return[s[0].t1===s[0].w?s[0].t2:s[0].t1,s[1].t1===s[1].w?s[1].t2:s[1].t1];}
function getFMatch(){const s=tRes.SF;return[s[0].w,s[1].w];}
function simMatch(t1,t2){let s1=Math.floor(Math.random()*6),s2=Math.floor(Math.random()*6);while(s1===s2){s1=Math.floor(Math.random()*6);s2=Math.floor(Math.random()*6);}return{t1,t2,s1,s2,w:s1>s2?t1:t2};}
function showBracket(){
    showScreen('bracketScreen');
    const c=document.getElementById('bracketRounds'); c.innerHTML='';
    const cols=[
        {title:'QUARTERFINALS',mCount:4,matches:getQFMatches(),results:tRes.QF,key:'QF'},
        {title:'SEMIFINALS',mCount:2,matches:tRes.QF.length===4?getSFMatches():null,results:tRes.SF,key:'SF'},
        {title:'3RD PLACE',mCount:1,matches:tRes.SF.length===2?[get3rdMatch()]:null,results:tRes['3rd']?[tRes['3rd']]:null,key:'3rd'},
        {title:'FINAL',mCount:1,matches:tRes.SF.length===2?[getFMatch()]:null,results:tRes.F?[tRes.F]:null,key:'F'},
    ];
    cols.forEach(col=>{
        const colDiv=document.createElement('div'); colDiv.className='bracket-col';
        const ct=document.createElement('div'); ct.className='bracket-col-title'; ct.textContent=col.title; colDiv.appendChild(ct);
        for(let mi=0;mi<col.mCount;mi++){
            const card=document.createElement('div'); card.className='bm';
            const m=col.matches?col.matches[mi]:null;
            const r=col.results?col.results[mi]:null;
            const isYours=m&&m.includes(tournPlayerTeam)&&col.key===tournPhase;
            if(isYours)card.classList.add('your-match');
            if(r)card.classList.add('done');
            if(m){
                [0,1].forEach(si=>{
                    const tIdx=m[si],t=TEAMS[tIdx];
                    const isW=r&&r.w===tIdx,isL=r&&r.w!==tIdx;
                    const row=document.createElement('div');
                    row.className='bm-row'+(isW?' bm-win':isL?' bm-los':'');
                    const sw=document.createElement('div'); sw.className='bm-sw';
                    sw.style.background=`linear-gradient(135deg,${t.color},${t.accent})`;
                    const tn=document.createElement('div'); tn.className='bm-tn';
                    tn.textContent=t.name+(tIdx===tournPlayerTeam?' ★':'');
                    const gl=document.createElement('div'); gl.className='bm-g';
                    if(r)gl.textContent=si===0?r.s1:r.s2;
                    row.appendChild(sw); row.appendChild(tn); row.appendChild(gl); card.appendChild(row);
                    if(si===0){const dv=document.createElement('div');dv.className='bm-div';card.appendChild(dv);}
                });
                if(isYours){const yt=document.createElement('div');yt.className='your-tag';yt.textContent='▶ YOUR MATCH';card.appendChild(yt);}
            } else {
                [0,1].forEach(si=>{
                    const row=document.createElement('div'); row.className='bm-row bm-tbd';
                    const tn=document.createElement('div'); tn.className='bm-tn'; tn.textContent='TBD';
                    row.appendChild(tn); card.appendChild(row);
                    if(si===0){const dv=document.createElement('div');dv.className='bm-div';card.appendChild(dv);}
                });
            }
            colDiv.appendChild(card);
        }
        c.appendChild(colDiv);
    });
    const info=document.getElementById('bracketInfo');
    const btns=document.getElementById('bracketBtns'); btns.innerHTML='';
    const ph=tRes[tournPhase];
    const playerResult=ph?(Array.isArray(ph)?ph[tournPlayerMatchIdx]:ph):null;
    if(tournPhase==='done'){
        info.textContent='TOURNAMENT COMPLETE';
        addBtn(btns,'← MENU','btn-blue',goTitle);
    } else if(playerResult){
        advanceTournament(playerResult.w===tournPlayerTeam);
    } else {
        const pn={QF:'QUARTERFINALS',SF:'SEMIFINALS','3rd':'3RD PLACE MATCH',F:'THE FINAL'};
        info.textContent=pn[tournPhase]||'';
        addBtn(btns,'PLAY YOUR MATCH','btn-gold',playTournMatch);
        addBtn(btns,'QUIT','btn-red',goTitle);
    }
}
function addBtn(c,t,cl,fn){const b=document.createElement('button');b.className='menu-btn '+cl;b.textContent=t;b.onclick=fn;c.appendChild(b);}
function advanceTournament(won){
    const info=document.getElementById('bracketInfo');
    const btns=document.getElementById('bracketBtns'); btns.innerHTML='';
    if(tournPhase==='QF'){
        getQFMatches().forEach((m,i)=>{if(!tRes.QF[i])tRes.QF[i]=simMatch(m[0],m[1]);});
        info.textContent=won?'YOU ADVANCE TO SEMIFINALS!':'ELIMINATED IN QUARTERFINALS';
        if(won)addBtn(btns,'CONTINUE →','btn-gold',()=>{tournPhase='SF';tournPlayerMatchIdx=getSFMatches().findIndex(m=>m.includes(tournPlayerTeam));getSFMatches().forEach((m,i)=>{if(i!==tournPlayerMatchIdx)tRes.SF[i]=simMatch(m[0],m[1]);});showBracket();});
        else addBtn(btns,'← MENU','btn-blue',goTitle);
    } else if(tournPhase==='SF'){
        getSFMatches().forEach((m,i)=>{if(!tRes.SF[i])tRes.SF[i]=simMatch(m[0],m[1]);});
        if(won){info.textContent='YOU REACH THE FINAL!';addBtn(btns,'PLAY THE FINAL →','btn-gold',()=>{tournPhase='F';tournPlayerMatchIdx=0;showBracket();});}
        else{info.textContent='YOU PLAY FOR 3RD PLACE';addBtn(btns,'3RD PLACE MATCH →','btn-blue',()=>{tournPhase='3rd';tournPlayerMatchIdx=0;showBracket();});}
    } else if(tournPhase==='3rd'){
        const fm=getFMatch();if(!tRes.F)tRes.F=simMatch(fm[0],fm[1]);
        info.textContent=won?'BRONZE MEDAL!':'4TH PLACE';
        tournPhase='done'; addBtn(btns,'SEE RESULTS','btn-gold',showBracket); addBtn(btns,'← MENU','btn-blue',goTitle);
    } else if(tournPhase==='F'){
        const tm=get3rdMatch();if(!tRes['3rd'])tRes['3rd']=simMatch(tm[0],tm[1]);
        if(won){info.textContent='CHAMPION! 🏆';addTrophy();}
        else info.textContent='RUNNER UP — GREAT RUN!';
        tournPhase='done'; addBtn(btns,'SEE RESULTS','btn-gold',showBracket); addBtn(btns,'← MENU','btn-blue',goTitle);
    }
}
function playTournMatch(){
    const mf={QF:()=>getQFMatches()[tournPlayerMatchIdx],SF:()=>getSFMatches()[tournPlayerMatchIdx],'3rd':()=>get3rdMatch(),F:()=>getFMatch()};
    const m=mf[tournPhase]();
    selP1=tournPlayerTeam; selP2=m[0]===tournPlayerTeam?m[1]:m[0];
    vsAI=true; scores=[0,0]; currentRound=1;
    setupGameDisplay(); gameActive=true;
    showScreen('gameScreen'); resetPositions(0); beginRound();
}
function finishTournMatch(won){
    const mf={QF:()=>getQFMatches()[tournPlayerMatchIdx],SF:()=>getSFMatches()[tournPlayerMatchIdx],'3rd':()=>get3rdMatch(),F:()=>getFMatch()};
    const m=mf[tournPhase]();
    const w=won?tournPlayerTeam:(m[0]===tournPlayerTeam?m[1]:m[0]);
    const res={t1:m[0],t2:m[1],s1:scores[0],s2:scores[1],w};
    if(tournPhase==='QF')tRes.QF[tournPlayerMatchIdx]=res;
    else if(tournPhase==='SF')tRes.SF[tournPlayerMatchIdx]=res;
    else if(tournPhase==='3rd')tRes['3rd']=res;
    else tRes.F=res;
    setTimeout(()=>{document.getElementById('overlay').innerHTML='';document.getElementById('overlay').style.pointerEvents='none';showBracket();},2600);
}

// ═══ PLAYER FACTORY ═══════════════════════════════════
function makePlayer(x,team,isGoalie){
    return{x,team,isGoalie,dir:team===0?1:-1,hasPuck:false,shotTimer:0,tackleTimer:0,tackleFlash:0,aiTimer:0};
}

// ═══ GAME SETUP ═══════════════════════════════════════
function drawBadge(id,t){
    const bc=document.getElementById(id),bx=bc.getContext('2d');

}
function setupGameDisplay(){
    drawBadge('badge1',TEAMS[selP1]); drawBadge('badge2',TEAMS[selP2]);
    document.getElementById('tname1').textContent=TEAMS[selP1].short;
    document.getElementById('tname2').textContent=TEAMS[selP2].short;
    document.getElementById('tname1').style.color=TEAMS[selP1].color;
    document.getElementById('tname2').style.color=TEAMS[selP2].color;
    document.getElementById('p2ctrl').style.opacity=vsAI?'0.25':'1';
}
function startGame(){
    if(selP1<0||selP2<0)return;
    vsAI=tsVsAI; scores=[0,0]; currentRound=1;
    setupGameDisplay(); gameActive=true;
    showScreen('gameScreen'); resetPositions(0); beginRound();
}
function resetPositions(starterTeam){
    players=[
        makePlayer(GOAL_LINE_L+26,0,true),
        makePlayer(200,0,false),
        makePlayer(320,0,false),
        makePlayer(420,0,false),
        makePlayer(GOAL_LINE_R-26,1,true),
        makePlayer(700,1,false),
        makePlayer(580,1,false),
        makePlayer(480,1,false),
    ];
    p1Player=players[1]; p2Player=players[5];
    puck={x:GAME_W/2,vx:0,vy:0,owner:null};
    puckDepth=0.5;
    const st=players.filter(p=>p.team===starterTeam&&!p.isGoalie)[0];
    st.hasPuck=true; puck.owner=st;

}

// ═══ ROUND / TIMER ════════════════════════════════════
function beginRound(){
    roundActive=false; timerSecs=ROUND_TIME;
    updateRoundDisplay(); updateTimerDisplay();
    showOverlay(`<div class="omsg cround">ROUND ${currentRound}</div><div class="osub">${TOTAL_ROUNDS} ROUNDS</div>`,1300);
    setTimeout(()=>{showOverlay('<div class="omsg" style="color:#ffd700">FACE OFF!</div>',700);setTimeout(()=>{roundActive=true;runTimer();},700);},1300);
}
function runTimer(){
    clearInterval(timerInterval);
    timerInterval=setInterval(()=>{
        if(!roundActive){clearInterval(timerInterval);return;}
        timerSecs=Math.max(0,timerSecs-1); updateTimerDisplay();
        if(timerSecs<=0){clearInterval(timerInterval);endRound();}
    },1000);
}
function endRound(){
    roundActive=false; clearInterval(timerInterval);
    if(currentRound>=TOTAL_ROUNDS){endGame();return;}
    currentRound++;
    showOverlay('<div class="omsg cround">NEXT ROUND</div>',900);
    setTimeout(()=>{resetPositions(0);beginRound();},2000);
}
function endGame(){
    gameActive=false;
    const s0=scores[0],s1=scores[1];
    if(isTournament){
        const won=s0>s1||(s0===s1&&Math.random()<0.5);
        showOverlay(won?`<div class="omsg cgoal">YOU WIN!</div><div class="osub">${s0} – ${s1}</div>`:`<div class="omsg" style="color:#ff4444">YOU LOSE</div><div class="osub">${s0} – ${s1}</div>`,0);
        finishTournMatch(won); return;
    }
    let html;
    if(s0===s1)html=`<div class="omsg" style="color:#ffd700">TIE!</div><div class="osub">${s0} – ${s1}</div>`;
    else{const wi=s0>s1?0:1;const wt=TEAMS[wi===0?selP1:selP2];html=`<div class="omsg" style="color:${wt.color};filter:drop-shadow(0 0 22px ${wt.color})">${wt.name} WINS!</div><div class="osub">${s0} – ${s1}</div>`;}
    const ov=document.getElementById('overlay');
    ov.innerHTML=html+'<div class="osub" style="font-size:16px;color:#333;cursor:pointer;margin-top:14px;animation:none;opacity:1">Click to play again</div>';
    ov.style.pointerEvents='auto';
    ov.onclick=()=>{ov.onclick=null;ov.style.pointerEvents='none';ov.innerHTML='';startGame();};
}
function handleGoal(scorer){
    if(!roundActive)return;
    roundActive=false; clearInterval(timerInterval);
    scores[scorer]++; updateScoreDisplay();
    showOverlay(`<div class="omsg cgoal">GOAL!</div><div class="osub">${TEAMS[scorer===0?selP1:selP2].name}</div>`,2000);
    setTimeout(()=>{
        if(!gameActive)return;
        if(timerSecs<=0){endRound();return;}
        resetPositions(scorer); roundActive=true; runTimer();
    },2300);
}

// ═══ 3D SCENE DRAWING ════════════════════════════════
function drawScene(){
    // Background — arena/crowd
    ctx.fillStyle='#0c0420'; ctx.fillRect(0,0,GAME_W,GAME_H);

    // Crowd in stands (above far boards)
    const crowd=ctx.createLinearGradient(0,0,0,CAM.farY+30);
    crowd.addColorStop(0,'#1a0830'); crowd.addColorStop(1,'#200a38');
    ctx.fillStyle=crowd; ctx.fillRect(0,0,GAME_W,CAM.farY+30);
    ctx.fillStyle='rgba(255,255,255,0.025)';
    for(let i=0;i<90;i++)ctx.fillRect((i*137)%GAME_W,(i*71)%60+10,2,2);

    // Far dasher boards (the back wall of the rink)
    ctx.fillStyle='#ddd'; ctx.fillRect(CAM.farL,CAM.farY,CAM.farR-CAM.farL,14);
    ctx.fillStyle='#cc0000'; ctx.fillRect(CAM.farL,CAM.farY+14,CAM.farR-CAM.farL,6);
    ctx.fillStyle='#ddd'; ctx.fillRect(CAM.farL,CAM.farY+20,CAM.farR-CAM.farL,4);

    // Left side board (far → near trapezoid side)
    ctx.fillStyle='rgba(200,200,200,0.4)';
    ctx.beginPath();
    ctx.moveTo(CAM.farL,CAM.farY);
    ctx.lineTo(CAM.nearL,CAM.nearY);
    ctx.lineTo(CAM.nearL,CAM.nearY+16);
    ctx.lineTo(CAM.farL,CAM.farY+24);
    ctx.closePath(); ctx.fill();

    // Right side board
    ctx.beginPath();
    ctx.moveTo(CAM.farR,CAM.farY);
    ctx.lineTo(CAM.nearR,CAM.nearY);
    ctx.lineTo(CAM.nearR,CAM.nearY+16);
    ctx.lineTo(CAM.farR,CAM.farY+24);
    ctx.closePath(); ctx.fill();

    // ICE SURFACE — perspective trapezoid
    const iceGrad=ctx.createLinearGradient(0,CAM.farY,0,CAM.nearY);
    iceGrad.addColorStop(0,'#c8e8f8'); iceGrad.addColorStop(1,'#e4f4ff');
    ctx.fillStyle=iceGrad;
    ctx.beginPath();
    ctx.moveTo(CAM.nearL,CAM.nearY);
    ctx.lineTo(CAM.nearR,CAM.nearY);
    ctx.lineTo(CAM.farR,CAM.farY);
    ctx.lineTo(CAM.farL,CAM.farY);
    ctx.closePath(); ctx.fill();

    // Near boards (front wall)
    ctx.fillStyle='rgba(240,240,240,0.18)';
    ctx.fillRect(CAM.nearL,CAM.nearY,CAM.nearR-CAM.nearL,16);
    ctx.fillStyle='rgba(180,0,0,0.3)';
    ctx.fillRect(CAM.nearL,CAM.nearY+16,CAM.nearR-CAM.nearL,6);

    // Ice lines — drawn in perspective
    drawIceLine(GAME_W*0.3,'rgba(0,61,165,0.35)',4);
    drawIceLine(GAME_W*0.7,'rgba(0,61,165,0.35)',4);
    drawIceLine(GAME_W*0.5,'rgba(180,0,0,0.35)',4);
    drawIceLine(GOAL_LINE_L,'rgba(180,0,0,0.5)',3);
    drawIceLine(GOAL_LINE_R,'rgba(180,0,0,0.5)',3);

    // Face-off circles in perspective
    drawIceCircle(GAME_W*0.5,0.5,55,'rgba(180,0,0,0.25)',2);
    drawIceCircle(GAME_W*0.25,0.4,40,'rgba(0,61,165,0.2)',1.5);
    drawIceCircle(GAME_W*0.25,0.6,40,'rgba(0,61,165,0.2)',1.5);
    drawIceCircle(GAME_W*0.75,0.4,40,'rgba(0,61,165,0.2)',1.5);
    drawIceCircle(GAME_W*0.75,0.6,40,'rgba(0,61,165,0.2)',1.5);

    // Goals
    drawGoal(0); drawGoal(1);

    // Ice shadow near boards
    const shadow=ctx.createLinearGradient(0,CAM.nearY-4,0,CAM.nearY+16);
    shadow.addColorStop(0,'rgba(0,0,0,0)'); shadow.addColorStop(1,'rgba(0,0,0,0.12)');
    ctx.fillStyle=shadow; ctx.fillRect(0,CAM.nearY-4,GAME_W,20);
}

function drawIceLine(gx,color,lw){
    const near=toScreen(gx,0), far=toScreen(gx,1);
    ctx.strokeStyle=color; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(near.sx,near.sy); ctx.lineTo(far.sx,far.sy); ctx.stroke();
}

function drawIceCircle(gx,depth,r,color,lw){
    const pos=toScreen(gx,depth);
    // Project radius using perspective scale
    const rx=r*pos.sc, ry=r*pos.sc*0.35; // flatten vertically for perspective
    ctx.strokeStyle=color; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.ellipse(pos.sx,pos.sy,rx,ry,0,0,Math.PI*2); ctx.stroke();
}

function drawGoal(side){
    const isLeft=side===0;
    const postGX=isLeft?GOAL_LINE_L:GOAL_LINE_R;
    const netGX=isLeft?-NET_GX:GOAL_LINE_R+NET_GX;

    // Goal posts span depth 0.28 to 0.72
    const d1=0.28, d2=0.72;
    const p1=toScreen(postGX,d1), p2=toScreen(postGX,d2);
    const b1=toScreen(isLeft?GOAL_LINE_L-NET_GX:GOAL_LINE_R+NET_GX,d1);
    const b2=toScreen(isLeft?GOAL_LINE_L-NET_GX:GOAL_LINE_R+NET_GX,d2);

    // Net interior
    ctx.fillStyle='rgba(190,215,255,0.22)';
    ctx.beginPath();
    ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy);
    ctx.lineTo(b2.sx,b2.sy); ctx.lineTo(b1.sx,b1.sy);
    ctx.closePath(); ctx.fill();

    // Net mesh
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=0.8;
    for(let i=0;i<=4;i++){
        const t=i/4;
        const a={sx:p1.sx+(p2.sx-p1.sx)*t,sy:p1.sy+(p2.sy-p1.sy)*t};
        const bb={sx:b1.sx+(b2.sx-b1.sx)*t,sy:b1.sy+(b2.sy-b1.sy)*t};
        ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(bb.sx,bb.sy); ctx.stroke();
    }
    for(let i=1;i<=3;i++){
        const t=i/4;
        const top={sx:p1.sx+(b1.sx-p1.sx)*t,sy:p1.sy+(b1.sy-p1.sy)*t};
        const bot={sx:p2.sx+(b2.sx-p2.sx)*t,sy:p2.sy+(b2.sy-p2.sy)*t};
        ctx.beginPath(); ctx.moveTo(top.sx,top.sy); ctx.lineTo(bot.sx,bot.sy); ctx.stroke();
    }

    // Goal post bar (connecting the two posts)
    ctx.strokeStyle='#cc0000'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy); ctx.stroke();

    // Back bar
    ctx.strokeStyle='#aa0000'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(b1.sx,b1.sy); ctx.lineTo(b2.sx,b2.sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(b1.sx,b1.sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p2.sx,p2.sy); ctx.lineTo(b2.sx,b2.sy); ctx.stroke();
}

const NET_GX=44; // how far behind the goal line the net extends (in game units)

// ═══ PLAYER & PUCK DRAWING ════════════════════════════
function darken(hex,amt){
    let n=parseInt(hex.replace('#',''),16);
    if(isNaN(n))return hex;
    return`rgb(${Math.max(0,(n>>16)-amt)},${Math.max(0,((n>>8)&0xff)-amt)},${Math.max(0,(n&0xff)-amt)})`;
}

function drawPlayer(p){
    const t=TEAMS[p.team===0?selP1:selP2];
    if(!t)return;
    const idx=players.indexOf(p);
    const depth=PDEPTH[idx]!==undefined?PDEPTH[idx]:0.5;
    const pos=toScreen(p.x,depth);
    const sc=pos.sc;
    const d=p.dir;

    ctx.save();
    ctx.translate(pos.sx,pos.sy);
    ctx.scale(sc,sc);

    // Tackle flash
    if(p.tackleFlash>0){
        ctx.fillStyle=`rgba(255,220,0,${p.tackleFlash/14})`;
        ctx.beginPath(); ctx.ellipse(0,-22,26,28,0,0,Math.PI*2); ctx.fill();
    }

    if(p.isGoalie){
        ctx.fillStyle='rgba(0,0,60,0.15)'; ctx.beginPath(); ctx.ellipse(2,4,18,4,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#e0e0e0'; ctx.fillRect(-11,-14,10,14); ctx.fillRect(1,-14,10,14);
        ctx.fillStyle='#888'; ctx.fillRect(-12,0,11,5); ctx.fillRect(1,0,11,5);
        ctx.fillStyle=t.color; rrect(-12,-42,24,28,4); ctx.fill();
        ctx.fillStyle=t.accent; ctx.globalAlpha=0.4; ctx.fillRect(-12,-32,24,5); ctx.globalAlpha=1;
        ctx.fillStyle='rgba(255,255,255,0.18)'; rrect(-10,-40,20,14,3); ctx.fill();
        ctx.fillStyle=t.color; ctx.beginPath(); ctx.arc(0,-50,10,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#333'; ctx.fillRect(-8,-58,16,8);
        ctx.strokeStyle='rgba(200,200,200,0.9)'; ctx.lineWidth=1.5;
        for(let bx=-6;bx<=6;bx+=3){ctx.beginPath();ctx.moveTo(bx,-57);ctx.lineTo(bx,-50);ctx.stroke();}
        ctx.fillStyle='#d4a837'; ctx.fillRect(d*10,-30,d*14,10);
        ctx.fillStyle='#c09030'; ctx.beginPath(); ctx.arc(d*-14,-26,8,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='bold 9px Impact'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('G',0,-30);
    } else {
        ctx.fillStyle='rgba(0,0,60,0.15)'; ctx.beginPath(); ctx.ellipse(2,4,13,3,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#666'; ctx.fillRect(-6,0,14,5);
        ctx.fillStyle=darken(t.color,28); ctx.fillRect(-5,-18,5,18); ctx.fillRect(1,-18,5,18);
        ctx.fillStyle=t.color; rrect(-9,-40,18,22,3); ctx.fill();
        ctx.fillStyle=t.accent; ctx.globalAlpha=0.45; ctx.fillRect(-9,-34,18,5); ctx.globalAlpha=1;
        ctx.fillStyle=t.color; ctx.beginPath(); ctx.arc(0,-48,8,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(20,20,20,0.75)'; ctx.fillRect(-5,-53,10,6);
        ctx.strokeStyle='#5a3510'; ctx.lineWidth=3; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(d*3,-28); ctx.lineTo(d*21,0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d*14,-1); ctx.lineTo(d*25,-1); ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='bold 7px Impact'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(t.short,0,-30);
    }

    // P1 ring (blue)
    if(p===p1Player&&!p.isGoalie){
        ctx.strokeStyle='#44aaff'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(0,-22,22,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle='#44aaff'; ctx.font='bold 11px Impact'; ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText('P1',0,-47);
    }
    // P2 ring (red) — only in 2P mode
    if(!vsAI&&p===p2Player&&!p.isGoalie){
        ctx.strokeStyle='#ff4444'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(0,-22,22,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle='#ff4444'; ctx.font='bold 11px Impact'; ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText('P2',0,-47);
    }

    ctx.restore();
}

function drawPuck(){
    // Puck depth follows its owner
    if(puck.owner){
        const idx=players.indexOf(puck.owner);
        puckDepth=PDEPTH[idx]!==undefined?PDEPTH[idx]:0.5;
    }
    const px=puck.owner?puck.owner.x+puck.owner.dir*(puck.owner.isGoalie?22:20):puck.x;
    const pos=toScreen(px,puckDepth);
    const r=PUCK_R*pos.sc;
    ctx.save(); ctx.translate(pos.sx,pos.sy);
    ctx.fillStyle='rgba(0,0,30,0.25)'; ctx.beginPath(); ctx.ellipse(r*0.3,r*0.6,r*1.2,r*0.4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.arc(-r*0.25,-r*0.25,r*0.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
}

// ═══ PHYSICS ══════════════════════════════════════════
function updatePhysics(){
    if(!roundActive)return;
    for(const p of players){if(p.shotTimer>0)p.shotTimer--;if(p.tackleTimer>0)p.tackleTimer--;if(p.tackleFlash>0)p.tackleFlash--;}

    // P1
    if(p1Player){
        let dx=0; if(keys['KeyA'])dx=-1; if(keys['KeyD'])dx=1;
        if(dx){p1Player.x=clamp(p1Player.x+dx*PLAYER_SPD);p1Player.dir=dx>0?1:-1;}
    }
    // P2 (2P only)
    if(!vsAI&&p2Player){
        let dx=0; if(keys['ArrowLeft'])dx=-1; if(keys['ArrowRight'])dx=1;
        if(dx){p2Player.x=clamp(p2Player.x+dx*PLAYER_SPD);p2Player.dir=dx>0?1:-1;}
    }

    // AI
    for(const p of players){
        if(p.isGoalie)updateGoalieAI(p);
        else if(p===p1Player||(!vsAI&&p===p2Player)){}
        else if(vsAI&&p.team===1)updateForwardAI(p);
        else updateTeammateAI(p);
    }

    // Puck physics (1D — left/right only)
    if(!puck.owner){
        puck.x+=puck.vx; puck.vx*=FRICTION;
        if(Math.abs(puck.vx)<0.1)puck.vx=0;

        // Left goal
        if(puck.x<GOAL_LINE_L-PUCK_R){
            if(puck.x<-PUCK_R){handleGoal(1);return;}
        }
        // Right goal
        if(puck.x>GOAL_LINE_R+PUCK_R){
            if(puck.x>GAME_W+PUCK_R){handleGoal(0);return;}
        }

        // Pickup
        for(const p of players){
            if(!p.isGoalie&&p.tackleTimer===0){
                if(Math.abs(puck.x-p.x)<22){p.hasPuck=true;puck.owner=p;break;}
            }
        }
        // Goalie save
        for(const p of players){
            if(p.isGoalie&&Math.abs(puck.x-p.x)<32){
                p.hasPuck=true;puck.owner=p;
                setTimeout(()=>{if(puck.owner===p)doShoot(p,true);},200);break;
            }
        }
    }
}
function clamp(x){return Math.max(GOAL_LINE_L+22,Math.min(GOAL_LINE_R-22,x));}

// ═══ AI ═══════════════════════════════════════════════
function updateGoalieAI(g){
    const homeX=g.team===0?GOAL_LINE_L+20:GOAL_LINE_R-20;
    g.x+=(homeX-g.x)*0.09;
    if(g.hasPuck)doShoot(g,true);
}
function updateForwardAI(f){
    const opp=players.find(p=>p.team!==f.team&&p.hasPuck&&!p.isGoalie);
    const tmC=players.find(p=>p.team===f.team&&!p.isGoalie&&p.hasPuck&&p!==f);
    if(f.hasPuck){
        f.dir=-1;
        if(f.x>GOAL_LINE_L+110)f.x=Math.max(GOAL_LINE_L+28,f.x-PLAYER_SPD*0.92);
        else if(f.shotTimer===0)doShoot(f,false);
    } else if(!puck.owner){
        if(Math.abs(f.x-puck.x)>6)f.x+=Math.sign(puck.x-f.x)*PLAYER_SPD*0.9;
        f.dir=Math.sign(puck.x-f.x)||f.dir;
    } else if(opp){
        f.x+=Math.sign(opp.x-f.x)*PLAYER_SPD*0.85; f.dir=Math.sign(opp.x-f.x)||f.dir;
        if(Math.abs(f.x-opp.x)<TACKLE_RANGE&&f.tackleTimer===0)doTackle(f);
    } else if(tmC){
        const sx=tmC.x-90; if(Math.abs(f.x-sx)>20)f.x+=Math.sign(sx-f.x)*PLAYER_SPD*0.7;
    }
    f.x=Math.max(GOAL_LINE_L+20,Math.min(GOAL_LINE_R-20,f.x));
}
function updateTeammateAI(f){
    const opp=players.find(p=>p.team!==f.team&&p.hasPuck&&!p.isGoalie);
    const car=players.find(p=>p.team===f.team&&!p.isGoalie&&p.hasPuck);
    if(!puck.owner&&!car){
        if(Math.abs(f.x-puck.x)>8)f.x+=Math.sign(puck.x-f.x)*PLAYER_SPD*0.8;
        f.dir=Math.sign(puck.x-f.x)||f.dir;
    } else if(opp){
        if(Math.abs(f.x-opp.x)>28)f.x+=Math.sign(opp.x-f.x)*PLAYER_SPD*0.75;
        if(Math.abs(f.x-opp.x)<TACKLE_RANGE&&f.tackleTimer===0)doTackle(f);
    } else if(car){
        const dir=f.team===0?1:-1,sx=car.x+dir*85;
        if(Math.abs(f.x-sx)>24)f.x+=Math.sign(sx-f.x)*PLAYER_SPD*0.65;
    }
    f.x=Math.max(GOAL_LINE_L+20,Math.min(GOAL_LINE_R-20,f.x));
}

// ═══ ACTIONS ══════════════════════════════════════════
function doShoot(p,isClear){
    if(p.shotTimer>0||!p.hasPuck)return;
    p.hasPuck=false; puck.owner=null;
    puck.x=p.x+p.dir*(p.isGoalie?30:22);
    if(isClear){const cd=p.team===0?1:-1;puck.vx=cd*11+(Math.random()-0.5)*3;}
    else puck.vx=p.dir*SHOT_PWR;
    p.shotTimer=28;
}
function doTackle(att){
    if(att.tackleTimer>0)return;
    att.tackleTimer=46;
    const opps=players.filter(p=>p.team!==att.team&&p.hasPuck&&!p.isGoalie);
    if(!opps.length)return;
    const def=opps.reduce((a,b)=>Math.abs(a.x-att.x)<Math.abs(b.x-att.x)?a:b);
    if(Math.abs(att.x-def.x)<TACKLE_RANGE){
        def.hasPuck=false; puck.owner=null;
        puck.vx=(Math.random()-0.5)*12;
        puck.x=def.x; att.tackleFlash=14;
    }
}

// ═══ HUD ══════════════════════════════════════════════
function updateScoreDisplay(){document.getElementById('score1').textContent=scores[0];document.getElementById('score2').textContent=scores[1];}
function updateTimerDisplay(){const m=Math.floor(timerSecs/60),s=timerSecs%60;document.getElementById('timerDisplay').textContent=m+':'+(s<10?'0':'')+s;document.getElementById('timerDisplay').style.color=timerSecs<=10?'#ff4444':'#ffd700';}
function updateRoundDisplay(){document.getElementById('roundDisplay').textContent=`ROUND ${currentRound} / ${TOTAL_ROUNDS}`;}
function showOverlay(html,dur){
    const ov=document.getElementById('overlay');
    ov.innerHTML=html;ov.style.pointerEvents='none';
    if(dur)setTimeout(()=>{if(!ov.innerHTML.includes('play again')&&!ov.innerHTML.includes('LOSE')&&!ov.innerHTML.includes('WIN!'))ov.innerHTML='';},dur);
}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goTitle(){
    gameActive=false;roundActive=false;clearInterval(timerInterval);isTournament=false;
    document.getElementById('overlay').innerHTML='';document.getElementById('overlay').style.pointerEvents='none';
    showScreen('titleScreen');
}

// ═══ INPUT ════════════════════════════════════════════
document.addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
    if(keys[e.code])return; keys[e.code]=true;
    if(e.code==='Escape'){goTitle();return;}
    if(!roundActive||!players.length)return;
    if(e.code==='KeyE'&&p1Player)doShoot(p1Player,false);
    if(e.code==='KeyR'&&p1Player)doTackle(p1Player);
    if(!vsAI){
        if(e.code==='Slash'&&p2Player)doShoot(p2Player,false);
        if(e.code==='Period'&&p2Player)doTackle(p2Player);
    }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

// ═══ GAME LOOP ════════════════════════════════════════
function gameLoop(){
    ctx.clearRect(0,0,GAME_W,GAME_H);
    if(players.length)updatePhysics();
    drawScene();
    if(players.length){
        // Draw far players first (depth sorting)
        const sorted=[...players].sort((a,b)=>PDEPTH[players.indexOf(b)]-PDEPTH[players.indexOf(a)]);
        sorted.forEach(drawPlayer);
        drawPuck();
    }
    requestAnimationFrame(gameLoop);
}
gameLoop();
