<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICE HOCKEY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0514;font-family:'Impact','Arial Black',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;color:#fff;user-select:none;}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;position:absolute;width:100%;height:100%;}
.screen.active{display:flex;}
.game-title{font-size:clamp(50px,9vw,100px);letter-spacing:16px;background:linear-gradient(180deg,#88ddff,#0077cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px #44aaff);}
.subtitle{font-size:16px;color:#444;letter-spacing:10px;margin-bottom:28px;}
.menu-btn{padding:13px 48px;font-size:20px;font-family:inherit;border:none;border-radius:10px;cursor:pointer;font-weight:bold;letter-spacing:3px;text-transform:uppercase;transition:all 0.2s;margin:6px;}
.btn-blue{background:linear-gradient(45deg,#44aaff,#0055cc);color:#fff;box-shadow:0 6px 24px rgba(68,170,255,0.5);}
.btn-blue:hover{transform:scale(1.07);}
.btn-red{background:linear-gradient(45deg,#ff4444,#cc0000);color:#fff;box-shadow:0 6px 24px rgba(255,68,68,0.5);}
.btn-red:hover{transform:scale(1.07);}
.btn-gold{background:linear-gradient(45deg,#ffd700,#ff8800);color:#1a1a2e;box-shadow:0 6px 24px rgba(255,215,0,0.4);}
.btn-gold:hover{transform:scale(1.07);}
#teamSelect{gap:14px;padding:20px;}
.ts-title{font-size:26px;letter-spacing:8px;color:#88ddff;margin-bottom:8px;}
.ts-panels{display:flex;gap:38px;align-items:flex-start;}
.ts-panel{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:250px;}
.ts-label{font-size:13px;letter-spacing:4px;color:#555;}
.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.team-card{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 14px;text-align:center;cursor:pointer;transition:all 0.2s;min-width:108px;}
.team-card:hover{transform:scale(1.06);border-color:rgba(255,255,255,0.4);}
.team-card.sel-p1{border-color:#44aaff;background:rgba(68,170,255,0.15);}
.team-card.sel-p2{border-color:#ff4444;background:rgba(255,68,68,0.15);}
.team-swatch{width:36px;height:36px;border-radius:50%;margin:0 auto 6px;border:3px solid rgba(255,255,255,0.2);}
.team-name{font-size:10px;letter-spacing:2px;color:#bbb;}
.play-btn{padding:13px 44px;font-size:20px;font-family:inherit;border:none;border-radius:10px;cursor:pointer;letter-spacing:4px;background:linear-gradient(45deg,#ffd700,#ff8800);color:#1a1a2e;font-weight:bold;opacity:0.4;pointer-events:none;transition:all 0.2s;}
.play-btn.ready{opacity:1;pointer-events:auto;}
.play-btn.ready:hover{transform:scale(1.07);}
#gameScreen{flex-direction:column;align-items:center;}
.scorebar{width:100%;max-width:920px;display:flex;align-items:center;justify-content:space-between;padding:8px 20px 4px;}
.score-side{display:flex;align-items:center;gap:10px;}
.score-side.right{flex-direction:row-reverse;}
.team-circle{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);}
.score-info{display:flex;flex-direction:column;}
.score-info.right{text-align:right;}
.sname{font-size:12px;letter-spacing:2px;}
.snum{font-size:38px;line-height:1;}
.tcenter{text-align:center;}
.ttime{font-size:32px;color:#ffd700;letter-spacing:4px;}
.tround{font-size:10px;color:#333;letter-spacing:4px;margin-top:2px;}
#gameCanvas{display:block;}
.ctrl-bar{width:100%;max-width:920px;display:flex;justify-content:space-between;align-items:center;padding:3px 20px 5px;font-size:11px;color:#2a2a2a;}
.ck{display:inline-block;background:rgba(255,255,255,0.06);border:1px solid #1a1a1a;border-radius:3px;padding:1px 5px;color:#555;font-family:monospace;font-size:10px;}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;z-index:10;}
.omsg{font-size:72px;letter-spacing:10px;animation:pop .3s cubic-bezier(.17,.67,.12,1.5) forwards;opacity:0;}
.osub{font-size:28px;color:#aaa;animation:pop .3s .15s cubic-bezier(.17,.67,.12,1.5) forwards;opacity:0;}
@keyframes pop{0%{opacity:0;transform:scale(0.4);}100%{opacity:1;transform:scale(1);}}
.cgoal{color:#ffd700;filter:drop-shadow(0 0 22px #ffd700);}
.cround{color:#44aaff;filter:drop-shadow(0 0 22px #44aaff);}

/* TOURNAMENT STYLES */
#tournPickScreen{gap:16px;padding:20px;}
#bracketScreen{gap:12px;padding:20px;overflow-y:auto;}
.bracket-title{font-size:32px;letter-spacing:8px;color:#ffd700;filter:drop-shadow(0 0 14px #ffd700);}
.bracket-round-label{font-size:13px;letter-spacing:5px;color:#555;margin-bottom:4px;}
.bracket-rounds{display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
.bracket-col{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:220px;}
.bracket-col-title{font-size:11px;letter-spacing:4px;color:#333;margin-bottom:4px;}
.bm{background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 14px;width:220px;display:flex;flex-direction:column;gap:6px;}
.bm.your-match{border-color:#ffd700;background:rgba(255,215,0,0.06);}
.bm.done{border-color:rgba(255,255,255,0.04);}
.bm-row{display:flex;align-items:center;gap:8px;}
.bm-swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,0.15);}
.bm-tname{font-size:12px;letter-spacing:2px;flex:1;}
.bm-goals{font-size:14px;font-weight:bold;color:#ffd700;min-width:18px;text-align:right;}
.bm-winner .bm-tname{color:#ffd700;}
.bm-loser .bm-tname{color:#333;text-decoration:line-through;}
.bm-tbd .bm-tname{color:#333;}
.bm-divider{height:1px;background:rgba(255,255,255,0.05);margin:2px 0;}
.your-tag{font-size:9px;letter-spacing:3px;color:#ffd700;text-align:center;}
.bracket-btns{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center;}
.bracket-info{font-size:12px;color:#333;letter-spacing:2px;text-align:center;}
.tourn-pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0;}
.tp-card{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:all 0.2s;}
.tp-card:hover{transform:scale(1.06);border-color:rgba(255,255,255,0.35);}
.tp-card.sel{border-color:#ffd700;background:rgba(255,215,0,0.1);}
.tp-swatch{width:44px;height:44px;border-radius:50%;margin:0 auto 8px;border:3px solid rgba(255,255,255,0.2);}
.tp-name{font-size:10px;letter-spacing:2px;color:#bbb;}
</style>
</head>
<body>

<!-- TITLE -->
<div id="titleScreen" class="screen active">
    <div class="game-title">ICE HOCKEY</div>
    <div class="subtitle">WORLD CHAMPIONSHIP</div>
    <button class="menu-btn btn-blue" onclick="goTeamSelect(false)">VS AI</button>
    <button class="menu-btn btn-red" onclick="goTeamSelect(true)">2 PLAYERS</button>
    <button class="menu-btn btn-gold" onclick="goTournPick()">TOURNAMENT</button>
</div>

<!-- TEAM SELECT (VS AI / 2P) -->
<div id="teamSelect" class="screen">
    <div class="ts-title">CHOOSE YOUR TEAMS</div>
    <div class="ts-panels">
        <div class="ts-panel">
            <div class="ts-label">— PLAYER 1 —</div>
            <div class="team-grid" id="gridP1"></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:28px;">
            <div style="font-size:28px;color:#1a1a1a;">VS</div>
            <button class="play-btn" id="playBtn" onclick="startGame()">PLAY!</button>
            <button onclick="goTitle()" style="background:rgba(255,255,255,0.05);border:2px solid #222;color:#555;padding:7px 20px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;letter-spacing:2px;">← BACK</button>
        </div>
        <div class="ts-panel">
            <div class="ts-label" id="p2tsLabel">— PLAYER 2 —</div>
            <div class="team-grid" id="gridP2"></div>
        </div>
    </div>
</div>

<!-- TOURNAMENT TEAM PICK -->
<div id="tournPickScreen" class="screen">
    <div class="bracket-title">TOURNAMENT</div>
    <div style="font-size:13px;letter-spacing:4px;color:#555;margin-bottom:8px;">CHOOSE YOUR TEAM</div>
    <div class="tourn-pick-grid" id="tournPickGrid"></div>
    <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="menu-btn btn-gold" id="tournStartBtn" onclick="initTournament()" style="opacity:0.4;pointer-events:none;padding:10px 36px;font-size:16px;">START!</button>
        <button onclick="goTitle()" style="background:rgba(255,255,255,0.05);border:2px solid #222;color:#555;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;letter-spacing:2px;">← BACK</button>
    </div>
</div>

<!-- BRACKET SCREEN -->
<div id="bracketScreen" class="screen">
    <div class="bracket-title">🏆 TOURNAMENT</div>
    <div class="bracket-rounds" id="bracketRounds"></div>
    <div class="bracket-info" id="bracketInfo"></div>
    <div class="bracket-btns" id="bracketBtns"></div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
    <div class="scorebar">
        <div class="score-side">
            <canvas class="team-circle" id="badge1" width="28" height="28"></canvas>
            <div class="score-info">
                <div class="sname" id="tname1">-</div>
                <div class="snum" id="score1">0</div>
            </div>
        </div>
        <div class="tcenter">
            <div class="ttime" id="timerDisplay">0:20</div>
            <div class="tround" id="roundDisplay">ROUND 1 / 6</div>
        </div>
        <div class="score-side right">
            <canvas class="team-circle" id="badge2" width="28" height="28"></canvas>
            <div class="score-info right">
                <div class="sname" id="tname2">-</div>
                <div class="snum" id="score2">0</div>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="ctrl-bar">
        <div>P1: <span class="ck">A</span><span class="ck">D</span> Move &nbsp;<span class="ck">E</span> Shot &nbsp;<span class="ck">R</span> Tackle</div>
        <button onclick="goTitle()" style="background:rgba(255,255,255,0.05);border:1px solid #111;color:#333;padding:3px 12px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;">← MENU</button>
        <div id="p2ctrl">P2: <span class="ck">←</span><span class="ck">→</span> Move &nbsp;<span class="ck">/</span> Shot &nbsp;<span class="ck">.</span> Tackle</div>
    </div>
</div>

<div id="overlay"></div>

<script>
// ═══ TEAMS ════════════════════════════════════════════
const TEAMS=[
    {name:'CANADA',   short:'CAN', color:'#CC0000', accent:'#FFFFFF'},
    {name:'USA',      short:'USA', color:'#002868', accent:'#BF0A30'},
    {name:'RUSSIA',   short:'RUS', color:'#E31E24', accent:'#003DA5'},
    {name:'SWEDEN',   short:'SWE', color:'#006AA7', accent:'#FECC02'},
    {name:'FINLAND',  short:'FIN', color:'#003F87', accent:'#FFFFFF'},
    {name:'CZECH',    short:'CZE', color:'#D7141A', accent:'#11457E'},
    {name:'GERMANY',  short:'GER', color:'#222222', accent:'#DD0000'},
    {name:'SLOVAKIA', short:'SVK', color:'#003DA5', accent:'#EE1C25'},
];

// ═══ CONSTANTS ════════════════════════════════════════
const GAME_W=900, GAME_H=480;
const ICE_Y=360;
const BOARD_Y=ICE_Y-18;
const GOAL_H=80;
const GOAL_TOP=ICE_Y-GOAL_H;
const GOAL_LINE_L=62;
const GOAL_LINE_R=GAME_W-62;
const NET_DEPTH=44;
const PUCK_R=8;
const PLAYER_SPD=3.6;
const SHOT_PWR=16;
const TACKLE_RANGE=48;
const GRAVITY=0.28;
const FRICTION=0.987;
const ROUND_TIME=20;
const TOTAL_ROUNDS=6;

// ═══ GAME STATE ════════════════════════════════════════
let vsAI, selP1=-1, selP2=-1, tsVsAI=false;
let players=[], puck, scores=[0,0], currentRound=1, timerSecs=ROUND_TIME;
let timerInterval, gameActive=false, roundActive=false;
const keys={};

// ═══ TOURNAMENT STATE ═════════════════════════════════
let isTournament=false;
let tournPlayerTeam=-1;
let tournSeeds=[];          // 8 team indices shuffled
let tournRound=0;           // 0=QF, 1=SF, 2=F
let tournResults=[];        // per round: [{t1,t2,s1,s2,winner}, ...]
let tournPlayerMatchIdx=0;  // which match in current round is the player's

const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

function resize(){
    const mw=Math.min(window.innerWidth-20,GAME_W);
    canvas.width=GAME_W; canvas.height=GAME_H;
    canvas.style.width=mw+'px'; canvas.style.height=(mw*GAME_H/GAME_W)+'px';
}
window.addEventListener('resize',resize); resize();

// ═══ TEAM SELECT (VS AI / 2P) ═════════════════════════
function buildGrids(){
    ['gridP1','gridP2'].forEach((gid,pi)=>{
        const g=document.getElementById(gid); g.innerHTML='';
        TEAMS.forEach((t,i)=>{
            const d=document.createElement('div'); d.className='team-card'; d.id=`tc-${pi+1}-${i}`;
            const sw=document.createElement('div'); sw.className='team-swatch';
            sw.style.background=`linear-gradient(135deg,${t.color} 45%,${t.accent})`;
            const nm=document.createElement('div'); nm.className='team-name'; nm.textContent=t.name;
            d.appendChild(sw); d.appendChild(nm); d.onclick=()=>selTeam(pi+1,i);
            g.appendChild(d);
        });
    });
}
function selTeam(pl,idx){
    if(pl===1){selP1=idx;document.querySelectorAll('[id^="tc-1-"]').forEach(e=>e.classList.remove('sel-p1'));document.getElementById(`tc-1-${idx}`).classList.add('sel-p1');}
    else{selP2=idx;document.querySelectorAll('[id^="tc-2-"]').forEach(e=>e.classList.remove('sel-p2'));document.getElementById(`tc-2-${idx}`).classList.add('sel-p2');}
    if(selP1>=0&&selP2>=0) document.getElementById('playBtn').classList.add('ready');
}
function goTeamSelect(two){
    isTournament=false;
    tsVsAI=!two; selP1=-1; selP2=-1;
    document.getElementById('playBtn').classList.remove('ready');
    document.getElementById('p2tsLabel').textContent=tsVsAI?'— A.I. —':'— PLAYER 2 —';
    buildGrids();
    if(tsVsAI){selP2=Math.floor(Math.random()*TEAMS.length);selTeam(2,selP2);}
    showScreen('teamSelect');
}

// ═══ TOURNAMENT ════════════════════════════════════════
function goTournPick(){
    isTournament=true;
    tournPlayerTeam=-1;
    const btn=document.getElementById('tournStartBtn');
    btn.style.opacity='0.4'; btn.style.pointerEvents='none';
    const g=document.getElementById('tournPickGrid'); g.innerHTML='';
    TEAMS.forEach((t,i)=>{
        const d=document.createElement('div'); d.className='tp-card'; d.id=`tp-${i}`;
        const sw=document.createElement('div'); sw.className='tp-swatch';
        sw.style.background=`linear-gradient(135deg,${t.color} 45%,${t.accent})`;
        const nm=document.createElement('div'); nm.className='tp-name'; nm.textContent=t.name;
        d.appendChild(sw); d.appendChild(nm);
        d.onclick=()=>{
            tournPlayerTeam=i;
            document.querySelectorAll('.tp-card').forEach(c=>c.classList.remove('sel'));
            d.classList.add('sel');
            btn.style.opacity='1'; btn.style.pointerEvents='auto';
        };
        g.appendChild(d);
    });
    showScreen('tournPickScreen');
}

function initTournament(){
    if(tournPlayerTeam<0) return;
    // Shuffle all 8 teams
    const all=[0,1,2,3,4,5,6,7];
    for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
    tournSeeds=all;
    tournRound=0;
    tournResults=[];
    // QF: 0v7, 1v6, 2v5, 3v4
    // Find player's match
    tournPlayerMatchIdx=tournSeeds.findIndex((t,i)=>t===tournPlayerTeam&&i<4);
    if(tournPlayerMatchIdx<0){
        // Player is in the bottom half (seed 4-7)
        tournPlayerMatchIdx=tournSeeds.slice(4).findIndex(t=>t===tournPlayerTeam);
        // Match index maps to: seed4→match3, seed5→match2, seed6→match1, seed7→match0
        // Actually recalc properly
    }
    // Recalculate: matches are (seed[0] v seed[7]), (seed[1] v seed[6]), (seed[2] v seed[5]), (seed[3] v seed[4])
    const qfMatches=[[tournSeeds[0],tournSeeds[7]],[tournSeeds[1],tournSeeds[6]],[tournSeeds[2],tournSeeds[5]],[tournSeeds[3],tournSeeds[4]]];
    tournPlayerMatchIdx=qfMatches.findIndex(m=>m.includes(tournPlayerTeam));
    buildRoundMatches();
    showBracket();
}

function buildRoundMatches(){
    // Returns array of [t1,t2] for current round
    if(tournRound===0){
        return [[tournSeeds[0],tournSeeds[7]],[tournSeeds[1],tournSeeds[6]],[tournSeeds[2],tournSeeds[5]],[tournSeeds[3],tournSeeds[4]]];
    } else if(tournRound===1){
        const qf=tournResults[0];
        return [[qf[0].winner,qf[1].winner],[qf[2].winner,qf[3].winner]];
    } else {
        const sf=tournResults[1];
        return [[sf[0].winner,sf[1].winner]];
    }
}

function simulateMatch(t1,t2){
    // Random score 0-5 each
    let s1=Math.floor(Math.random()*6), s2=Math.floor(Math.random()*6);
    // Break ties
    while(s1===s2){s1=Math.floor(Math.random()*6);s2=Math.floor(Math.random()*6);}
    return {t1,t2,s1,s2,winner:s1>s2?t1:t2};
}

function showBracket(){
    showScreen('bracketScreen');
    const roundNames=['QUARTERFINALS','SEMIFINALS','FINAL'];
    const roundShorts=['QF','SF','F'];
    const matches=buildRoundMatches();
    const playerEliminated=tournRound>0&&!tournResults[tournRound-1]?.some(r=>r.winner===tournPlayerTeam);

    const container=document.getElementById('bracketRounds');
    container.innerHTML='';

    // Build all 3 columns (QF, SF, F) showing what we know
    for(let r=0;r<=2;r++){
        const col=document.createElement('div'); col.className='bracket-col';
        const colTitle=document.createElement('div'); colTitle.className='bracket-col-title';
        colTitle.textContent=roundNames[r]; col.appendChild(colTitle);

        const numMatches=r===0?4:r===1?2:1;
        for(let mi=0;mi<numMatches;mi++){
            const card=document.createElement('div'); card.className='bm';
            let m=null, result=null;

            if(tournResults[r]&&tournResults[r][mi]){
                result=tournResults[r][mi];
                m=[result.t1,result.t2];
            } else if(r===tournRound&&mi<matches.length){
                m=matches[mi];
            }

            if(m){
                const isPlayer=m.includes(tournPlayerTeam);
                const isYourMatch=isPlayer&&r===tournRound&&!playerEliminated;
                if(isYourMatch) card.classList.add('your-match');
                if(result) card.classList.add('done');

                [0,1].forEach(side=>{
                    const row=document.createElement('div');
                    const tIdx=m[side];
                    const t=TEAMS[tIdx];
                    const isW=result&&result.winner===tIdx;
                    const isL=result&&result.winner!==tIdx;
                    row.className='bm-row'+(isW?' bm-winner':isL?' bm-loser':'');
                    const sw=document.createElement('div'); sw.className='bm-swatch';
                    sw.style.background=`linear-gradient(135deg,${t.color} 45%,${t.accent})`;
                    const nm=document.createElement('div'); nm.className='bm-tname'; nm.textContent=t.name+(tIdx===tournPlayerTeam?' ★':'');
                    const gl=document.createElement('div'); gl.className='bm-goals';
                    if(result) gl.textContent=side===0?result.s1:result.s2;
                    row.appendChild(sw); row.appendChild(nm); row.appendChild(gl);
                    card.appendChild(row);
                    if(side===0){const div=document.createElement('div');div.className='bm-divider';card.appendChild(div);}
                });
                if(isYourMatch){const yt=document.createElement('div');yt.className='your-tag';yt.textContent='▶ YOUR MATCH';card.appendChild(yt);}
            } else {
                // TBD
                const row=document.createElement('div'); row.className='bm-row bm-tbd';
                const nm=document.createElement('div'); nm.className='bm-tname'; nm.textContent='TBD';
                row.appendChild(nm); card.appendChild(row);
                const div=document.createElement('div'); div.className='bm-divider'; card.appendChild(div);
                const row2=document.createElement('div'); row2.className='bm-row bm-tbd';
                const nm2=document.createElement('div'); nm2.className='bm-tname'; nm2.textContent='TBD';
                row2.appendChild(nm2); card.appendChild(row2);
            }
            col.appendChild(card);
        }
        container.appendChild(col);
    }

    // Info and buttons
    const info=document.getElementById('bracketInfo');
    const btns=document.getElementById('bracketBtns');
    btns.innerHTML='';

    // Check if current round has a player match to play
    const allRoundResultsReady=tournResults[tournRound]&&tournResults[tournRound].length===matches.length;
    const playerMatchResult=tournResults[tournRound]?.find(r=>r.t1===tournPlayerTeam||r.t2===tournPlayerTeam);

    if(playerEliminated){
        info.textContent='YOU WERE ELIMINATED';
        // Simulate remaining rounds for show
        const backBtn=document.createElement('button'); backBtn.className='menu-btn btn-blue'; backBtn.textContent='← MENU'; backBtn.onclick=goTitle;
        btns.appendChild(backBtn);
    } else if(!allRoundResultsReady&&!playerMatchResult){
        // Player needs to play their match
        info.textContent=roundNames[tournRound]+' — PLAY YOUR MATCH';
        const playBtn=document.createElement('button'); playBtn.className='menu-btn btn-gold'; playBtn.textContent='PLAY NOW!'; playBtn.onclick=playTournMatch;
        btns.appendChild(playBtn);
        const backBtn=document.createElement('button'); backBtn.className='menu-btn btn-red'; backBtn.textContent='QUIT'; backBtn.onclick=goTitle;
        btns.appendChild(backBtn);
    } else if(allRoundResultsReady){
        const winner=tournResults[tournRound].find(r=>r.t1===tournPlayerTeam||r.t2===tournPlayerTeam)?.winner;
        const advBtn=document.createElement('button');
        if(tournRound>=2){
            // Tournament over
            if(winner===tournPlayerTeam){
                info.textContent='🏆 YOU ARE CHAMPION!';
                advBtn.className='menu-btn btn-gold'; advBtn.textContent='PLAY AGAIN';
            } else {
                info.textContent='TOURNAMENT COMPLETE';
                advBtn.className='menu-btn btn-blue'; advBtn.textContent='MENU';
            }
            advBtn.onclick=goTitle;
        } else {
            info.textContent='ADVANCING TO '+(tournRound===0?'SEMIFINALS':'FINAL');
            advBtn.className='menu-btn btn-gold'; advBtn.textContent='CONTINUE →';
            advBtn.onclick=()=>{tournRound++;buildRoundMatchesAndSim();};
        }
        btns.appendChild(advBtn);
    }
}

function buildRoundMatchesAndSim(){
    // Simulate all OTHER matches in new round, player plays theirs
    const matches=buildRoundMatches();
    if(!tournResults[tournRound]) tournResults[tournRound]=[];
    // Find player's match in new round
    tournPlayerMatchIdx=matches.findIndex(m=>m.includes(tournPlayerTeam));
    // Simulate non-player matches
    matches.forEach((m,i)=>{
        if(i!==tournPlayerMatchIdx) tournResults[tournRound][i]=simulateMatch(m[0],m[1]);
    });
    showBracket();
}

function playTournMatch(){
    const matches=buildRoundMatches();
    const m=matches[tournPlayerMatchIdx];
    selP1=tournPlayerTeam;
    selP2=m[0]===tournPlayerTeam?m[1]:m[0];
    vsAI=true;
    scores=[0,0]; currentRound=1;
    drawBadge('badge1',TEAMS[selP1]); drawBadge('badge2',TEAMS[selP2]);
    document.getElementById('tname1').textContent=TEAMS[selP1].short;
    document.getElementById('tname2').textContent=TEAMS[selP2].short;
    document.getElementById('tname1').style.color=TEAMS[selP1].color;
    document.getElementById('tname2').style.color=TEAMS[selP2].color;
    document.getElementById('p2ctrl').style.opacity='0.3';
    gameActive=true;
    showScreen('gameScreen');
    resetPositions(0);
    beginRound();
}

function finishTournMatch(playerWon){
    const matches=buildRoundMatches();
    const m=matches[tournPlayerMatchIdx];
    if(!tournResults[tournRound]) tournResults[tournRound]=[];
    const s0=scores[0], s1=scores[1];
    const winner=playerWon?tournPlayerTeam:(m[0]===tournPlayerTeam?m[1]:m[0]);
    tournResults[tournRound][tournPlayerMatchIdx]={t1:m[0],t2:m[1],s1:s0,s2:s1,winner};

    // Simulate other matches in same round
    const numMatches=buildRoundMatches().length;
    for(let i=0;i<numMatches;i++){
        if(i!==tournPlayerMatchIdx&&!tournResults[tournRound][i]){
            const om=buildRoundMatches()[i];
            tournResults[tournRound][i]=simulateMatch(om[0],om[1]);
        }
    }

    // Brief celebration then back to bracket
    setTimeout(()=>{
        document.getElementById('overlay').innerHTML='';
        document.getElementById('overlay').style.pointerEvents='none';
        showBracket();
    },2500);
}

// ═══ PLAYER FACTORY ═══════════════════════════════════
function makePlayer(x,team,isGoalie){
    return{x, y:ICE_Y, vy:0,
        team, isGoalie,
        dir:team===0?1:-1,
        hasPuck:false,
        shotTimer:0, tackleTimer:0, tackleFlash:0,
        aiTimer:0,
    };
}

// ═══ GAME SETUP ═══════════════════════════════════════
function drawBadge(id,t){
    const bc=document.getElementById(id),bx=bc.getContext('2d');
    bx.clearRect(0,0,28,28);
    const g=bx.createLinearGradient(0,0,28,28);
    g.addColorStop(0,t.color); g.addColorStop(1,t.accent);
    bx.fillStyle=g; bx.beginPath(); bx.arc(14,14,12,0,Math.PI*2); bx.fill();
}

function startGame(){
    if(selP1<0||selP2<0) return;
    vsAI=tsVsAI; scores=[0,0]; currentRound=1;
    drawBadge('badge1',TEAMS[selP1]); drawBadge('badge2',TEAMS[selP2]);
    document.getElementById('tname1').textContent=TEAMS[selP1].short;
    document.getElementById('tname2').textContent=TEAMS[selP2].short;
    document.getElementById('tname1').style.color=TEAMS[selP1].color;
    document.getElementById('tname2').style.color=TEAMS[selP2].color;
    document.getElementById('p2ctrl').style.opacity=vsAI?'0.3':'1';
    gameActive=true;
    showScreen('gameScreen');
    resetPositions(0);
    beginRound();
}

function resetPositions(starterTeam){
    players=[
        makePlayer(GOAL_LINE_L+28, 0, true),
        makePlayer(210, 0, false),
        makePlayer(330, 0, false),
        makePlayer(430, 0, false),
        makePlayer(GOAL_LINE_R-28, 1, true),
        makePlayer(690, 1, false),
        makePlayer(570, 1, false),
        makePlayer(470, 1, false),
    ];
    puck={x:GAME_W/2, y:ICE_Y-PUCK_R, vx:0, vy:0, owner:null};
    const starter=players.filter(p=>p.team===starterTeam&&!p.isGoalie)[0];
    starter.hasPuck=true; puck.owner=starter;
    updateScoreDisplay();
}

function beginRound(){
    roundActive=false; timerSecs=ROUND_TIME;
    updateRoundDisplay(); updateTimerDisplay();
    showOverlay(`<div class="omsg cround">ROUND ${currentRound}</div><div class="osub">${TOTAL_ROUNDS} ROUNDS TOTAL</div>`,1300);
    setTimeout(()=>{
        showOverlay('<div class="omsg" style="color:#ffd700">FACE OFF!</div>',700);
        setTimeout(()=>{roundActive=true;runTimer();},700);
    },1300);
}

function runTimer(){
    clearInterval(timerInterval);
    timerInterval=setInterval(()=>{
        if(!roundActive){clearInterval(timerInterval);return;}
        timerSecs=Math.max(0,timerSecs-1);
        updateTimerDisplay();
        if(timerSecs<=0){clearInterval(timerInterval);endRound();}
    },1000);
}

function endRound(){
    roundActive=false; clearInterval(timerInterval);
    if(currentRound>=TOTAL_ROUNDS){endGame();return;}
    currentRound++;
    showOverlay('<div class="omsg cround">END OF ROUND</div>',900);
    setTimeout(()=>{resetPositions(0);beginRound();},2000);
}

function endGame(){
    gameActive=false;
    const s0=scores[0],s1=scores[1];

    if(isTournament){
        const playerWon=s0>s1||(s0===s1&&Math.random()<0.5);
        const wt=TEAMS[playerWon?selP1:selP2];
        const html=playerWon
            ?`<div class="omsg cgoal">YOU WIN!</div><div class="osub">${s0} – ${s1}</div>`
            :`<div class="omsg" style="color:#ff4444">ELIMINATED</div><div class="osub">${s0} – ${s1}</div>`;
        showOverlay(html,0);
        finishTournMatch(playerWon);
        return;
    }

    let html;
    if(s0===s1){html=`<div class="omsg" style="color:#ffd700">TIE!</div><div class="osub">${s0} – ${s1}</div>`;}
    else{const wi=s0>s1?0:1;const wt=TEAMS[wi===0?selP1:selP2];html=`<div class="omsg" style="color:${wt.color};filter:drop-shadow(0 0 24px ${wt.color})">${wt.name} WINS!</div><div class="osub">${s0} – ${s1}</div>`;}
    const ov=document.getElementById('overlay');
    ov.innerHTML=html+'<div class="osub" style="font-size:18px;color:#333;cursor:pointer;margin-top:16px;animation:none;opacity:1">Click to play again</div>';
    ov.style.pointerEvents='auto';
    ov.onclick=()=>{ov.onclick=null;ov.style.pointerEvents='none';ov.innerHTML='';startGame();};
}

function handleGoal(scorer){
    if(!roundActive) return;
    roundActive=false; clearInterval(timerInterval);
    scores[scorer]++;
    updateScoreDisplay();
    const nm=TEAMS[scorer===0?selP1:selP2].name;
    showOverlay(`<div class="omsg cgoal">GOAL!</div><div class="osub">${nm}</div>`,2000);
    setTimeout(()=>{
        if(!gameActive) return;
        if(timerSecs<=0){endRound();return;}
        resetPositions(scorer);
        roundActive=true; runTimer();
    },2300);
}

function drawScene(){
    ctx.fillStyle='#0d0520'; ctx.fillRect(0,0,GAME_W,GAME_H);
    const cg=ctx.createLinearGradient(0,0,0,BOARD_Y);
    cg.addColorStop(0,'#1a0830'); cg.addColorStop(1,'#280f44');
    ctx.fillStyle=cg; ctx.fillRect(0,0,GAME_W,BOARD_Y);
    ctx.fillStyle='rgba(255,255,255,0.03)';
    for(let i=0;i<80;i++){ctx.beginPath();ctx.arc((i*113)%GAME_W,(i*77)%BOARD_Y,2,0,Math.PI*2);ctx.fill();}

    ctx.fillStyle='#ffffff'; ctx.fillRect(0,BOARD_Y,GAME_W,10);
    ctx.fillStyle='#cc0000'; ctx.fillRect(0,BOARD_Y+10,GAME_W,5);
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,BOARD_Y+15,GAME_W,4);

    const ig=ctx.createLinearGradient(0,ICE_Y-14,0,GAME_H);
    ig.addColorStop(0,'#ddeeff'); ig.addColorStop(1,'#bfd8f0');
    ctx.fillStyle=ig; ctx.fillRect(0,ICE_Y-14,GAME_W,GAME_H-ICE_Y+14);

    const lineY1=ICE_Y-10, lineY2=GAME_H;
    ctx.strokeStyle='rgba(0,61,165,0.45)'; ctx.lineWidth=5;
    [0.3,0.7].forEach(f=>{ctx.beginPath();ctx.moveTo(GAME_W*f,lineY1);ctx.lineTo(GAME_W*f,lineY2);ctx.stroke();});
    ctx.strokeStyle='rgba(180,0,0,0.45)'; ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(GAME_W/2,lineY1);ctx.lineTo(GAME_W/2,lineY2);ctx.stroke();
    ctx.strokeStyle='rgba(0,61,165,0.2)'; ctx.lineWidth=2; ctx.fillStyle='rgba(0,61,165,0.07)';
    ctx.beginPath();ctx.arc(GOAL_LINE_L,ICE_Y+60,55,Math.PI*1.5,Math.PI*0.5);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(GOAL_LINE_R,ICE_Y+60,55,Math.PI*0.5,Math.PI*1.5);ctx.closePath();ctx.fill();ctx.stroke();

    drawNet(0); drawNet(1);
    ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(0,ICE_Y-14,GAME_W,8);
}

function drawNet(side){
    const isLeft=side===0;
    const postX=isLeft?GOAL_LINE_L:GOAL_LINE_R;
    const netX=isLeft?0:GOAL_LINE_R;
    const netW=isLeft?GOAL_LINE_L:GAME_W-GOAL_LINE_R;
    const gy=GOAL_TOP, gh=GOAL_H;

    ctx.fillStyle='rgba(200,220,255,0.18)'; ctx.fillRect(netX,gy,netW,gh);
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1;
    for(let y=gy;y<=gy+gh;y+=9){ctx.beginPath();ctx.moveTo(netX,y);ctx.lineTo(netX+netW,y);ctx.stroke();}
    for(let x=netX;x<=netX+netW;x+=7){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x,gy+gh);ctx.stroke();}

    ctx.fillStyle='#cc0000';
    ctx.fillRect(postX-3,gy-5,6,gh+5);
    ctx.fillRect(netX,gy-5,netW,5);
    ctx.fillStyle='#aa0000';
    ctx.fillRect(netX,gy+gh,netW,4);

    ctx.strokeStyle='rgba(180,0,0,0.7)'; ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(postX,ICE_Y-14);ctx.lineTo(postX,GAME_H);ctx.stroke();
}

    ctx.save(); ctx.translate(px,py);
    ctx.fillStyle='rgba(0,0,30,0.2)'; ctx.beginPath(); ctx.ellipse(2,4,PUCK_R,PUCK_R*0.4,0,0,Math.PI*2); ctx.fill();

function darken(hex,amt){
    let n=parseInt(hex.replace('#',''),16);
    if(isNaN(n)) return hex;
    return `rgb(${Math.max(0,(n>>16)-amt)},${Math.max(0,((n>>8)&0xff)-amt)},${Math.max(0,(n&0xff)-amt)})`;
}

// ═══ PHYSICS ══════════════════════════════════════════
function updatePhysics(){
    if(!roundActive) return;

    for(const p of players){
        if(p.shotTimer>0) p.shotTimer--;
        if(p.tackleTimer>0) p.tackleTimer--;
        if(p.tackleFlash>0) p.tackleFlash--;
    }

    // P1 input
    const act=getActiveP1();
    if(act){
        let dx=0;
        if(keys['KeyA']) dx=-1;
        if(keys['KeyD']) dx=1;
        if(dx!==0){ act.x=clampX(act.x+dx*PLAYER_SPD,false); act.dir=dx>0?1:-1; }
    }

    // P2 input (2-player mode)
    if(!vsAI){
        const p2f=getActiveP2();
        if(p2f){
            let dx=0;
            if(keys['ArrowLeft']) dx=-1;
            if(keys['ArrowRight']) dx=1;
            if(dx!==0){ p2f.x=clampX(p2f.x+dx*PLAYER_SPD,false); p2f.dir=dx>0?1:-1; }
        }
    }

    // AI updates
    for(const p of players){
        if(p.isGoalie){
            updateGoalieAI(p);
        } else if(vsAI&&p.team===1){
            updateForwardAI(p);
        } else if(p.team===0&&p!==getActiveP1()){
            // P1 non-controlled teammates
            updateTeammateAI(p,0);
        } else if(!vsAI&&p.team===1&&p!==getActiveP2()){
            // P2 non-controlled teammates (2P mode)
            updateTeammateAI(p,1);
        }
    }

    // Puck physics
    if(!puck.owner){
        puck.vy+=GRAVITY;
        puck.x+=puck.vx; puck.y+=puck.vy;
        puck.vx*=FRICTION; puck.vy*=FRICTION;

        if(puck.y>=ICE_Y-PUCK_R){
            puck.y=ICE_Y-PUCK_R;
            puck.vy*=-0.38;
            if(Math.abs(puck.vy)<0.5) puck.vy=0;
            puck.vx*=0.96;
        }
        if(puck.y<BOARD_Y+PUCK_R){ puck.y=BOARD_Y+PUCK_R; puck.vy*=-0.5; }

        if(puck.x-PUCK_R<GOAL_LINE_L){
            if(puck.y>GOAL_TOP-PUCK_R && puck.x<0){ handleGoal(1); return; }
            else if(puck.y<=GOAL_TOP){ puck.x=GOAL_LINE_L+PUCK_R; puck.vx*=-0.7; }
            else if(puck.x<0){ handleGoal(1); return; }
        }
        if(puck.x+PUCK_R>GOAL_LINE_R){
            if(puck.y>GOAL_TOP-PUCK_R && puck.x>GAME_W){ handleGoal(0); return; }
            else if(puck.y<=GOAL_TOP){ puck.x=GOAL_LINE_R-PUCK_R; puck.vx*=-0.7; }
            else if(puck.x>GAME_W){ handleGoal(0); return; }
        }

        for(const p of players){
            if(!p.isGoalie&&p.tackleTimer===0){
                const dx=puck.x-p.x, dy=puck.y-(p.y-10);
                if(Math.sqrt(dx*dx+dy*dy)<20+PUCK_R){ p.hasPuck=true; puck.owner=p; break; }
            }
        }
        for(const p of players){
            if(p.isGoalie){
                const dx=puck.x-p.x, dy=puck.y-p.y;
                if(Math.sqrt(dx*dx+dy*dy)<30){
                    p.hasPuck=true; puck.owner=p;
                    setTimeout(()=>{ if(puck.owner===p){ doShoot(p,true); }},200);
                    break;
                }
            }
        }
    }
}

function clampX(x,isGoalie){
    if(isGoalie) return x;
    return Math.max(GOAL_LINE_L+24, Math.min(GOAL_LINE_R-24, x));
}

// ═══ AI ═══════════════════════════════════════════════
function getActiveP1(){
    if(!players||players.length===0) return null;
    const fwds=players.filter(p=>p.team===0&&!p.isGoalie);
    if(!fwds.length) return null;
    const carrier=fwds.find(p=>p.hasPuck);
    if(carrier) return carrier;
    return fwds.reduce((a,b)=>Math.abs(a.x-puck.x)<Math.abs(b.x-puck.x)?a:b);
}
function getActiveP2(){
    if(!players||players.length===0) return null;
    const fwds=players.filter(p=>p.team===1&&!p.isGoalie);
    if(!fwds.length) return null;
    const carrier=fwds.find(p=>p.hasPuck);
    if(carrier) return carrier;
    return fwds.reduce((a,b)=>Math.abs(a.x-puck.x)<Math.abs(b.x-puck.x)?a:b);
}

function updateGoalieAI(g){
    const homeX=g.team===0?GOAL_LINE_L+22:GOAL_LINE_R-22;
    g.x+=(homeX-g.x)*0.08;
    const puckIsComingToMe=(g.team===0&&puck.vx<-1&&puck.x<GAME_W*0.45)||(g.team===1&&puck.vx>1&&puck.x>GAME_W*0.55)||Math.abs(puck.x-homeX)<180;
    const targetY=puckIsComingToMe?Math.max(GOAL_TOP+8,Math.min(ICE_Y-4,puck.y)):ICE_Y;
    g.y+=(targetY-g.y)*0.12;
    if(g.hasPuck){ doShoot(g,true); }
}

function updateForwardAI(f){
    f.aiTimer++;
    const opp=players.find(p=>p.team!==f.team&&p.hasPuck);
    const tmCarrier=players.find(p=>p.team===f.team&&!p.isGoalie&&p.hasPuck&&p!==f);

    if(f.hasPuck){
        f.dir=-1;
        const shootZoneX=GOAL_LINE_L+120;
        if(f.x>shootZoneX){
            f.x=Math.max(GOAL_LINE_L+30,f.x-PLAYER_SPD*0.95);
        } else {
            if(f.shotTimer===0) doShoot(f,false);
        }
    } else if(!puck.owner){
        const spd=PLAYER_SPD*0.9;
        if(Math.abs(f.x-puck.x)>5) f.x+=Math.sign(puck.x-f.x)*spd;
        f.dir=Math.sign(puck.x-f.x)||f.dir;
    } else if(opp){
        const spd=PLAYER_SPD*0.85;
        f.x+=Math.sign(opp.x-f.x)*spd;
        f.dir=Math.sign(opp.x-f.x)||f.dir;
        if(Math.abs(f.x-opp.x)<TACKLE_RANGE&&f.tackleTimer===0) doTackle(f);
    } else if(tmCarrier){
        const supportX=tmCarrier.x-80;
        if(Math.abs(f.x-supportX)>20) f.x+=Math.sign(supportX-f.x)*PLAYER_SPD*0.7;
    }
    f.x=Math.max(GOAL_LINE_L+22,Math.min(GOAL_LINE_R-22,f.x));
}

function updateTeammateAI(f, team){
    // AI for non-controlled forwards (both P1 teammates and P2 teammates in 2P mode)
    const opp=players.find(p=>p.team!==team&&p.hasPuck);
    const carrier=players.find(p=>p.team===team&&!p.isGoalie&&p.hasPuck);
    if(!puck.owner&&!carrier){
        if(Math.abs(f.x-puck.x)>8) f.x+=Math.sign(puck.x-f.x)*PLAYER_SPD*0.8;
        f.dir=Math.sign(puck.x-f.x)||f.dir;
    } else if(opp){
        if(Math.abs(f.x-opp.x)>30) f.x+=Math.sign(opp.x-f.x)*PLAYER_SPD*0.75;
        if(Math.abs(f.x-opp.x)<TACKLE_RANGE&&f.tackleTimer===0) doTackle(f);
    } else if(carrier){
        const ahead=team===0?carrier.x+100:carrier.x-100;
        if(Math.abs(f.x-ahead)>25) f.x+=Math.sign(ahead-f.x)*PLAYER_SPD*0.65;
    }
    f.x=Math.max(GOAL_LINE_L+22,Math.min(GOAL_LINE_R-22,f.x));
}

// ═══ ACTIONS ══════════════════════════════════════════
function doShoot(p, isClear){
    if(p.shotTimer>0||!p.hasPuck) return;
    p.hasPuck=false; puck.owner=null;
    puck.x=p.x+p.dir*(p.isGoalie?30:22);
    puck.y=p.y-PUCK_R;
    if(isClear){
        const clearDir=p.team===0?1:-1;
        puck.vx=clearDir*10+(Math.random()-0.5)*3;
        puck.vy=-5;
    } else {
        puck.vx=p.dir*SHOT_PWR;
        puck.vy=-3+(Math.random()-0.5)*2;
    }
    p.shotTimer=28;
}

function doTackle(att){
    if(att.tackleTimer>0) return;
    att.tackleTimer=46;
    const opps=players.filter(p=>p.team!==att.team&&p.hasPuck&&!p.isGoalie);
    if(!opps.length) return;
    const def=opps.reduce((a,b)=>Math.abs(a.x-att.x)<Math.abs(b.x-att.x)?a:b);
    if(Math.abs(att.x-def.x)<TACKLE_RANGE){
        def.hasPuck=false; puck.owner=null;
        puck.vx=(Math.random()-0.5)*10; puck.vy=-4;
        puck.x=def.x; puck.y=def.y-PUCK_R-5;
        att.tackleFlash=14;
    }
}

// ═══ HUD ══════════════════════════════════════════════
function updateScoreDisplay(){
    document.getElementById('score1').textContent=scores[0];
    document.getElementById('score2').textContent=scores[1];
}
function updateTimerDisplay(){
    const m=Math.floor(timerSecs/60),s=timerSecs%60;
    document.getElementById('timerDisplay').textContent=m+':'+(s<10?'0':'')+s;
    document.getElementById('timerDisplay').style.color=timerSecs<=10?'#ff4444':'#ffd700';
}
function updateRoundDisplay(){ document.getElementById('roundDisplay').textContent=`ROUND ${currentRound} / ${TOTAL_ROUNDS}`; }
function showOverlay(html,dur){
    const ov=document.getElementById('overlay');
    ov.innerHTML=html; ov.style.pointerEvents='none';
    if(dur) setTimeout(()=>{ if(!ov.innerHTML.includes('play again')&&!ov.innerHTML.includes('ELIMINATED')&&!ov.innerHTML.includes('YOU WIN')) ov.innerHTML=''; },dur);
}

// ═══ NAV ══════════════════════════════════════════════
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function goTitle(){
    gameActive=false; roundActive=false; clearInterval(timerInterval);
    isTournament=false;
    document.getElementById('overlay').innerHTML='';
    document.getElementById('overlay').style.pointerEvents='none';
    showScreen('titleScreen');
}

// ═══ INPUT ════════════════════════════════════════════
document.addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
    if(keys[e.code]) return; keys[e.code]=true;
    if(e.code==='Escape'){goTitle();return;}
    if(!roundActive||!players.length) return;
    if(e.code==='KeyE'){ const a=getActiveP1(); if(a) doShoot(a,false); }
    if(e.code==='KeyR'){ const a=getActiveP1(); if(a) doTackle(a); }
    if(!vsAI){
        if(e.code==='Slash'){ const a=getActiveP2(); if(a) doShoot(a,false); }
        if(e.code==='Period'){ const a=getActiveP2(); if(a) doTackle(a); }
    }
});
document.addEventListener('keyup',e=>{ keys[e.code]=false; });

// ═══ GAME LOOP ════════════════════════════════════════
function gameLoop(){
    ctx.clearRect(0,0,GAME_W,GAME_H);
    drawScene();
    if(players.length){
        updatePhysics();
        drawPuck();
        for(const p of players) drawPlayer(p);
    }
    requestAnimationFrame(gameLoop);
}
gameLoop();
