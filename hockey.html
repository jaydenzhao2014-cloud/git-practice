<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICE HOCKEY v4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0514;font-family:'Impact','Arial Black',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;color:#fff;user-select:none;}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;position:absolute;width:100%;height:100%;}
.screen.active{display:flex;}
.game-title{font-size:clamp(50px,9vw,100px);letter-spacing:16px;background:linear-gradient(180deg,#88ddff,#0077cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px #44aaff);}
.subtitle{font-size:16px;color:#444;letter-spacing:10px;margin-bottom:16px;}
.menu-btn{padding:13px 48px;font-size:20px;font-family:inherit;border:none;border-radius:10px;cursor:pointer;font-weight:bold;letter-spacing:3px;text-transform:uppercase;transition:all 0.2s;margin:6px;}
.btn-blue{background:linear-gradient(45deg,#44aaff,#0055cc);color:#fff;box-shadow:0 6px 24px rgba(68,170,255,0.5);}
.btn-blue:hover{transform:scale(1.07);}
.btn-red{background:linear-gradient(45deg,#ff4444,#cc0000);color:#fff;box-shadow:0 6px 24px rgba(255,68,68,0.5);}
.btn-red:hover{transform:scale(1.07);}
.btn-gold{background:linear-gradient(45deg,#ffd700,#ff8800);color:#1a1a2e;box-shadow:0 6px 24px rgba(255,215,0,0.4);}
.btn-gold:hover{transform:scale(1.07);}
.trophy-btn{background:none;border:2px solid #333;border-radius:10px;padding:8px 20px;cursor:pointer;font-size:22px;transition:all 0.2s;color:#ffd700;}
.trophy-btn:hover{border-color:#ffd700;transform:scale(1.08);}
#teamSelect{gap:14px;padding:20px;}
.ts-title{font-size:26px;letter-spacing:8px;color:#88ddff;margin-bottom:8px;}
.ts-panels{display:flex;gap:38px;align-items:flex-start;}
.ts-panel{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:250px;}
.ts-label{font-size:13px;letter-spacing:4px;color:#555;}
.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.team-card{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 14px;text-align:center;cursor:pointer;transition:all 0.2s;min-width:108px;}
.team-card:hover{transform:scale(1.06);border-color:rgba(255,255,255,0.4);}
.team-card.sel-p1{border-color:#44aaff;background:rgba(68,170,255,0.15);}
.team-card.sel-p2{border-color:#ff4444;background:rgba(255,68,68,0.15);}
.team-swatch{width:36px;height:36px;border-radius:50%;margin:0 auto 6px;border:3px solid rgba(255,255,255,0.2);}
.team-name{font-size:10px;letter-spacing:2px;color:#bbb;}
.play-btn{padding:13px 44px;font-size:20px;font-family:inherit;border:none;border-radius:10px;cursor:pointer;letter-spacing:4px;background:linear-gradient(45deg,#ffd700,#ff8800);color:#1a1a2e;font-weight:bold;opacity:0.4;pointer-events:none;transition:all 0.2s;}
.play-btn.ready{opacity:1;pointer-events:auto;}
.play-btn.ready:hover{transform:scale(1.07);}
#gameScreen{flex-direction:column;align-items:center;}
.scorebar{width:100%;max-width:920px;display:flex;align-items:center;justify-content:space-between;padding:8px 20px 4px;}
.score-side{display:flex;align-items:center;gap:10px;}
.score-side.right{flex-direction:row-reverse;}
.team-circle{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);}
.score-info{display:flex;flex-direction:column;}
.score-info.right{text-align:right;}
.sname{font-size:12px;letter-spacing:2px;}
.snum{font-size:38px;line-height:1;}
.tcenter{text-align:center;}
.ttime{font-size:32px;color:#ffd700;letter-spacing:4px;}
.tround{font-size:10px;color:#333;letter-spacing:4px;margin-top:2px;}
#gameCanvas{display:block;}
.ctrl-bar{width:100%;max-width:920px;display:flex;justify-content:space-between;align-items:center;padding:3px 20px 5px;font-size:11px;color:#2a2a2a;}
.ck{display:inline-block;background:rgba(255,255,255,0.06);border:1px solid #1a1a1a;border-radius:3px;padding:1px 5px;color:#555;font-family:monospace;font-size:10px;}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;z-index:10;}
.omsg{font-size:72px;letter-spacing:10px;animation:pop .3s cubic-bezier(.17,.67,.12,1.5) forwards;opacity:0;}
.osub{font-size:28px;color:#aaa;animation:pop .3s .15s cubic-bezier(.17,.67,.12,1.5) forwards;opacity:0;}
@keyframes pop{0%{opacity:0;transform:scale(0.4);}100%{opacity:1;transform:scale(1);}}
.cgoal{color:#ffd700;filter:drop-shadow(0 0 22px #ffd700);}
.cround{color:#44aaff;filter:drop-shadow(0 0 22px #44aaff);}
/* TROPHY */
#trophyOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:14px;}
#trophyOverlay.show{display:flex;}
.tov-title{font-size:48px;letter-spacing:8px;color:#ffd700;}
.tov-count{font-size:120px;color:#fff;line-height:1;}
.tov-sub{font-size:14px;letter-spacing:4px;color:#555;}
/* TOURNAMENT */
#tournPickScreen{gap:16px;padding:20px;}
#bracketScreen{gap:10px;padding:16px;overflow-y:auto;}
.bracket-title{font-size:30px;letter-spacing:8px;color:#ffd700;filter:drop-shadow(0 0 14px #ffd700);}
.bracket-rounds{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
.bracket-col{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:190px;}
.bracket-col-title{font-size:10px;letter-spacing:4px;color:#333;margin-bottom:2px;}
.bm{background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.08);border-radius:10px;padding:8px 12px;width:190px;display:flex;flex-direction:column;gap:4px;}
.bm.your-match{border-color:#ffd700;background:rgba(255,215,0,0.07);}
.bm.done{opacity:0.7;}
.bm-row{display:flex;align-items:center;gap:6px;}
.bm-sw{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,0.15);}
.bm-tn{font-size:11px;letter-spacing:1px;flex:1;}
.bm-g{font-size:13px;font-weight:bold;color:#ffd700;min-width:14px;text-align:right;}
.bm-win .bm-tn{color:#ffd700;}
.bm-los .bm-tn{color:#444;text-decoration:line-through;}
.bm-tbd .bm-tn{color:#333;}
.bm-div{height:1px;background:rgba(255,255,255,0.05);margin:1px 0;}
.your-tag{font-size:8px;letter-spacing:3px;color:#ffd700;text-align:center;margin-top:2px;}
.bracket-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.bracket-info{font-size:11px;color:#333;letter-spacing:3px;}
.tourn-pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0;}
.tp-card{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:all 0.2s;}
.tp-card:hover{transform:scale(1.06);border-color:rgba(255,255,255,0.3);}
.tp-card.sel{border-color:#ffd700;background:rgba(255,215,0,0.1);}
.tp-sw{width:40px;height:40px;border-radius:50%;margin:0 auto 6px;border:3px solid rgba(255,255,255,0.2);}
.tp-nm{font-size:9px;letter-spacing:2px;color:#bbb;}
</style>
</head>
<body>

<!-- TITLE -->
<div id="titleScreen" class="screen active">
    <div class="game-title">ICE HOCKEY</div>
    <div class="subtitle">WORLD CHAMPIONSHIP</div>
    <button class="menu-btn btn-blue" onclick="goTeamSelect(false)">VS AI</button>
    <button class="menu-btn btn-red" onclick="goTeamSelect(true)">2 PLAYERS</button>
    <button class="menu-btn btn-gold" onclick="goTournPick()">TOURNAMENT</button>
    <button class="trophy-btn" onclick="showTrophies()">🏆 <span id="trophyTitleCount">0</span> TROPHIES</button>
</div>

<!-- TROPHY OVERLAY -->
<div id="trophyOverlay">
    <div class="tov-title">🏆 TROPHIES</div>
    <div class="tov-count" id="trophyCount">0</div>
    <div class="tov-sub">TOURNAMENT CHAMPIONSHIPS WON</div>
    <button class="menu-btn btn-blue" onclick="hideTrophies()" style="margin-top:20px;">CLOSE</button>
</div>

<!-- TEAM SELECT -->
<div id="teamSelect" class="screen">
    <div class="ts-title">CHOOSE YOUR TEAMS</div>
    <div class="ts-panels">
        <div class="ts-panel">
            <div class="ts-label">— PLAYER 1 (A/D/E/R) —</div>
            <div class="team-grid" id="gridP1"></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:28px;">
            <div style="font-size:28px;color:#1a1a1a;">VS</div>
            <button class="play-btn" id="playBtn" onclick="startGame()">PLAY!</button>
            <button onclick="goTitle()" style="background:rgba(255,255,255,0.05);border:2px solid #222;color:#555;padding:7px 20px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;letter-spacing:2px;">← BACK</button>
        </div>
        <div class="ts-panel">
            <div class="ts-label" id="p2tsLabel">— PLAYER 2 (←/→//./.) —</div>
            <div class="team-grid" id="gridP2"></div>
        </div>
    </div>
</div>

<!-- TOURNAMENT PICK -->
<div id="tournPickScreen" class="screen">
    <div class="bracket-title">TOURNAMENT</div>
    <div style="font-size:12px;letter-spacing:4px;color:#555;margin-bottom:6px;">CHOOSE YOUR TEAM</div>
    <div class="tourn-pick-grid" id="tournPickGrid"></div>
    <div style="display:flex;gap:10px;margin-top:6px;">
        <button class="menu-btn btn-gold" id="tournStartBtn" onclick="initTournament()" style="opacity:0.4;pointer-events:none;padding:10px 36px;font-size:16px;">START!</button>
        <button onclick="goTitle()" style="background:rgba(255,255,255,0.05);border:2px solid #222;color:#555;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;letter-spacing:2px;">← BACK</button>
    </div>
</div>

<!-- BRACKET -->
<div id="bracketScreen" class="screen">
    <div class="bracket-title">🏆 TOURNAMENT</div>
    <div class="bracket-rounds" id="bracketRounds"></div>
    <div class="bracket-info" id="bracketInfo"></div>
    <div class="bracket-btns" id="bracketBtns"></div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
    <div class="scorebar">
        <div class="score-side">
            <canvas class="team-circle" id="badge1" width="28" height="28"></canvas>
            <div class="score-info">
                <div class="sname" id="tname1">-</div>
                <div class="snum" id="score1">0</div>
            </div>
        </div>
        <div class="tcenter">
            <div class="ttime" id="timerDisplay">0:20</div>
            <div class="tround" id="roundDisplay">ROUND 1 / 6</div>
        </div>
        <div class="score-side right">
            <canvas class="team-circle" id="badge2" width="28" height="28"></canvas>
            <div class="score-info right">
                <div class="sname" id="tname2">-</div>
                <div class="snum" id="score2">0</div>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="ctrl-bar">
        <div style="color:#44aaff;">P1: <span class="ck">A</span><span class="ck">D</span> Move &nbsp;<span class="ck">E</span> Shot &nbsp;<span class="ck">R</span> Tackle</div>
        <button onclick="goTitle()" style="background:rgba(255,255,255,0.05);border:1px solid #111;color:#333;padding:3px 12px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;">← MENU</button>
        <div id="p2ctrl" style="color:#ff4444;">P2: <span class="ck">←</span><span class="ck">→</span> Move &nbsp;<span class="ck">/</span> Shot &nbsp;<span class="ck">.</span> Tackle</div>
    </div>
</div>
<div id="overlay"></div>

<script>
// ═══ TEAMS ════════════════════════════════════════════
const TEAMS=[
    {name:'CANADA',  short:'CAN',color:'#CC0000',accent:'#FFFFFF'},
    {name:'USA',     short:'USA',color:'#002868',accent:'#BF0A30'},
    {name:'RUSSIA',  short:'RUS',color:'#E31E24',accent:'#003DA5'},
    {name:'SWEDEN',  short:'SWE',color:'#006AA7',accent:'#FECC02'},
    {name:'FINLAND', short:'FIN',color:'#003F87',accent:'#FFFFFF'},
    {name:'CZECH',   short:'CZE',color:'#D7141A',accent:'#11457E'},
    {name:'GERMANY', short:'GER',color:'#333333',accent:'#DD0000'},
    {name:'SLOVAKIA',short:'SVK',color:'#003DA5',accent:'#EE1C25'},
];

// ═══ CONSTANTS ════════════════════════════════════════
const GAME_W=900,GAME_H=420;
const ICE_Y=320;
const BOARD_Y=ICE_Y-18;
const GOAL_H=74;
const GOAL_TOP=ICE_Y-GOAL_H;
const GOAL_LINE_L=62;
const GOAL_LINE_R=GAME_W-62;
const PUCK_R=8;
const PLAYER_SPD=3.6;
const SHOT_PWR=16;
const TACKLE_RANGE=48;
const GRAVITY=0.28;
const FRICTION=0.987;
const ROUND_TIME=20;
const TOTAL_ROUNDS=6;

// ═══ GAME STATE ════════════════════════════════════════
let vsAI,selP1=-1,selP2=-1,tsVsAI=false;
let players=[],puck,scores=[0,0],currentRound=1,timerSecs=ROUND_TIME;
let timerInterval,gameActive=false,roundActive=false;
let p1Player=null,p2Player=null; // fixed controlled players
const keys={};

// ═══ TOURNAMENT STATE ═════════════════════════════════
let isTournament=false;
let tournPlayerTeam=-1;
let tournSeeds=[];
let tournPhase='QF'; // 'QF','SF','3rd','F','done'
let tournPlayerMatchIdx=0;
let tRes={QF:[],SF:[],'3rd':null,F:null};

const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

function resize(){
    const mw=Math.min(window.innerWidth-20,GAME_W);
    canvas.width=GAME_W; canvas.height=GAME_H;
    canvas.style.width=mw+'px'; canvas.style.height=(mw*GAME_H/GAME_W)+'px';
}
window.addEventListener('resize',resize); resize();

// ═══ ROUNDED RECT HELPER (no roundRect API needed) ════
function rrect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
    ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

// ═══ TROPHIES ══════════════════════════════════════════
function getTrophies(){return parseInt(localStorage.getItem('hockey_trophies')||'0');}
function addTrophy(){localStorage.setItem('hockey_trophies',getTrophies()+1);refreshTrophyBtn();}
function refreshTrophyBtn(){document.getElementById('trophyTitleCount').textContent=getTrophies();}
function showTrophies(){
    document.getElementById('trophyCount').textContent=getTrophies();
    document.getElementById('trophyOverlay').classList.add('show');
}
function hideTrophies(){document.getElementById('trophyOverlay').classList.remove('show');}
refreshTrophyBtn();

// ═══ TEAM SELECT ══════════════════════════════════════
function buildGrids(){
    ['gridP1','gridP2'].forEach((gid,pi)=>{
        const g=document.getElementById(gid); g.innerHTML='';
        TEAMS.forEach((t,i)=>{
            const d=document.createElement('div'); d.className='team-card'; d.id=`tc-${pi+1}-${i}`;
            const sw=document.createElement('div'); sw.className='team-swatch';
            sw.style.background=`linear-gradient(135deg,${t.color} 45%,${t.accent})`;
            const nm=document.createElement('div'); nm.className='team-name'; nm.textContent=t.name;
            d.appendChild(sw); d.appendChild(nm); d.onclick=()=>selTeam(pi+1,i);
            g.appendChild(d);
        });
    });
}
function selTeam(pl,idx){
    if(pl===1){selP1=idx;document.querySelectorAll('[id^="tc-1-"]').forEach(e=>e.classList.remove('sel-p1'));document.getElementById(`tc-1-${idx}`).classList.add('sel-p1');}
    else{selP2=idx;document.querySelectorAll('[id^="tc-2-"]').forEach(e=>e.classList.remove('sel-p2'));document.getElementById(`tc-2-${idx}`).classList.add('sel-p2');}
    if(selP1>=0&&selP2>=0)document.getElementById('playBtn').classList.add('ready');
}
function goTeamSelect(two){
    isTournament=false; tsVsAI=!two; selP1=-1; selP2=-1;
    document.getElementById('playBtn').classList.remove('ready');
    document.getElementById('p2tsLabel').textContent=tsVsAI?'— A.I. OPPONENT —':'— PLAYER 2 (←/→//.) —';
    buildGrids();
    if(tsVsAI){selP2=Math.floor(Math.random()*TEAMS.length);selTeam(2,selP2);}
    showScreen('teamSelect');
}

// ═══ TOURNAMENT ════════════════════════════════════════
function goTournPick(){
    isTournament=true; tournPlayerTeam=-1;
    const btn=document.getElementById('tournStartBtn');
    btn.style.opacity='0.4'; btn.style.pointerEvents='none';
    const g=document.getElementById('tournPickGrid'); g.innerHTML='';
    TEAMS.forEach((t,i)=>{
        const d=document.createElement('div'); d.className='tp-card'; d.id=`tp-${i}`;
        const sw=document.createElement('div'); sw.className='tp-sw';
        sw.style.background=`linear-gradient(135deg,${t.color} 45%,${t.accent})`;
        const nm=document.createElement('div'); nm.className='tp-nm'; nm.textContent=t.name;
        d.appendChild(sw); d.appendChild(nm);
        d.onclick=()=>{
            tournPlayerTeam=i;
            document.querySelectorAll('.tp-card').forEach(c=>c.classList.remove('sel'));
            d.classList.add('sel');
            btn.style.opacity='1'; btn.style.pointerEvents='auto';
        };
        g.appendChild(d);
    });
    showScreen('tournPickScreen');
}

function initTournament(){
    if(tournPlayerTeam<0)return;
    const all=[0,1,2,3,4,5,6,7];
    for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
    tournSeeds=all;
    tournPhase='QF';
    tRes={QF:[],SF:[],'3rd':null,F:null};
    // QF: 0v7,1v6,2v5,3v4
    const qfM=getQFMatches();
    tournPlayerMatchIdx=qfM.findIndex(m=>m.includes(tournPlayerTeam));
    // Simulate other QF matches immediately
    qfM.forEach((m,i)=>{if(i!==tournPlayerMatchIdx)tRes.QF[i]=simMatch(m[0],m[1]);});
    showBracket();
}

function getQFMatches(){return[[tournSeeds[0],tournSeeds[7]],[tournSeeds[1],tournSeeds[6]],[tournSeeds[2],tournSeeds[5]],[tournSeeds[3],tournSeeds[4]]];}
function getSFMatches(){const q=tRes.QF;return[[q[0].w,q[1].w],[q[2].w,q[3].w]];}
function get3rdMatch(){const s=tRes.SF;const l0=s[0].t1===s[0].w?s[0].t2:s[0].t1;const l1=s[1].t1===s[1].w?s[1].t2:s[1].t1;return[l0,l1];}
function getFMatch(){const s=tRes.SF;return[s[0].w,s[1].w];}
function simMatch(t1,t2){let s1=Math.floor(Math.random()*6),s2=Math.floor(Math.random()*6);while(s1===s2){s1=Math.floor(Math.random()*6);s2=Math.floor(Math.random()*6);}return{t1,t2,s1,s2,w:s1>s2?t1:t2};}

function showBracket(){
    showScreen('bracketScreen');
    const c=document.getElementById('bracketRounds'); c.innerHTML='';

    const cols=[
        {title:'QUARTERFINALS',matches:getQFMatches(),results:tRes.QF,phaseKey:'QF'},
        {title:'SEMIFINALS',matches:tRes.QF.length===4?getSFMatches():null,results:tRes.SF,phaseKey:'SF'},
        {title:'3RD PLACE',matches:tRes.SF.length===2?[get3rdMatch()]:null,results:tRes['3rd']?[tRes['3rd']]:null,phaseKey:'3rd'},
        {title:'FINAL',matches:tRes.SF.length===2?[getFMatch()]:null,results:tRes.F?[tRes.F]:null,phaseKey:'F'},
    ];

    cols.forEach(col=>{
        const colDiv=document.createElement('div'); colDiv.className='bracket-col';
        const ct=document.createElement('div'); ct.className='bracket-col-title'; ct.textContent=col.title;
        colDiv.appendChild(ct);
        const mCount=col.title==='QUARTERFINALS'?4:col.title==='SEMIFINALS'?2:1;
        for(let mi=0;mi<mCount;mi++){
            const card=document.createElement('div'); card.className='bm';
            const m=col.matches?col.matches[mi]:null;
            const r=col.results?col.results[mi]:null;
            const isPlayerMatch=m&&m.includes(tournPlayerTeam)&&col.phaseKey===tournPhase;
            if(isPlayerMatch)card.classList.add('your-match');
            if(r)card.classList.add('done');
            if(m){
                [0,1].forEach(si=>{
                    const tIdx=m[si]; const t=TEAMS[tIdx];
                    const isW=r&&r.w===tIdx; const isL=r&&r.w!==tIdx;
                    const row=document.createElement('div');
                    row.className='bm-row'+(isW?' bm-win':isL?' bm-los':'');
                    const sw=document.createElement('div'); sw.className='bm-sw';
                    sw.style.background=`linear-gradient(135deg,${t.color},${t.accent})`;
                    const tn=document.createElement('div'); tn.className='bm-tn';
                    tn.textContent=t.name+(tIdx===tournPlayerTeam?' ★':'');
                    const gl=document.createElement('div'); gl.className='bm-g';
                    if(r)gl.textContent=si===0?r.s1:r.s2;
                    row.appendChild(sw); row.appendChild(tn); row.appendChild(gl);
                    card.appendChild(row);
                    if(si===0){const dv=document.createElement('div');dv.className='bm-div';card.appendChild(dv);}
                });
                if(isPlayerMatch){const yt=document.createElement('div');yt.className='your-tag';yt.textContent='▶ YOUR MATCH';card.appendChild(yt);}
            } else {
                [0,1].forEach(si=>{
                    const row=document.createElement('div'); row.className='bm-row bm-tbd';
                    const tn=document.createElement('div'); tn.className='bm-tn'; tn.textContent='TBD';
                    row.appendChild(tn); card.appendChild(row);
                    if(si===0){const dv=document.createElement('div');dv.className='bm-div';card.appendChild(dv);}
                });
            }
            colDiv.appendChild(card);
        }
        c.appendChild(colDiv);
    });

    // Buttons
    const info=document.getElementById('bracketInfo');
    const btns=document.getElementById('bracketBtns'); btns.innerHTML='';
    const phaseNames={QF:'QUARTERFINALS',SF:'SEMIFINALS','3rd':'3RD PLACE',F:'FINAL'};
    const _ph=tRes[tournPhase];const playerResult=_ph?(Array.isArray(_ph)?_ph[tournPlayerMatchIdx]:_ph):null;
    const tournDone=tournPhase==='done';

    if(tournDone){
        info.textContent='TOURNAMENT COMPLETE';
        addBtn(btns,'← MENU','btn-blue',goTitle);
    } else if(playerResult){
        // This round is done for player, advance
        advanceTournament(playerResult.w===tournPlayerTeam);
    } else {
        info.textContent=phaseNames[tournPhase]||'';
        addBtn(btns,'PLAY YOUR MATCH','btn-gold',playTournMatch);
        addBtn(btns,'QUIT','btn-red',goTitle);
    }
}

function addBtn(container,text,cls,fn){
    const b=document.createElement('button'); b.className='menu-btn '+cls;
    b.textContent=text; b.onclick=fn; container.appendChild(b);
}

function advanceTournament(playerWon){
    const info=document.getElementById('bracketInfo');
    const btns=document.getElementById('bracketBtns'); btns.innerHTML='';
    if(tournPhase==='QF'){
        if(playerWon){info.textContent='YOU ADVANCE TO SEMIFINALS!';}
        else{info.textContent='ELIMINATED IN QUARTERFINALS';}
        // Simulate remaining QF matches
        getQFMatches().forEach((m,i)=>{if(!tRes.QF[i])tRes.QF[i]=simMatch(m[0],m[1]);});
        if(playerWon){addBtn(btns,'CONTINUE TO SF →','btn-gold',()=>{tournPhase='SF';tournPlayerMatchIdx=getSFMatches().findIndex(m=>m.includes(tournPlayerTeam));getSFMatches().forEach((m,i)=>{if(i!==tournPlayerMatchIdx)tRes.SF[i]=simMatch(m[0],m[1]);});showBracket();});}
        else{addBtn(btns,'← MENU','btn-blue',goTitle);}
    } else if(tournPhase==='SF'){
        // Simulate other SF
        getSFMatches().forEach((m,i)=>{if(!tRes.SF[i])tRes.SF[i]=simMatch(m[0],m[1]);});
        if(playerWon){
            info.textContent='YOU ADVANCE TO THE FINAL!';
            addBtn(btns,'PLAY THE FINAL →','btn-gold',()=>{tournPhase='F';tournPlayerMatchIdx=0;showBracket();});
        } else {
            info.textContent='YOU PLAY FOR 3RD PLACE';
            addBtn(btns,'PLAY 3RD PLACE MATCH','btn-blue',()=>{tournPhase='3rd';tournPlayerMatchIdx=0;showBracket();});
        }
    } else if(tournPhase==='3rd'){
        if(playerWon){info.textContent='3RD PLACE ACHIEVED! BRONZE!';}
        else{info.textContent='4TH PLACE FINISH';}
        // Simulate Final
        const fm=getFMatch();if(!tRes.F)tRes.F=simMatch(fm[0],fm[1]);
        tournPhase='done';
        addBtn(btns,'SEE RESULTS','btn-gold',showBracket);
        addBtn(btns,'← MENU','btn-blue',goTitle);
    } else if(tournPhase==='F'){
        if(playerWon){
            info.textContent='CHAMPION! 🏆';
            addTrophy();
        } else {info.textContent='RUNNER UP - GREAT RUN!';}
        // Simulate 3rd place
        const tm=get3rdMatch();if(!tRes['3rd'])tRes['3rd']=simMatch(tm[0],tm[1]);
        tournPhase='done';
        addBtn(btns,'SEE RESULTS','btn-gold',showBracket);
        addBtn(btns,'← MENU','btn-blue',goTitle);
    }
}

function playTournMatch(){
    let m;
    if(tournPhase==='QF')m=getQFMatches()[tournPlayerMatchIdx];
    else if(tournPhase==='SF')m=getSFMatches()[tournPlayerMatchIdx];
    else if(tournPhase==='3rd')m=get3rdMatch();
    else if(tournPhase==='F')m=getFMatch();
    selP1=tournPlayerTeam; selP2=m[0]===tournPlayerTeam?m[1]:m[0];
    vsAI=true;
    scores=[0,0]; currentRound=1;
    setupGameDisplay();
    gameActive=true;
    showScreen('gameScreen');
    resetPositions(0);
    beginRound();
}

function finishTournMatch(playerWon){
    const s0=scores[0],s1=scores[1];
    const m=tournPhase==='QF'?getQFMatches()[tournPlayerMatchIdx]:
             tournPhase==='SF'?getSFMatches()[tournPlayerMatchIdx]:
             tournPhase==='3rd'?get3rdMatch():getFMatch();
    const w=playerWon?tournPlayerTeam:(m[0]===tournPlayerTeam?m[1]:m[0]);
    const res={t1:m[0],t2:m[1],s1:s0,s2:s1,w};
    if(tournPhase==='QF')tRes.QF[tournPlayerMatchIdx]=res;
    else if(tournPhase==='SF')tRes.SF[tournPlayerMatchIdx]=res;
    else if(tournPhase==='3rd')tRes['3rd']=res;
    else if(tournPhase==='F')tRes.F=res;
    setTimeout(()=>{
        document.getElementById('overlay').innerHTML='';
        document.getElementById('overlay').style.pointerEvents='none';
        showBracket();
    },2500);
}

// ═══ PLAYER FACTORY ═══════════════════════════════════
function makePlayer(x,team,isGoalie){
    return{x,y:ICE_Y,vy:0,team,isGoalie,dir:team===0?1:-1,hasPuck:false,shotTimer:0,tackleTimer:0,tackleFlash:0,aiTimer:0};
}

// ═══ GAME SETUP ═══════════════════════════════════════
function drawBadge(id,t){
    const bc=document.getElementById(id),bx=bc.getContext('2d');
    bx.clearRect(0,0,28,28);
    const g=bx.createLinearGradient(0,0,28,28);
    g.addColorStop(0,t.color); g.addColorStop(1,t.accent);
    bx.fillStyle=g; bx.beginPath(); bx.arc(14,14,12,0,Math.PI*2); bx.fill();
}
function setupGameDisplay(){
    drawBadge('badge1',TEAMS[selP1]); drawBadge('badge2',TEAMS[selP2]);
    document.getElementById('tname1').textContent=TEAMS[selP1].short;
    document.getElementById('tname2').textContent=TEAMS[selP2].short;
    document.getElementById('tname1').style.color=TEAMS[selP1].color;
    document.getElementById('tname2').style.color=TEAMS[selP2].color;
    document.getElementById('p2ctrl').style.opacity=vsAI?'0.25':'1';
}
function startGame(){
    if(selP1<0||selP2<0)return;
    vsAI=tsVsAI; scores=[0,0]; currentRound=1;
    setupGameDisplay(); gameActive=true;
    showScreen('gameScreen'); resetPositions(0); beginRound();
}

function resetPositions(starterTeam){
    players=[
        makePlayer(GOAL_LINE_L+28,0,true),
        makePlayer(210,0,false),
        makePlayer(330,0,false),
        makePlayer(430,0,false),
        makePlayer(GOAL_LINE_R-28,1,true),
        makePlayer(690,1,false),
        makePlayer(570,1,false),
        makePlayer(470,1,false),
    ];
    // Fixed player references: P1=players[1], P2=players[5]
    p1Player=players[1]; p2Player=players[5];
    puck={x:GAME_W/2,y:ICE_Y-PUCK_R,vx:0,vy:0,owner:null};
    const starter=players.filter(p=>p.team===starterTeam&&!p.isGoalie)[0];
    starter.hasPuck=true; puck.owner=starter;

}

// ═══ ROUND / TIMER ════════════════════════════════════
function beginRound(){
    roundActive=false; timerSecs=ROUND_TIME;
    updateRoundDisplay(); updateTimerDisplay();
    showOverlay(`<div class="omsg cround">ROUND ${currentRound}</div><div class="osub">${TOTAL_ROUNDS} ROUNDS TOTAL</div>`,1300);
    setTimeout(()=>{showOverlay('<div class="omsg" style="color:#ffd700">FACE OFF!</div>',700);setTimeout(()=>{roundActive=true;runTimer();},700);},1300);
}
function runTimer(){
    clearInterval(timerInterval);
    timerInterval=setInterval(()=>{
        if(!roundActive){clearInterval(timerInterval);return;}
        timerSecs=Math.max(0,timerSecs-1); updateTimerDisplay();
        if(timerSecs<=0){clearInterval(timerInterval);endRound();}
    },1000);
}
function endRound(){
    roundActive=false; clearInterval(timerInterval);
    if(currentRound>=TOTAL_ROUNDS){endGame();return;}
    currentRound++;
    showOverlay('<div class="omsg cround">END OF ROUND</div>',900);
    setTimeout(()=>{resetPositions(0);beginRound();},2000);
}
function endGame(){
    gameActive=false;
    const s0=scores[0],s1=scores[1];
    if(isTournament){
        const playerWon=s0>s1||(s0===s1&&Math.random()<0.5);
        showOverlay(playerWon?`<div class="omsg cgoal">YOU WIN!</div><div class="osub">${s0} – ${s1}</div>`:`<div class="omsg" style="color:#ff4444">YOU LOSE</div><div class="osub">${s0} – ${s1}</div>`,0);
        finishTournMatch(playerWon); return;
    }
    let html;
    if(s0===s1){html=`<div class="omsg" style="color:#ffd700">TIE!</div><div class="osub">${s0} – ${s1}</div>`;}
    else{const wi=s0>s1?0:1;const wt=TEAMS[wi===0?selP1:selP2];html=`<div class="omsg" style="color:${wt.color};filter:drop-shadow(0 0 24px ${wt.color})">${wt.name} WINS!</div><div class="osub">${s0} – ${s1}</div>`;}
    const ov=document.getElementById('overlay');
    ov.innerHTML=html+'<div class="osub" style="font-size:18px;color:#333;cursor:pointer;margin-top:16px;animation:none;opacity:1">Click to play again</div>';
    ov.style.pointerEvents='auto';
    ov.onclick=()=>{ov.onclick=null;ov.style.pointerEvents='none';ov.innerHTML='';startGame();};
}
function handleGoal(scorer){
    if(!roundActive)return;
    roundActive=false; clearInterval(timerInterval);
    scores[scorer]++; updateScoreDisplay();
    const nm=TEAMS[scorer===0?selP1:selP2].name;
    showOverlay(`<div class="omsg cgoal">GOAL!</div><div class="osub">${nm}</div>`,2000);
    setTimeout(()=>{
        if(!gameActive)return;
        if(timerSecs<=0){endRound();return;}
        resetPositions(scorer); roundActive=true; runTimer();
    },2300);
}

// ═══ DRAWING ══════════════════════════════════════════
function drawScene(){
    // Background / crowd
    ctx.fillStyle='#0d0520'; ctx.fillRect(0,0,GAME_W,GAME_H+100);
    const cg=ctx.createLinearGradient(0,0,0,BOARD_Y);
    cg.addColorStop(0,'#1a0830'); cg.addColorStop(1,'#280f44');
    ctx.fillStyle=cg; ctx.fillRect(0,0,GAME_W,BOARD_Y);
    ctx.fillStyle='rgba(255,255,255,0.03)';
    for(let i=0;i<80;i++){ctx.beginPath();ctx.arc((i*113)%GAME_W,(i*77)%BOARD_Y,2,0,Math.PI*2);ctx.fill();}

    // Boards
    ctx.fillStyle='#fff'; ctx.fillRect(0,BOARD_Y,GAME_W,10);
    ctx.fillStyle='#cc0000'; ctx.fillRect(0,BOARD_Y+10,GAME_W,5);
    ctx.fillStyle='#fff'; ctx.fillRect(0,BOARD_Y+15,GAME_W,4);

    // Ice
    const ig=ctx.createLinearGradient(0,ICE_Y-14,0,GAME_H+100);
    ig.addColorStop(0,'#ddeeff'); ig.addColorStop(1,'#bfd8f0');
    ctx.fillStyle=ig; ctx.fillRect(0,ICE_Y-14,GAME_W,GAME_H+100);

    // Ice lines
    ctx.strokeStyle='rgba(0,61,165,0.4)'; ctx.lineWidth=5;
    [0.3,0.7].forEach(f=>{ctx.beginPath();ctx.moveTo(GAME_W*f,ICE_Y-10);ctx.lineTo(GAME_W*f,GAME_H+100);ctx.stroke();});
    ctx.strokeStyle='rgba(180,0,0,0.4)'; ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(GAME_W/2,ICE_Y-10);ctx.lineTo(GAME_W/2,GAME_H+100);ctx.stroke();

    // Creases
    ctx.strokeStyle='rgba(0,61,165,0.2)'; ctx.lineWidth=2; ctx.fillStyle='rgba(0,61,165,0.06)';
    ctx.beginPath();ctx.arc(GOAL_LINE_L,ICE_Y+50,50,Math.PI*1.5,Math.PI*0.5);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(GOAL_LINE_R,ICE_Y+50,50,Math.PI*0.5,Math.PI*1.5);ctx.closePath();ctx.fill();ctx.stroke();

    drawNet(0); drawNet(1);
    ctx.fillStyle='rgba(0,0,0,0.07)'; ctx.fillRect(0,ICE_Y-14,GAME_W,8);
}

function drawNet(side){
    const isLeft=side===0;
    const postX=isLeft?GOAL_LINE_L:GOAL_LINE_R;
    const netX=isLeft?0:GOAL_LINE_R;
    const netW=isLeft?GOAL_LINE_L:GAME_W-GOAL_LINE_R;
    const gy=GOAL_TOP,gh=GOAL_H;
    ctx.fillStyle='rgba(200,220,255,0.18)'; ctx.fillRect(netX,gy,netW,gh);
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1;
    for(let y=gy;y<=gy+gh;y+=9){ctx.beginPath();ctx.moveTo(netX,y);ctx.lineTo(netX+netW,y);ctx.stroke();}
    for(let x=netX;x<=netX+netW;x+=7){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x,gy+gh);ctx.stroke();}
    ctx.fillStyle='#cc0000'; ctx.fillRect(postX-3,gy-5,6,gh+5); ctx.fillRect(netX,gy-5,netW,5);
    ctx.fillStyle='#aa0000'; ctx.fillRect(netX,gy+gh,netW,4);
    ctx.strokeStyle='rgba(180,0,0,0.7)'; ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(postX,ICE_Y-14);ctx.lineTo(postX,GAME_H+100);ctx.stroke();
}

function darken(hex,amt){
    let n=parseInt(hex.replace('#',''),16);
    if(isNaN(n))return hex;
    return `rgb(${Math.max(0,(n>>16)-amt)},${Math.max(0,((n>>8)&0xff)-amt)},${Math.max(0,(n&0xff)-amt)})`;
}

function drawPlayer(p){
    const t=TEAMS[p.team===0?selP1:selP2];
    if(!t)return;
    const x=Math.round(p.x),y=Math.round(p.y);
    const d=p.dir;
    ctx.save(); ctx.translate(x,y);

    if(p.tackleFlash>0){
        ctx.fillStyle=`rgba(255,220,0,${p.tackleFlash/14})`;
        ctx.beginPath(); ctx.ellipse(0,-20,24,26,0,0,Math.PI*2); ctx.fill();
    }

    if(p.isGoalie){
        // Shadow
        ctx.fillStyle='rgba(0,0,50,0.12)'; ctx.beginPath(); ctx.ellipse(2,2,16,4,0,0,Math.PI*2); ctx.fill();
        // Leg pads
        ctx.fillStyle='#ddd'; ctx.fillRect(-10,-12,9,12); ctx.fillRect(1,-12,9,12);
        // Skates
        ctx.fillStyle='#777'; ctx.fillRect(-11,0,10,4); ctx.fillRect(1,0,10,4);
        // Body
        ctx.fillStyle=t.color; rrect(-11,-38,22,26,4); ctx.fill();
        ctx.fillStyle=t.accent; ctx.globalAlpha=0.4; ctx.fillRect(-11,-29,22,5); ctx.globalAlpha=1;
        // Chest
        ctx.fillStyle='rgba(255,255,255,0.15)'; rrect(-9,-36,18,12,3); ctx.fill();
        // Head
        ctx.fillStyle=t.color; ctx.beginPath(); ctx.arc(0,-46,9,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#333'; ctx.fillRect(-7,-52,14,7);
        ctx.strokeStyle='rgba(200,200,200,0.8)'; ctx.lineWidth=1.5;
        for(let bx=-5;bx<=5;bx+=3){ctx.beginPath();ctx.moveTo(bx,-51);ctx.lineTo(bx,-45);ctx.stroke();}
        // Gloves
        ctx.fillStyle='#d4a837'; ctx.fillRect(d*9,-27,d*12,9);
        ctx.fillStyle='#c09030'; ctx.beginPath(); ctx.arc(d*-13,-23,7,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='bold 8px Impact'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('G',0,-26);
    } else {
        // Shadow
        ctx.fillStyle='rgba(0,0,50,0.12)'; ctx.beginPath(); ctx.ellipse(2,2,11,3,0,0,Math.PI*2); ctx.fill();
        // Skates
        ctx.fillStyle='#666'; ctx.fillRect(-6,0,14,4);
        // Legs
        ctx.fillStyle=darken(t.color,25); ctx.fillRect(-5,-16,5,16); ctx.fillRect(1,-16,5,16);
        // Jersey
        ctx.fillStyle=t.color; rrect(-8,-36,16,20,3); ctx.fill();
        ctx.fillStyle=t.accent; ctx.globalAlpha=0.45; ctx.fillRect(-8,-30,16,5); ctx.globalAlpha=1;
        // Helmet
        ctx.fillStyle=t.color; ctx.beginPath(); ctx.arc(0,-43,7,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(20,20,20,0.7)'; ctx.fillRect(-4,-47,8,5);
        // Stick
        ctx.strokeStyle='#5a3510'; ctx.lineWidth=2.5; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(d*3,-24); ctx.lineTo(d*18,0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d*12,-1); ctx.lineTo(d*22,-1); ctx.stroke();
        // Label
        ctx.fillStyle='#fff'; ctx.font='bold 6px Impact'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(t.short,0,-26);
    }

    // P1 indicator (blue ring + label)
    if(p===p1Player&&!p.isGoalie){
        ctx.strokeStyle='#44aaff'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(0,-20,20,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle='#44aaff'; ctx.font='bold 10px Impact'; ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText('P1',0,-42);
    }
    // P2 indicator (red ring + label) — only in 2P mode
    if(!vsAI&&p===p2Player&&!p.isGoalie){
        ctx.strokeStyle='#ff4444'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(0,-20,20,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle='#ff4444'; ctx.font='bold 10px Impact'; ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText('P2',0,-42);
    }

    ctx.restore();
}

function drawPuck(){
    const px=puck.owner?puck.owner.x+puck.owner.dir*(puck.owner.isGoalie?20:20):puck.x;
    const py=puck.owner?(puck.owner.isGoalie?puck.owner.y-8:ICE_Y-PUCK_R):puck.y;
    ctx.save(); ctx.translate(px,py);
    ctx.fillStyle='rgba(0,0,30,0.2)'; ctx.beginPath(); ctx.ellipse(2,4,PUCK_R,PUCK_R*0.4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(0,0,PUCK_R,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.arc(-2,-2,PUCK_R*0.45,0,Math.PI*2); ctx.fill();
    ctx.restore();
}

// ═══ PHYSICS ══════════════════════════════════════════
function updatePhysics(){
    if(!roundActive)return;
    for(const p of players){
        if(p.shotTimer>0)p.shotTimer--;
        if(p.tackleTimer>0)p.tackleTimer--;
        if(p.tackleFlash>0)p.tackleFlash--;
    }
    // P1 movement (controls p1Player directly)
    if(p1Player){
        let dx=0;
        if(keys['KeyA'])dx=-1; if(keys['KeyD'])dx=1;
        if(dx!==0){p1Player.x=clampX(p1Player.x+dx*PLAYER_SPD);p1Player.dir=dx>0?1:-1;}
    }
    // P2 movement (controls p2Player directly, 2P mode only)
    if(!vsAI&&p2Player){
        let dx=0;
        if(keys['ArrowLeft'])dx=-1; if(keys['ArrowRight'])dx=1;
        if(dx!==0){p2Player.x=clampX(p2Player.x+dx*PLAYER_SPD);p2Player.dir=dx>0?1:-1;}
    }
    // AI
    for(const p of players){
        if(p.isGoalie){updateGoalieAI(p);}
        else if(p===p1Player||(!vsAI&&p===p2Player)){}  // player-controlled, skip AI
        else if(vsAI&&p.team===1){updateForwardAI(p);}
        else{updateTeammateAI(p);}
    }
    // Puck physics
    if(!puck.owner){
        puck.vy+=GRAVITY; puck.x+=puck.vx; puck.y+=puck.vy;
        puck.vx*=FRICTION; puck.vy*=FRICTION;
        if(puck.y>=ICE_Y-PUCK_R){puck.y=ICE_Y-PUCK_R;puck.vy*=-0.38;if(Math.abs(puck.vy)<0.5)puck.vy=0;puck.vx*=0.96;}
        if(puck.y<BOARD_Y+PUCK_R){puck.y=BOARD_Y+PUCK_R;puck.vy*=-0.5;}
        if(puck.x-PUCK_R<GOAL_LINE_L){
            if(puck.y>GOAL_TOP-PUCK_R&&puck.x<0){handleGoal(1);return;}
            else if(puck.y<=GOAL_TOP){puck.x=GOAL_LINE_L+PUCK_R;puck.vx*=-0.7;}
            else if(puck.x<0){handleGoal(1);return;}
        }
        if(puck.x+PUCK_R>GOAL_LINE_R){
            if(puck.y>GOAL_TOP-PUCK_R&&puck.x>GAME_W){handleGoal(0);return;}
            else if(puck.y<=GOAL_TOP){puck.x=GOAL_LINE_R-PUCK_R;puck.vx*=-0.7;}
            else if(puck.x>GAME_W){handleGoal(0);return;}
        }
        // Pickup
        for(const p of players){
            if(!p.isGoalie&&p.tackleTimer===0){
                const dx=puck.x-p.x,dy=puck.y-(p.y-10);
                if(Math.sqrt(dx*dx+dy*dy)<20+PUCK_R){p.hasPuck=true;puck.owner=p;break;}
            }
        }
        // Goalie save
        for(const p of players){
            if(p.isGoalie){
                const dx=puck.x-p.x,dy=puck.y-p.y;
                if(Math.sqrt(dx*dx+dy*dy)<28){
                    p.hasPuck=true;puck.owner=p;
                    setTimeout(()=>{if(puck.owner===p)doShoot(p,true);},180);break;
                }
            }
        }
    }
}

function clampX(x){return Math.max(GOAL_LINE_L+24,Math.min(GOAL_LINE_R-24,x));}

// ═══ AI ═══════════════════════════════════════════════
function updateGoalieAI(g){
    const homeX=g.team===0?GOAL_LINE_L+22:GOAL_LINE_R-22;
    g.x+=(homeX-g.x)*0.08;
    const coming=(g.team===0&&puck.vx<-1&&puck.x<GAME_W*0.45)||(g.team===1&&puck.vx>1&&puck.x>GAME_W*0.55)||Math.abs(puck.x-homeX)<180;
    const targetY=coming?Math.max(GOAL_TOP+8,Math.min(ICE_Y-4,puck.y)):ICE_Y;
    g.y+=(targetY-g.y)*0.12;
    if(g.hasPuck)doShoot(g,true);
}
function updateForwardAI(f){
    const opp=players.find(p=>p.team!==f.team&&p.hasPuck&&!p.isGoalie);
    const tmC=players.find(p=>p.team===f.team&&!p.isGoalie&&p.hasPuck&&p!==f);
    if(f.hasPuck){
        f.dir=-1;
        const sz=GOAL_LINE_L+120;
        if(f.x>sz){f.x=Math.max(GOAL_LINE_L+30,f.x-PLAYER_SPD*0.95);}
        else if(f.shotTimer===0)doShoot(f,false);
    } else if(!puck.owner){
        if(Math.abs(f.x-puck.x)>5)f.x+=Math.sign(puck.x-f.x)*PLAYER_SPD*0.9;
        f.dir=Math.sign(puck.x-f.x)||f.dir;
    } else if(opp){
        f.x+=Math.sign(opp.x-f.x)*PLAYER_SPD*0.85; f.dir=Math.sign(opp.x-f.x)||f.dir;
        if(Math.abs(f.x-opp.x)<TACKLE_RANGE&&f.tackleTimer===0)doTackle(f);
    } else if(tmC){
        const sx=tmC.x-80; if(Math.abs(f.x-sx)>20)f.x+=Math.sign(sx-f.x)*PLAYER_SPD*0.7;
    }
    f.x=Math.max(GOAL_LINE_L+22,Math.min(GOAL_LINE_R-22,f.x));
}
function updateTeammateAI(f){
    const opp=players.find(p=>p.team!==f.team&&p.hasPuck&&!p.isGoalie);
    const carrier=players.find(p=>p.team===f.team&&!p.isGoalie&&p.hasPuck);
    if(!puck.owner&&!carrier){
        if(Math.abs(f.x-puck.x)>8)f.x+=Math.sign(puck.x-f.x)*PLAYER_SPD*0.8;
        f.dir=Math.sign(puck.x-f.x)||f.dir;
    } else if(opp){
        if(Math.abs(f.x-opp.x)>30)f.x+=Math.sign(opp.x-f.x)*PLAYER_SPD*0.75;
        if(Math.abs(f.x-opp.x)<TACKLE_RANGE&&f.tackleTimer===0)doTackle(f);
    } else if(carrier){
        const dir=f.team===0?1:-1;
        const sx=carrier.x+dir*90; if(Math.abs(f.x-sx)>25)f.x+=Math.sign(sx-f.x)*PLAYER_SPD*0.65;
    }
    f.x=Math.max(GOAL_LINE_L+22,Math.min(GOAL_LINE_R-22,f.x));
}

// ═══ ACTIONS ══════════════════════════════════════════
function doShoot(p,isClear){
    if(p.shotTimer>0||!p.hasPuck)return;
    p.hasPuck=false; puck.owner=null;
    puck.x=p.x+p.dir*(p.isGoalie?28:20); puck.y=p.y-PUCK_R;
    if(isClear){const cd=p.team===0?1:-1;puck.vx=cd*10+(Math.random()-0.5)*3;puck.vy=-5;}
    else{puck.vx=p.dir*SHOT_PWR;puck.vy=-3+(Math.random()-0.5)*2;}
    p.shotTimer=28;
}
function doTackle(att){
    if(att.tackleTimer>0)return;
    att.tackleTimer=46;
    const opps=players.filter(p=>p.team!==att.team&&p.hasPuck&&!p.isGoalie);
    if(!opps.length)return;
    const def=opps.reduce((a,b)=>Math.abs(a.x-att.x)<Math.abs(b.x-att.x)?a:b);
    if(Math.abs(att.x-def.x)<TACKLE_RANGE){
        def.hasPuck=false;puck.owner=null;
        puck.vx=(Math.random()-0.5)*10;puck.vy=-4;
        puck.x=def.x;puck.y=def.y-PUCK_R-5;
        att.tackleFlash=14;
    }
}

// ═══ HUD ══════════════════════════════════════════════
function updateScoreDisplay(){document.getElementById('score1').textContent=scores[0];document.getElementById('score2').textContent=scores[1];}
function updateTimerDisplay(){const m=Math.floor(timerSecs/60),s=timerSecs%60;document.getElementById('timerDisplay').textContent=m+':'+(s<10?'0':'')+s;document.getElementById('timerDisplay').style.color=timerSecs<=10?'#ff4444':'#ffd700';}
function updateRoundDisplay(){document.getElementById('roundDisplay').textContent=`ROUND ${currentRound} / ${TOTAL_ROUNDS}`;}
function showOverlay(html,dur){
    const ov=document.getElementById('overlay');
    ov.innerHTML=html;ov.style.pointerEvents='none';
    if(dur)setTimeout(()=>{if(!ov.innerHTML.includes('play again')&&!ov.innerHTML.includes('LOSE')&&!ov.innerHTML.includes('YOU WIN'))ov.innerHTML='';},dur);
}

// ═══ NAV ══════════════════════════════════════════════
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goTitle(){
    gameActive=false;roundActive=false;clearInterval(timerInterval);isTournament=false;
    document.getElementById('overlay').innerHTML='';document.getElementById('overlay').style.pointerEvents='none';
    showScreen('titleScreen');
}

// ═══ INPUT ════════════════════════════════════════════
document.addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
    if(keys[e.code])return; keys[e.code]=true;
    if(e.code==='Escape'){goTitle();return;}
    if(!roundActive||!players.length)return;
    // P1 actions
    if(e.code==='KeyE'&&p1Player)doShoot(p1Player,false);
    if(e.code==='KeyR'&&p1Player)doTackle(p1Player);
    // P2 actions (2P mode)
    if(!vsAI){
        if(e.code==='Slash'&&p2Player)doShoot(p2Player,false);
        if(e.code==='Period'&&p2Player)doTackle(p2Player);
    }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

// ═══ GAME LOOP (45° CAMERA) ═══════════════════════════
function gameLoop(){
    ctx.clearRect(0,0,GAME_W,GAME_H);

    // Physics update (in original coords)
    if(players.length)updatePhysics();

    // Draw with 45-degree overhead camera transform
    ctx.save();
    // Compress Y axis to ~72% and shift down — gives half-side / half-top feel
    ctx.transform(1, 0, 0, 0.72, 0, 58);
    drawScene();
    if(players.length){
        drawPuck();
        for(const p of players)drawPlayer(p);
    }
    ctx.restore();

    requestAnimationFrame(gameLoop);
}
gameLoop();
