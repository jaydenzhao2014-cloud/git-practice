<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Sharks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(180deg,#000d1a 0%,#001f3f 40%,#003366 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;}

canvas{position:fixed;inset:0;pointer-events:none;}

.center{position:relative;z-index:10;text-align:center;padding:20px;}
.welcome{font-size:clamp(18px,4vw,32px);color:rgba(255,255,255,.6);letter-spacing:10px;text-transform:uppercase;animation:fadein 1s .2s both;}
h1{font-size:clamp(52px,13vw,130px);font-weight:900;letter-spacing:6px;color:#fff;text-shadow:0 0 60px rgba(0,180,255,.8),0 0 120px rgba(0,100,255,.4);animation:pop .7s cubic-bezier(.175,.885,.32,1.275) .4s both;line-height:1;}
.shark-row{font-size:clamp(40px,8vw,80px);margin-top:20px;animation:fadein 1s .9s both;letter-spacing:4px;}
.tagline{font-size:clamp(12px,2.5vw,18px);color:rgba(100,200,255,.7);letter-spacing:5px;margin-top:18px;animation:fadein 1s 1.1s both;}

@keyframes pop{from{transform:scale(0) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="center">
  <div class="welcome">🌊 Welcome 🌊</div>
  <h1>SHARKS</h1>
  <div class="shark-row">🦈 🦈 🦈</div>
  <div class="tagline">GET READY TO MAKE A DEAL</div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

// Bubbles
const bubbles=[];
for(let i=0;i<60;i++){
  bubbles.push({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight+window.innerHeight,
    r:Math.random()*6+2,
    vy:-(Math.random()*0.8+0.3),
    vx:(Math.random()-0.5)*0.4,
    o:Math.random()*0.3+0.05,
  });
}

// Sharks swimming across
const sharks=[];
for(let i=0;i<5;i++){
  sharks.push({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight*0.6+window.innerHeight*0.2,
    vx:Math.random()*0.6+0.3,
    s:Math.random()*24+18,
    o:Math.random()*0.25+0.1,
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Bubbles
  for(const b of bubbles){
    b.y+=b.vy; b.x+=b.vx;
    if(b.y<-20) b.y=canvas.height+20;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.strokeStyle='rgba(100,200,255,'+b.o+')';
    ctx.lineWidth=1;
    ctx.stroke();
  }

  // Swimming sharks
  for(const s of sharks){
    s.x+=s.vx;
    if(s.x>canvas.width+60) s.x=-60;
    ctx.save();
    ctx.globalAlpha=s.o;
    ctx.font=s.s+'px serif';
    ctx.textBaseline='middle';
    ctx.fillText('🦈',s.x,s.y);
    ctx.restore();
  }

  // Light rays
  ctx.save();
  for(let i=0;i<6;i++){
    const x=canvas.width*(i/5);
    const grad=ctx.createLinearGradient(x,0,x+60,canvas.height);
    grad.addColorStop(0,'rgba(0,150,255,0.04)');
    grad.addColorStop(1,'rgba(0,150,255,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(x-20,0);ctx.lineTo(x+60,0);ctx.lineTo(x+80,canvas.height);ctx.lineTo(x,canvas.height);
    ctx.fill();
  }
  ctx.restore();

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
