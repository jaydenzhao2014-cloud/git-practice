<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;}

#canvas{position:fixed;inset:0;pointer-events:none;}

.center{position:relative;z-index:10;text-align:center;}
h1{font-size:clamp(56px,12vw,120px);font-weight:900;letter-spacing:8px;background:linear-gradient(135deg,#ff6eb4,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:300% 300%;animation:grad 4s ease infinite,pop .6s cubic-bezier(.175,.885,.32,1.275) both;}
.sub{font-size:clamp(14px,3vw,22px);color:rgba(255,255,255,.5);letter-spacing:6px;margin-top:16px;animation:fadein 1s .4s both;}
.hearts{font-size:clamp(28px,5vw,48px);margin-top:28px;animation:fadein 1s .7s both;letter-spacing:8px;}

@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="center">
  <h1>THANK YOU</h1>
  <div class="sub">FROM THE BOTTOM OF MY HEART</div>
  <div class="hearts">🤍 💜 🤍 💜 🤍</div>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});

const particles=[];
const EMOJIS=['🎉','⭐','✨','💜','🤍','🌟','🎊','💫'];
for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height+canvas.height,
    vx:(Math.random()-0.5)*1.5,
    vy:-(Math.random()*2+1),
    e:EMOJIS[Math.floor(Math.random()*EMOJIS.length)],
    s:Math.random()*22+12,
    r:Math.random()*Math.PI*2,
    vr:(Math.random()-0.5)*0.04,
    o:Math.random()*0.6+0.4,
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    if(p.y<-50) p.y=canvas.height+20;
    ctx.save();
    ctx.globalAlpha=p.o;
    ctx.translate(p.x,p.y);
    ctx.rotate(p.r);
    ctx.font=p.s+'px serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(p.e,0,0);
    ctx.restore();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
