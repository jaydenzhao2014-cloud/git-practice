<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINECRAFT PVP ARENA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a1a;font-family:'Courier New',monospace;color:#fff;overflow:hidden;}
/* ── SCREENS ── */
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;
  position:fixed;inset:0;z-index:20;background:#1a1a1a;}
.screen.on{display:flex;}
.mc-title{font-size:clamp(36px,6vw,70px);letter-spacing:8px;color:#55ff55;
  text-shadow:4px 4px 0 #1a6a1a;margin-bottom:6px;}
.mc-sub{font-size:11px;letter-spacing:6px;color:#555;margin-bottom:28px;}
.mc-btn{padding:11px 36px;font-size:14px;font-family:'Courier New',monospace;border:2px solid;
  border-radius:2px;cursor:pointer;font-weight:bold;letter-spacing:3px;text-transform:uppercase;
  transition:all .12s;margin:5px;min-width:210px;background:transparent;}
.mc-btn:hover{filter:brightness(1.3);transform:scale(1.04);}
.btn-g{border-color:#55ff55;color:#55ff55;}
.btn-y{border-color:#ffd700;color:#ffd700;}
.btn-b{border-color:#6688ff;color:#6688ff;}
.btn-x{border-color:#666;color:#888;}
/* ── SHOP ── */
.shop-box{background:#222;border:2px solid #444;padding:22px;
  width:min(660px,94vw);max-height:88vh;overflow-y:auto;}
.shop-hd{font-size:22px;letter-spacing:6px;color:#55ff55;text-align:center;margin-bottom:4px;}
.shop-cash{text-align:center;font-size:14px;color:#ffd700;margin-bottom:16px;}
.sec-lbl{font-size:9px;letter-spacing:4px;color:#555;border-bottom:1px solid #333;
  padding-bottom:4px;margin-bottom:10px;}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px;margin-bottom:16px;}
.item{background:#2a2a2a;border:2px solid #3a3a3a;padding:9px 7px;text-align:center;
  cursor:pointer;transition:border-color .1s;}
.item:hover{border-color:#888;}
.item.own{border-color:#44aa44;}
.item.eq{border-color:#ffd700;background:#201c00;}
.item.no{opacity:.32;cursor:default;}
.iico{font-size:24px;margin-bottom:3px;}
.inm{font-size:9px;color:#ccc;letter-spacing:1px;}
.ist{font-size:8px;color:#666;margin-top:1px;}
.itg{font-size:8px;letter-spacing:2px;margin-top:3px;}
/* ── ARENA ── */
.arena-box{background:#222;border:2px solid #444;padding:24px;
  width:min(400px,90vw);display:flex;flex-direction:column;align-items:center;gap:10px;}
.a-code{font-size:30px;letter-spacing:10px;color:#ffd700;min-height:38px;}
.a-status{font-size:11px;letter-spacing:3px;color:#777;}
.a-input{padding:9px;background:#1a1a1a;border:2px solid #555;color:#fff;
  font-family:'Courier New',monospace;font-size:14px;letter-spacing:5px;
  width:152px;text-transform:uppercase;}
/* ── STATS ── */
.stats-box{background:#222;border:2px solid #444;padding:26px;min-width:280px;text-align:center;}
/* ── RESULT ── */
.res-big{font-size:clamp(36px,6vw,72px);letter-spacing:10px;margin-bottom:8px;}
.res-earn{font-size:17px;color:#ffd700;margin-bottom:6px;}
.res-rnk{font-size:12px;letter-spacing:3px;margin-bottom:20px;}
/* ── GAME ── */
#gameWrap{position:fixed;inset:0;display:none;background:#000;z-index:10;}
#gameWrap.on{display:block;}
#gameCanvas{display:block;width:100%;height:100%;cursor:crosshair;}
/* ── HUD (over canvas) ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:15;}
#hudTL{position:absolute;top:8px;left:12px;}
#hudHearts{font-size:15px;line-height:1.4;}
#hudArmor{font-size:9px;color:#aaa;letter-spacing:2px;margin-top:1px;}
#hudTR{position:absolute;top:8px;right:12px;text-align:right;}
#hudCash{font-size:13px;color:#ffd700;letter-spacing:2px;}
#hudRank{font-size:9px;letter-spacing:2px;margin-top:2px;}
#hotbar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px;}
.hs{width:40px;height:40px;background:rgba(0,0,0,.75);border:2px solid #444;
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.hs.on{border-color:#fff;}
#killfeed{position:absolute;top:50px;left:50%;transform:translateX(-50%);
  font-size:15px;letter-spacing:3px;color:#ffdd44;text-shadow:1px 1px 0 #000;
  opacity:0;transition:opacity .4s;white-space:nowrap;}
</style>
</head>
<body>

<!-- TITLE -->
<div id="sc-title" class="screen on">
  <div class="mc-title">⚔ PVP ARENA</div>
  <div class="mc-sub">MINECRAFT STYLE</div>
  <button class="mc-btn btn-g" onclick="startVsAI()">▶ PLAY VS AI</button>
  <button class="mc-btn btn-b" onclick="goArena()">🌐 GLOBAL ARENA</button>
  <button class="mc-btn btn-y" onclick="goShop(false)">⚒ SHOP</button>
  <button class="mc-btn btn-x" onclick="showStats()">📊 STATS</button>
</div>

<!-- SHOP -->
<div id="sc-shop" class="screen">
  <div class="shop-box">
    <div class="shop-hd">⚒ SHOP</div>
    <div class="shop-cash" id="shopCash">💰 $0</div>
    <div class="sec-lbl">⚔ SWORDS</div>
    <div class="igrid" id="swordGrid"></div>
    <div class="sec-lbl">🛡 ARMOR</div>
    <div class="igrid" id="armorGrid"></div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px;">
      <button class="mc-btn btn-g" onclick="startVsAI()">▶ PLAY</button>
      <button class="mc-btn btn-x" onclick="show('sc-title')">◀ BACK</button>
    </div>
  </div>
</div>

<!-- GLOBAL ARENA -->
<div id="sc-arena" class="screen">
  <div class="arena-box">
    <div style="font-size:18px;letter-spacing:6px;color:#55ff55;">🌐 GLOBAL ARENA</div>
    <div class="a-status" id="aStatus">–</div>
    <div class="a-code" id="aCode"></div>
    <div style="font-size:9px;color:#444;letter-spacing:2px;" id="aHint"></div>
    <button class="mc-btn btn-g" id="aStartBtn" style="display:none" onclick="mpStart()">▶ START</button>
    <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center;">
      <input class="a-input" id="joinInput" placeholder="CODE" maxlength="7">
      <button class="mc-btn btn-y" onclick="mpJoin()" style="min-width:80px;padding:9px 12px;">JOIN</button>
    </div>
    <button class="mc-btn btn-x" onclick="mpLeave()">◀ BACK</button>
  </div>
</div>

<!-- RESULT -->
<div id="sc-result" class="screen">
  <div class="res-big" id="resTtl"></div>
  <div class="res-earn" id="resEarn"></div>
  <div class="res-rnk" id="resRnk"></div>
  <button class="mc-btn btn-g" onclick="startVsAI()">▶ PLAY AGAIN</button>
  <button class="mc-btn btn-y" onclick="goShop(false)">⚒ SHOP</button>
  <button class="mc-btn btn-x" onclick="show('sc-title')">◀ MENU</button>
</div>

<!-- STATS -->
<div id="sc-stats" class="screen">
  <div class="stats-box">
    <div id="statRnk" style="font-size:28px;letter-spacing:5px;margin-bottom:12px;"></div>
    <div id="statLines" style="font-size:12px;color:#ccc;letter-spacing:2px;line-height:2.2;"></div>
    <button class="mc-btn btn-x" onclick="show('sc-title')" style="margin-top:14px;">◀ BACK</button>
  </div>
</div>

<!-- GAME -->
<div id="gameWrap">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="hudTL">
      <div id="hudHearts"></div>
      <div id="hudArmor"></div>
    </div>
    <div id="hudTR">
      <div id="hudCash">💰 $0</div>
      <div id="hudRank"></div>
    </div>
    <div id="hotbar">
      <div class="hs on" id="hs0">🪵</div>
      <div class="hs" id="hs1">👕</div>
    </div>
    <div id="killfeed"></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
// ══════════════════════════════════════
//  DATA
// ══════════════════════════════════════
const SW=[
  {n:'Wooden', i:'🪵',c:'#c8941a',dmg:2,cd:660,cost:0,   rch:32},
  {n:'Stone',  i:'🪨',c:'#c0c0c0',dmg:3,cd:580,cost:300, rch:34},
  {n:'Iron',   i:'🔩',c:'#e0e0e0',dmg:4,cd:500,cost:900, rch:36},
  {n:'Gold',   i:'✨',c:'#FFD700',dmg:5,cd:380,cost:1800,rch:35},
  {n:'Diamond',i:'💎',c:'#44ffff',dmg:7,cd:440,cost:3600,rch:38},
];
const AR=[
  {n:'None',    i:'👕',c:null,      def:0,  cost:0},
  {n:'Leather', i:'🟫',c:'#8B5020',def:1,   cost:300},
  {n:'Chain',   i:'⛓',c:'#909090',def:1.5, cost:900},
  {n:'Iron',    i:'🔧',c:'#d8d8d8',def:2.5, cost:1800},
  {n:'Diamond', i:'🔷',c:'#55aaff',def:4,   cost:3600},
];
const RANKS=[
  {n:'WOOD',     c:'#c8941a',w:0},
  {n:'STONE',    c:'#c0c0c0',w:3},
  {n:'IRON',     c:'#e0e0e0',w:10},
  {n:'GOLD',     c:'#FFD700',w:25},
  {n:'DIAMOND',  c:'#44ffff',w:50},
  {n:'NETHERITE',c:'#cc88ff',w:100},
];

// ══════════════════════════════════════
//  SAVE / LOAD
// ══════════════════════════════════════
function ld(){return{
  money:+localStorage.getItem('m2')||0,
  wins: +localStorage.getItem('w2')||0,
  kills:+localStorage.getItem('k2')||0,
  sword:+localStorage.getItem('s2')||0,
  armor:+localStorage.getItem('a2')||0,
  os:JSON.parse(localStorage.getItem('os2')||'[0]'),
  oa:JSON.parse(localStorage.getItem('oa2')||'[0]'),
};}
function sv(s){
  localStorage.setItem('m2',s.money);localStorage.setItem('w2',s.wins);
  localStorage.setItem('k2',s.kills);localStorage.setItem('s2',s.sword);
  localStorage.setItem('a2',s.armor);
  localStorage.setItem('os2',JSON.stringify(s.os));
  localStorage.setItem('oa2',JSON.stringify(s.oa));
}
let S=ld();
function getRank(w){let r=RANKS[0];for(const k of RANKS)if(w>=k.w)r=k;return r;}

// ══════════════════════════════════════
//  SCREENS
// ══════════════════════════════════════
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('gameWrap').classList.remove('on');
  const el=document.getElementById(id);
  if(el)el.classList.add('on');
}
function showGame(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('gameWrap').classList.add('on');
}
function goShop(play){S=ld();renderShop();show('sc-shop');}

// ══════════════════════════════════════
//  SHOP
// ══════════════════════════════════════
function renderShop(){
  S=ld();
  document.getElementById('shopCash').textContent='💰 $'+S.money.toLocaleString();
  document.getElementById('swordGrid').innerHTML=SW.map((s,i)=>{
    const own=S.os.includes(i),eq=S.sword===i,aff=S.money>=s.cost;
    const cls=own?(eq?'eq':'own'):(aff?'':'no');
    const tag=own?(eq?`<div class="itg" style="color:#ffd700">EQUIPPED</div>`:`<div class="itg" style="color:#44aa44">OWNED</div>`):`<div class="itg" style="color:#ffd700">$${s.cost}</div>`;
    return`<div class="item ${cls}" onclick="buySW(${i})"><div class="iico">${s.i}</div><div class="inm">${s.n}</div><div class="ist">DMG ${s.dmg}</div>${tag}</div>`;
  }).join('');
  document.getElementById('armorGrid').innerHTML=AR.map((a,i)=>{
    const own=S.oa.includes(i),eq=S.armor===i,aff=S.money>=a.cost;
    const cls=own?(eq?'eq':'own'):(aff?'':'no');
    const tag=own?(eq?`<div class="itg" style="color:#ffd700">EQUIPPED</div>`:`<div class="itg" style="color:#44aa44">OWNED</div>`):`<div class="itg" style="color:#ffd700">$${a.cost}</div>`;
    return`<div class="item ${cls}" onclick="buyAR(${i})"><div class="iico">${a.i}</div><div class="inm">${a.n}</div><div class="ist">DEF ${a.def}</div>${tag}</div>`;
  }).join('');
}
function buySW(i){if(S.os.includes(i)){S.sword=i;}else if(S.money>=SW[i].cost){S.money-=SW[i].cost;S.os.push(i);S.sword=i;}sv(S);renderShop();}
function buyAR(i){if(S.oa.includes(i)){S.armor=i;}else if(S.money>=AR[i].cost){S.money-=AR[i].cost;S.oa.push(i);S.armor=i;}sv(S);renderShop();}

// ══════════════════════════════════════
//  STATS
// ══════════════════════════════════════
function showStats(){
  S=ld();const r=getRank(S.wins),nx=RANKS.find(k=>k.w>S.wins);
  document.getElementById('statRnk').innerHTML=`<span style="color:${r.c}">★ ${r.n}</span>`;
  document.getElementById('statLines').innerHTML=
    `💰 Money: <b style="color:#ffd700">$${S.money.toLocaleString()}</b><br>`+
    `⚔ Kills: <b>${S.kills}</b>  🏆 Wins: <b>${S.wins}</b><br>`+
    `⚔ Sword: <b>${SW[S.sword].n}</b>  🛡 Armor: <b>${AR[S.armor].n}</b><br>`+
    (nx?`<span style="color:#555;font-size:10px">${nx.w-S.wins} wins → ${nx.n}</span>`:`<span style="color:#cc88ff">MAX RANK!</span>`);
  show('sc-stats');
}

// ══════════════════════════════════════
//  MAP
// ══════════════════════════════════════
const TW=22,MW=62,MH=44;
const TCOL={
  0:[['#3d6b20','#457826','#355e1a'],true],   // grass
  1:[['#5a5a5a','#525252','#626262'],false],   // stone wall
  2:[['#5e5040','#544838','#687058'],false],   // cobble wall
  3:[['#6e4a28','#624020','#7a5230'],true],    // dirt
  4:[['#686868','#606060','#707070'],true],    // stone floor
};
let map,tvar;
function solid(tx,ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH)return true;
  return map[ty][tx]===1||map[ty][tx]===2;
}
function buildMap(){
  tvar=[];
  map=[];
  for(let y=0;y<MH;y++){
    map[y]=[];
    for(let x=0;x<MW;x++){
      const b=x===0||x===MW-1||y===0||y===MH-1;
      map[y][x]=b?1:(Math.random()<.1?3:Math.random()<.08?4:0);
      tvar.push(Math.floor(Math.random()*3));
    }
  }
  // Random pillars — avoid spawn corners
  for(let i=0;i<75;i++){
    const ox=2+Math.floor(Math.random()*(MW-4));
    const oy=2+Math.floor(Math.random()*(MH-4));
    if(ox<8&&oy<8)continue;
    if(ox>MW-9&&oy>MH-9)continue;
    const sz=1+Math.floor(Math.random()*2);
    for(let dy=0;dy<sz;dy++)for(let dx=0;dx<sz;dx++){
      if(map[oy+dy]&&oy+dy>0&&oy+dy<MH-1)
        map[oy+dy][ox+dx]=Math.random()<.55?1:2;
    }
  }
}

// ══════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════
const CW=900,CH=520,SPD=2.8,PR=10;
let canvas,ctx,keys={},mxRaw=CW/2,myRaw=CH/2;
let player,bots,parts,camX=0,camY=0;
let running=false,animId=null,lastTs=0,vsAI=true;

function mkEnt(x,y,human,sw,ar,name,team){return{
  x,y,human,name,team,sw,ar,hp:20,maxHp:20,
  kx:0,ky:0,atkCd:0,swP:-1,swA:0,hitFlash:0,dead:false,
  aiState:'w',aiT:0,aiTx:0,aiTy:0,
  skin:team===0?'#e8c080':'#88b8d8',
  shirt:team===0?'#2a6a2a':'#2a308a',
};}

// ── Get mouse in game-world coords ──
function gmx(){return mxRaw*(CW/canvas.clientWidth);}
function gmy(){return myRaw*(CH/canvas.clientHeight);}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
function startVsAI(){vsAI=true;S=ld();initGame();}
function initGame(){
  canvas=document.getElementById('gameCanvas');
  canvas.width=CW;canvas.height=CH;
  ctx=canvas.getContext('2d');
  buildMap();
  parts=[];
  player=mkEnt(5*TW+TW/2,5*TW+TW/2,true,S.sword,S.armor,'YOU',0);
  bots=[];
  if(vsAI)bots.push(mkEnt((MW-8)*TW,(MH-8)*TW,false,
    Math.min(S.sword,4),Math.min(S.armor,4),'BOT',1));
  keys={};
  showGame();
  updateHUD();
  canvas.onmousemove=e=>{const r=canvas.getBoundingClientRect();mxRaw=e.clientX-r.left;myRaw=e.clientY-r.top;};
  canvas.onmousedown=e=>{if(e.button===0){e.preventDefault();doSwing(player);}};
  window.onkeydown=e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();};
  window.onkeyup=e=>{keys[e.code]=false;};
  running=true;
  if(animId)cancelAnimationFrame(animId);
  lastTs=performance.now();
  animId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  canvas.onmousemove=null;canvas.onmousedown=null;
  window.onkeydown=null;window.onkeyup=null;
  if(animId)cancelAnimationFrame(animId);
}

// ══════════════════════════════════════
//  MOVEMENT + COLLISION
// ══════════════════════════════════════
function mv(e,dx,dy){
  const r=PR;
  const nx=e.x+dx,ny=e.y+dy;
  if(!solid(~~((nx+r)/TW),~~(e.y/TW))&&!solid(~~((nx-r)/TW),~~(e.y/TW))&&
     !solid(~~((nx+r)/TW),~~((e.y+r-1)/TW))&&!solid(~~((nx-r)/TW),~~((e.y+r-1)/TW)))e.x=nx;
  if(!solid(~~(e.x/TW),~~((ny+r)/TW))&&!solid(~~(e.x/TW),~~((ny-r)/TW))&&
     !solid(~~((e.x+r-1)/TW),~~((ny+r)/TW))&&!solid(~~((e.x-r+1)/TW),~~((ny+r)/TW)))e.y=ny;
}

// ══════════════════════════════════════
//  COMBAT
// ══════════════════════════════════════
function faceAngle(e){
  // Angle the entity is facing
  if(e.human){
    const sx=e.x-camX,sy=e.y-camY;
    return Math.atan2(gmy()-sy,gmx()-sx);
  }
  return Math.atan2(player.y-e.y,player.x-e.x);
}
function doSwing(atk){
  if(atk.dead||atk.atkCd>0)return;
  const s=SW[atk.sw];
  atk.atkCd=s.cd;
  const angle=faceAngle(atk);
  atk.swA=angle;atk.swP=0;
  const tgts=atk.human?bots:[player];
  for(const t of tgts){
    if(t.dead)continue;
    const dx=t.x-atk.x,dy=t.y-atk.y,dist=Math.hypot(dx,dy);
    if(dist>s.rch+PR)continue;
    let diff=Math.abs(angle-Math.atan2(dy,dx));
    if(diff>Math.PI)diff=2*Math.PI-diff;
    if(diff>1.0)continue;
    const dmg=Math.max(1,s.dmg-AR[t.ar].def);
    t.hp-=dmg;
    const k=4+s.dmg;t.kx+=(dx/dist)*k;t.ky+=(dy/dist)*k;
    t.hitFlash=10;blood(t.x,t.y);
    if(t.hp<=0)onKill(atk,t);
  }
}
function onKill(killer,victim){
  victim.dead=true;boom(victim.x,victim.y);
  if(killer.human){S.kills++;S.money+=300;sv(S);kfeed(`+$300  💀 ${victim.name}`);updateHUD();}
  if(vsAI){
    if(bots.every(b=>b.dead))setTimeout(()=>endMatch(true),1200);
    if(victim===player)setTimeout(()=>endMatch(false),1200);
  }
}
function endMatch(won){
  stopGame();
  const prev=S.wins;
  if(won){S.wins++;S.money+=300;sv(S);}
  const r=getRank(S.wins),rp=getRank(prev);
  document.getElementById('resTtl').textContent=won?'🏆 VICTORY!':'💀 DEFEATED';
  document.getElementById('resTtl').style.color=won?'#55ff55':'#ff4444';
  document.getElementById('resEarn').textContent=won?`+$300 earned  ·  Total: $${S.money.toLocaleString()}`:`Total: $${S.money.toLocaleString()}`;
  document.getElementById('resRnk').innerHTML=(won&&r.n!==rp.n?`<span style="color:#55ff55">🎉 RANK UP → </span>`:``)+`<span style="color:${r.c}">★ ${r.n}</span>  ·  ${S.wins} wins`;
  show('sc-result');
}

// ══════════════════════════════════════
//  AI
// ══════════════════════════════════════
function aiTick(ai,dt){
  if(ai.dead)return;
  ai.aiT-=dt;
  const dx=player.x-ai.x,dy=player.y-ai.y,dist=Math.hypot(dx,dy);
  if(dist<230){
    ai.aiState='c';
    if(dist>26)mv(ai,(dx/dist)*SPD*.88,(dy/dist)*SPD*.88);
    if(dist<SW[ai.sw].rch+PR+4&&ai.atkCd<=0)doSwing(ai);
  } else {
    if(ai.aiT<=0||ai.aiState==='c'){
      ai.aiState='w';ai.aiT=900+Math.random()*1400;
      const a=Math.random()*Math.PI*2,d=40+Math.random()*70;
      ai.aiTx=ai.x+Math.cos(a)*d;ai.aiTy=ai.y+Math.sin(a)*d;
    }
    const wx=ai.aiTx-ai.x,wy=ai.aiTy-ai.y,wd=Math.hypot(wx,wy);
    if(wd>4)mv(ai,(wx/wd)*SPD*.7,(wy/wd)*SPD*.7);
  }
}

// ══════════════════════════════════════
//  PARTICLES
// ══════════════════════════════════════
function blood(x,y){for(let i=0;i<7;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:28,ml:28,c:'#cc1111',sz:2+Math.random()*3});}}
function boom(x,y){for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2,s=1.5+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:55,ml:55,c:Math.random()<.5?'#cc1111':'#ff7777',sz:2+Math.random()*5});}}

// ══════════════════════════════════════
//  DRAW MAP
// ══════════════════════════════════════
function drawMap(){
  const tx0=Math.max(0,~~(camX/TW)),ty0=Math.max(0,~~(camY/TW));
  const tx1=Math.min(MW,tx0+~~(CW/TW)+2),ty1=Math.min(MH,ty0+~~(CH/TW)+2);
  for(let ty=ty0;ty<ty1;ty++)for(let tx=tx0;tx<tx1;tx++){
    const t=map[ty][tx];
    const [cols,floor]=TCOL[t]||TCOL[0];
    ctx.fillStyle=cols[tvar[ty*MW+tx]];
    const px=tx*TW-camX,py=ty*TW-camY;
    ctx.fillRect(px,py,TW,TW);
    if(!floor){
      ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(px,py,TW,2);ctx.fillRect(px,py,2,TW);
      ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(px+TW-2,py,2,TW);ctx.fillRect(px,py+TW-2,TW,2);
    }
    ctx.strokeStyle='rgba(0,0,0,.12)';ctx.strokeRect(px+.5,py+.5,TW-1,TW-1);
  }
}

// ══════════════════════════════════════
//  DRAW ENTITY (with mouse-look rotation)
// ══════════════════════════════════════
function drawEnt(e){
  if(e.dead)return;
  const sx=e.x-camX,sy=e.y-camY;
  const fl=e.hitFlash>0;
  const ac=AR[e.ar].c;
  const angle=faceAngle(e); // direction entity faces

  // ── Draw rotated character ──
  ctx.save();
  ctx.translate(sx,sy);
  ctx.rotate(angle+Math.PI/2); // +PI/2 so "forward" faces mouse

  // Shadow
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.beginPath();ctx.ellipse(0,12,11,4,0,0,Math.PI*2);ctx.fill();

  // Legs
  ctx.fillStyle=fl?'#ff9999':'#1a1a1a';
  ctx.fillRect(-6,4,5,9);ctx.fillRect(1,4,5,9);

  // Body
  ctx.fillStyle=fl?'#ff9999':(ac||e.shirt);
  ctx.fillRect(-7,-8,14,13);
  if(ac){ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(-7,-8,14,3);}

  // Head
  ctx.fillStyle=fl?'#ffbbbb':e.skin;
  ctx.fillRect(-7,-21,14,14);

  // Eyes (always facing "up" = forward direction)
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(-5,-18,3,3);ctx.fillRect(2,-18,3,3);
  // Mouth
  ctx.fillRect(-3,-13,7,2);

  // Sword
  const s=SW[e.sw];
  if(e.swP>=0&&e.swP<1){
    // Animated swing arc
    const arc=(e.swP-.5)*Math.PI*.95;
    ctx.save();ctx.rotate(arc);
    ctx.strokeStyle=fl?'#fff':s.c;ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(7,-8);ctx.lineTo(7+s.rch*.6,-8-s.rch*.8);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  } else {
    // Idle sword
    ctx.strokeStyle=s.c;ctx.lineWidth=3.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(20,-12);ctx.stroke();
  }

  ctx.restore();

  // ── Name & HP bar (always horizontal) ──
  ctx.save();ctx.translate(sx,sy);
  const hf=Math.max(0,e.hp/e.maxHp);
  ctx.fillStyle='#111';ctx.fillRect(-17,-40,34,5);
  ctx.fillStyle=hf>.5?'#44ee44':hf>.25?'#ffaa00':'#ff3333';
  ctx.fillRect(-17,-40,34*hf,5);
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(-22,-52,44,12);
  ctx.fillStyle=e.human?'#55ff55':'#ff5555';
  ctx.font='bold 8px Courier New';ctx.textAlign='center';
  ctx.fillText(e.name,0,-43);
  ctx.restore();
}

// ══════════════════════════════════════
//  DRAW PARTICLES
// ══════════════════════════════════════
function drawParts(){
  for(const p of parts){
    ctx.globalAlpha=p.life/p.ml;ctx.fillStyle=p.c;
    ctx.fillRect(p.x-camX-p.sz/2,p.y-camY-p.sz/2,p.sz,p.sz);
  }
  ctx.globalAlpha=1;
}

// ══════════════════════════════════════
//  HUD
// ══════════════════════════════════════
function updateHUD(){
  const h=Math.ceil(player.hp/2),mh=Math.ceil(player.maxHp/2);
  let hs='';for(let i=0;i<mh;i++)hs+=i<h?'❤️':'🖤';
  document.getElementById('hudHearts').innerHTML=hs;
  document.getElementById('hudArmor').textContent=AR[player.ar].n!=='None'?`🛡 ${AR[player.ar].n}`:'';
  document.getElementById('hudCash').textContent=`💰 $${S.money.toLocaleString()}`;
  const r=getRank(S.wins);
  document.getElementById('hudRank').innerHTML=`<span style="color:${r.c}">★ ${r.n}</span>`;
  document.getElementById('hs0').textContent=SW[player.sw].i;
  document.getElementById('hs1').textContent=AR[player.ar].i;
}
let kfTm=null;
function kfeed(msg){
  const el=document.getElementById('killfeed');
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(kfTm);kfTm=setTimeout(()=>el.style.opacity='0',2400);
}

// ══════════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════════
let hudTimer=0;
function loop(ts){
  if(!running)return;
  const dt=Math.min(ts-lastTs,50);lastTs=ts;

  // Player input
  if(!player.dead){
    let dx=0,dy=0;
    if(keys.KeyA||keys.ArrowLeft)dx-=SPD;
    if(keys.KeyD||keys.ArrowRight)dx+=SPD;
    if(keys.KeyW||keys.ArrowUp)dy-=SPD;
    if(keys.KeyS||keys.ArrowDown)dy+=SPD;
    if(dx&&dy){dx*=.707;dy*=.707;}
    mv(player,dx,dy);
  }

  // Physics & timers
  for(const e of[player,...bots]){
    if(Math.abs(e.kx)>.08||Math.abs(e.ky)>.08){mv(e,e.kx,e.ky);e.kx*=.65;e.ky*=.65;}
    e.atkCd=Math.max(0,e.atkCd-dt);
    if(e.hitFlash>0)e.hitFlash--;
    if(e.swP>=0){e.swP+=dt/185;if(e.swP>=1)e.swP=-1;}
  }

  // AI
  for(const b of bots)aiTick(b,dt);

  // Particles
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.86;p.vy*=.86;p.life--;}
  parts=parts.filter(p=>p.life>0);

  // Camera
  camX+=(player.x-CW/2-camX)*.1;
  camY+=(player.y-CH/2-camY)*.1;
  camX=Math.max(0,Math.min(MW*TW-CW,camX));
  camY=Math.max(0,Math.min(MH*TW-CH,camY));

  // Render
  ctx.clearRect(0,0,CW,CH);
  drawMap();
  drawParts();
  [...[player,...bots]].sort((a,b)=>a.y-b.y).forEach(drawEnt);

  // HUD throttle
  hudTimer+=dt;if(hudTimer>100){hudTimer=0;updateHUD();}

  animId=requestAnimationFrame(loop);
}

// ══════════════════════════════════════
//  MULTIPLAYER (PeerJS)
// ══════════════════════════════════════
let peer=null,mpConn=null,mpHost=false,mpOpp=null;
function setA(st,code,hint){
  document.getElementById('aStatus').textContent=st;
  document.getElementById('aCode').textContent=code||'';
  document.getElementById('aHint').textContent=hint||'';
}
function goArena(){
  show('sc-arena');setA('HOSTING...','','');
  if(peer){peer.destroy();peer=null;}
  mpHost=true;
  const code='PVP'+Math.floor(1000+Math.random()*9000);
  peer=new Peer(code);
  peer.on('open',id=>{setA('WAITING FOR OPPONENT...',id,'Share this code with a friend');});
  peer.on('connection',c=>{
    mpConn=c;setA('OPPONENT JOINED!','','Ready!');
    document.getElementById('aStartBtn').style.display='block';
    c.on('data',mpData);
  });
  peer.on('error',e=>setA('ERROR: '+e.type));
}
function mpJoin(){
  const code=document.getElementById('joinInput').value.trim().toUpperCase();
  if(!code)return;
  if(peer){peer.destroy();peer=null;}
  mpHost=false;
  peer=new Peer();
  peer.on('open',()=>{
    setA('CONNECTING TO '+code+'...','','');
    mpConn=peer.connect(code);
    mpConn.on('open',()=>{setA('CONNECTED!','','Waiting for host...');mpConn.send({t:'hi'});});
    mpConn.on('data',mpData);
    mpConn.on('error',()=>setA('FAILED','','Check code'));
  });
  peer.on('error',e=>setA('ERROR: '+e.type));
}
function mpStart(){
  if(!mpConn)return;
  mpConn.send({t:'start',sw:S.sword,ar:S.armor});
  mpBegin({sw:S.sword,ar:S.armor},true);
}
function mpData(d){
  if(d.t==='start')mpBegin(d,false);
  else if(d.t==='pos'&&mpOpp){mpOpp.x=d.x;mpOpp.y=d.y;mpOpp.swP=d.sp;mpOpp.swA=d.sa;mpOpp.dead=d.dead;}
  else if(d.t==='hit'&&!player.dead){
    const dmg=Math.max(1,d.dmg-AR[player.ar].def);
    player.hp-=dmg;player.kx+=d.kx;player.ky+=d.ky;player.hitFlash=10;
    blood(player.x,player.y);
    if(player.hp<=0&&mpOpp)onKill(mpOpp,player);
    updateHUD();
  }
}
function mpBegin(d,iAm){
  vsAI=false;S=ld();initGame();bots=[];
  const os=mpHost?d.sw:S.sword,oa=mpHost?d.ar:S.armor;
  mpOpp=mkEnt(mpHost?(MW-8)*TW:5*TW,mpHost?(MH-8)*TW:5*TW,false,os,oa,'OPPONENT',1);
  bots=[mpOpp];
  canvas.onmousedown=e=>{
    if(e.button!==0)return;e.preventDefault();
    if(player.dead||player.atkCd>0)return;
    const s=SW[player.sw];player.atkCd=s.cd;
    const angle=faceAngle(player);player.swA=angle;player.swP=0;
    if(mpOpp&&!mpOpp.dead){
      const dx=mpOpp.x-player.x,dy=mpOpp.y-player.y,dist=Math.hypot(dx,dy);
      if(dist<=s.rch+PR){
        let diff=Math.abs(angle-Math.atan2(dy,dx));
        if(diff>Math.PI)diff=2*Math.PI-diff;
        if(diff<=1.0&&mpConn){
          const k=4+s.dmg;
          mpConn.send({t:'hit',dmg:s.dmg,kx:(dx/dist)*k,ky:(dy/dist)*k});
          blood(mpOpp.x,mpOpp.y);mpOpp.hitFlash=10;
        }
      }
    }
  };
  const posInt=setInterval(()=>{
    if(!running){clearInterval(posInt);return;}
    if(mpConn)mpConn.send({t:'pos',x:player.x,y:player.y,sp:player.swP,sa:player.swA,dead:player.dead});
  },50);
}
function mpLeave(){if(peer){peer.destroy();peer=null;}mpConn=null;show('sc-title');}
</script>
