<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RIVALS 3D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a1a; overflow:hidden; font-family:'Segoe UI',sans-serif; }
canvas { display:block; }

#ui {
  position:fixed; inset:0; pointer-events:none;
  display:flex; flex-direction:column; justify-content:space-between;
}

/* Crosshair */
#crosshair {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  color:white; font-size:22px; font-weight:100;
  text-shadow:0 0 6px #fff;
  user-select:none;
  display:none;
}

/* Top HUD */
#top-hud {
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:16px 20px;
}
.hud-box {
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;
  padding:10px 16px;
  backdrop-filter:blur(6px);
}
.hud-label { font-size:10px; color:#888; text-transform:uppercase; letter-spacing:1px; }
.hud-value { font-size:22px; font-weight:800; color:white; margin-top:2px; }
#kills-val  { color:#ff4444; }
#score-val  { color:#fbbf24; }

/* Bottom HUD */
#bottom-hud {
  display:flex; justify-content:space-between; align-items:flex-end;
  padding:16px 20px;
}

/* Health bar */
#health-wrap { width:200px; }
#health-label { font-size:11px; color:#888; letter-spacing:1px; margin-bottom:4px; }
#health-bar-bg {
  width:100%; height:12px; background:rgba(255,255,255,0.1);
  border-radius:99px; overflow:hidden;
}
#health-bar { height:100%; width:100%; background:linear-gradient(90deg,#ef4444,#f97316); border-radius:99px; transition:width 0.2s; }

/* Ammo */
#ammo-box .hud-value { color:#60a5fa; font-size:28px; }
#ammo-box .ammo-small { font-size:14px; color:#888; }

/* Wave */
#wave-box .hud-value { color:#a78bfa; }

/* Kill feed */
#killfeed {
  position:fixed; top:80px; right:20px;
  display:flex; flex-direction:column; gap:5px;
  pointer-events:none;
}
.kf-entry {
  background:rgba(0,0,0,0.6);
  border-left:3px solid #ff4444;
  padding:5px 10px;
  border-radius:0 6px 6px 0;
  font-size:12px;
  color:white;
  animation:kfIn 0.2s ease;
}
@keyframes kfIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }

/* Hit marker */
#hitmarker {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-size:28px; color:#ff4444;
  opacity:0; pointer-events:none;
  transition:opacity 0.1s;
}

/* Damage flash */
#damage-flash {
  position:fixed; inset:0;
  background:rgba(255,0,0,0.25);
  opacity:0; pointer-events:none;
  transition:opacity 0.15s;
}

/* Start screen */
#start-screen {
  position:fixed; inset:0;
  background:linear-gradient(135deg,#0a0a1a,#1a0a2e);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:24px; z-index:100;
}
#start-screen h1 {
  font-size:80px; font-weight:900; letter-spacing:12px;
  color:#ff4444;
  text-shadow:0 0 20px #ff4444,0 0 60px #ff0000;
  animation:glow 2s infinite;
}
@keyframes glow {
  0%,100%{text-shadow:0 0 20px #ff4444,0 0 40px #ff0000}
  50%{text-shadow:0 0 40px #ff4444,0 0 80px #ff0000,0 0 120px #ff6600}
}
#start-screen .subtitle {
  font-size:16px; color:#888; letter-spacing:6px; text-transform:uppercase;
}
#start-btn {
  background:linear-gradient(135deg,#ff4444,#ff6600);
  color:white; border:none; padding:16px 48px;
  border-radius:50px; font-size:18px; font-weight:800;
  cursor:pointer; letter-spacing:2px;
  box-shadow:0 8px 30px rgba(255,68,68,0.5);
  transition:all 0.2s;
}
#start-btn:hover { transform:scale(1.06); box-shadow:0 12px 40px rgba(255,68,68,0.7); }
.start-controls {
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; padding:16px 24px;
  font-size:13px; color:#aaa; line-height:2;
  text-align:center;
}

/* Game over */
#gameover-screen {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.8);
  display:none; flex-direction:column;
  align-items:center; justify-content:center;
  gap:16px; z-index:100;
}
#gameover-screen h2 { font-size:56px; font-weight:900; color:#ff4444; }
#gameover-stats { font-size:18px; color:#ddd; }
#restart-btn {
  background:linear-gradient(135deg,#ff4444,#ff6600);
  color:white; border:none; padding:12px 36px;
  border-radius:50px; font-size:16px; font-weight:800;
  cursor:pointer; pointer-events:all;
  box-shadow:0 6px 20px rgba(255,68,68,0.5);
}

/* Wave announce */
#wave-announce {
  position:fixed; top:40%; left:50%; transform:translateX(-50%);
  font-size:42px; font-weight:900; color:#a78bfa;
  text-shadow:0 0 20px #a78bfa;
  opacity:0; pointer-events:none;
  transition:opacity 0.3s;
}

#lock-msg {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  color:white; font-size:16px; text-align:center;
  background:rgba(0,0,0,0.6); padding:16px 24px;
  border-radius:12px; pointer-events:all; cursor:pointer;
}
</style>
</head>
<body>

<!-- Start Screen -->
<div id="start-screen">
  <h1>⚔ RIVALS</h1>
  <div class="subtitle">3D Edition</div>
  <div class="start-controls">
    WASD — Move &nbsp;|&nbsp; Mouse — Look &nbsp;|&nbsp; Click — Shoot &nbsp;|&nbsp; Space — Jump<br>
    R — Reload &nbsp;|&nbsp; Survive all waves to win!
  </div>
  <button id="start-btn" onclick="startGame()">▶ PLAY NOW</button>
</div>

<!-- Game Over -->
<div id="gameover-screen">
  <h2>☠ GAME OVER</h2>
  <div id="gameover-stats"></div>
  <button id="restart-btn" onclick="restartGame()">↺ Play Again</button>
</div>

<!-- Lock prompt -->
<div id="lock-msg" style="display:none" onclick="renderer.domElement.requestPointerLock()">
  🖱 Click to resume
</div>

<!-- HUD -->
<div id="ui">
  <div id="top-hud">
    <div class="hud-box">
      <div class="hud-label">Kills</div>
      <div class="hud-value" id="kills-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Wave</div>
      <div class="hud-value" id="wave-val">1</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Enemies</div>
      <div class="hud-value" id="enemy-val">0</div>
    </div>
  </div>
  <div id="bottom-hud">
    <div id="health-wrap" class="hud-box">
      <div id="health-label">❤ HEALTH</div>
      <div id="health-bar-bg"><div id="health-bar"></div></div>
    </div>
    <div class="hud-box" id="ammo-box">
      <div class="hud-label">Ammo</div>
      <div class="hud-value"><span id="ammo-val">30</span><span class="ammo-small"> / 30</span></div>
    </div>
  </div>
</div>

<div id="crosshair">+</div>
<div id="hitmarker">✕</div>
<div id="damage-flash"></div>
<div id="killfeed"></div>
<div id="wave-announce"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════
// RIVALS 3D — Full Game
// ═══════════════════════════════════════════

let renderer, scene, camera, gameRunning = false;
let animId;

// ── Scene setup ──────────────────────────
function initThree() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x0a0a1a);
  document.body.prepend(renderer.domElement);

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0a0a1a, 25, 80);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
}

// ── Lighting ─────────────────────────────
function setupLighting() {
  const ambient = new THREE.AmbientLight(0x223366, 0.8);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(10, 30, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 100;
  sun.shadow.camera.left = -40;
  sun.shadow.camera.right = 40;
  sun.shadow.camera.top = 40;
  sun.shadow.camera.bottom = -40;
  scene.add(sun);

  // Coloured point lights for atmosphere
  const lights = [
    { color: 0xff2244, pos: [-15, 3, -15] },
    { color: 0x2244ff, pos: [15, 3, -15] },
    { color: 0x44ff88, pos: [0, 3, 15] },
  ];
  lights.forEach(l => {
    const pl = new THREE.PointLight(l.color, 1.5, 20);
    pl.position.set(...l.pos);
    scene.add(pl);
  });
}

// ── Map ──────────────────────────────────
const collidables = []; // {min, max} AABB boxes

function box(x, y, z, w, h, d, color = 0x2d3561, emissive = 0x111830) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshLambertMaterial({ color, emissive });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  collidables.push({
    min: new THREE.Vector3(x - w/2, y - h/2, z - d/2),
    max: new THREE.Vector3(x + w/2, y + h/2, z + d/2),
    mesh
  });
  return mesh;
}

function buildMap() {
  // Floor
  const floorGeo = new THREE.PlaneGeometry(80, 80, 20, 20);
  const floorMat = new THREE.MeshLambertMaterial({ color: 0x0d0d1f });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  collidables.push({ min: new THREE.Vector3(-40, -0.5, -40), max: new THREE.Vector3(40, 0, 40), mesh: floor });

  // Grid lines on floor
  const grid = new THREE.GridHelper(80, 40, 0x223366, 0x111a33);
  grid.position.y = 0.01;
  scene.add(grid);

  // Boundary walls (invisible collision)
  const W = 40;
  [
    [0, 3, -W, 80, 6, 1],
    [0, 3,  W, 80, 6, 1],
    [-W, 3, 0, 1, 6, 80],
    [ W, 3, 0, 1, 6, 80],
  ].forEach(([x,y,z,w,h,d]) => {
    collidables.push({
      min: new THREE.Vector3(x-w/2, y-h/2, z-d/2),
      max: new THREE.Vector3(x+w/2, y+h/2, z+d/2),
      mesh: null
    });
  });

  // Platforms
  box(-10, 2.25, 0,   8, 0.5, 5, 0x2d3561);
  box( 10, 2.25, 0,   8, 0.5, 5, 0x2d3561);
  box(  0, 4.25, -12, 10, 0.5, 5, 0x3d2561);
  box(-14, 4.25, -10, 5,  0.5, 4, 0x2d5161);
  box( 14, 4.25, -10, 5,  0.5, 4, 0x2d5161);
  box(  0, 6.25,  0,  6,  0.5, 6, 0x612d2d);

  // Cover walls
  box(-8, 1.5, -6,  1.5, 3, 5, 0x1a2a4a);
  box( 8, 1.5, -6,  1.5, 3, 5, 0x1a2a4a);
  box( 0, 1.5, 10,  10,  3, 1.5, 0x1a2a4a);
  box(-18,1.5,  0,  1.5, 3, 8, 0x1a2a4a);
  box( 18,1.5,  0,  1.5, 3, 8, 0x1a2a4a);

  // Decorative pillars
  [[-20,-20],[20,-20],[-20,20],[20,20]].forEach(([px,pz]) => {
    box(px, 4, pz, 2, 8, 2, 0x1a1a3a, 0x0a0a1a);
  });

  // Neon trim lines
  addNeonTrim();
}

function addNeonTrim() {
  const colors = [0xff2244, 0x2244ff, 0x22ff88];
  colors.forEach((c, i) => {
    const geo = new THREE.BoxGeometry(80, 0.1, 0.1);
    const mat = new THREE.MeshBasicMaterial({ color: c });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, 0.05, -40 + i * 40);
    scene.add(mesh);
  });
}

// ── Player ───────────────────────────────
const player = {
  pos: new THREE.Vector3(0, 1.8, 5),
  vel: new THREE.Vector3(),
  yaw: 0, pitch: 0,
  onGround: false,
  health: 100, maxHealth: 100,
  ammo: 30, maxAmmo: 30,
  kills: 0,
  reloading: false,
  reloadTimer: 0,
  shootCooldown: 0,
  alive: true,
};

// ── Controls ─────────────────────────────
const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyR') startReload(); });
document.addEventListener('keyup',   e => { keys[e.code] = false; });

document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === renderer.domElement;
  document.getElementById('crosshair').style.display = locked ? 'block' : 'none';
  document.getElementById('lock-msg').style.display  = (locked || !gameRunning) ? 'none' : 'block';
});

document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement || !player.alive) return;
  player.yaw   -= e.movementX * 0.0018;
  player.pitch  = Math.max(-Math.PI * 0.42, Math.min(Math.PI * 0.42, player.pitch - e.movementY * 0.0018));
});

renderer && renderer.domElement.addEventListener('click', () => {
  if (gameRunning && player.alive) renderer.domElement.requestPointerLock();
  if (document.pointerLockElement === renderer.domElement) tryShoot();
});

// ── Shooting ─────────────────────────────
const bullets = [];
const BULLET_SPEED = 50;
const BOT_NAMES = ['ShadowX','CrimsonK','VoidSniper','PhantomR','DeathClaw','NightBlade','IronFist','BlazeFire'];

function tryShoot() {
  if (!player.alive || player.ammo <= 0 || player.reloading || player.shootCooldown > 0) return;
  player.ammo--;
  player.shootCooldown = 0.12;
  updateAmmoHUD();

  // Direction
  const dir = new THREE.Vector3(0, 0, -1);
  dir.applyEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));

  // Raycast
  const ray = new THREE.Raycaster(camera.position.clone(), dir.normalize());
  const targets = bots.filter(b => b.alive).map(b => b.mesh);
  const hits = ray.intersectObjects(targets, true);

  showMuzzleFlash();

  if (hits.length > 0) {
    const hitMesh = hits[0].object.parent || hits[0].object;
    const bot = bots.find(b => b.mesh === hitMesh || b.mesh.children.includes(hits[0].object));
    if (bot && bot.alive) {
      bot.health -= 25;
      showHitMarker();
      if (bot.health <= 0) killBot(bot);
    }
  }

  // Visual bullet tracer
  const tGeo = new THREE.CylinderGeometry(0.02, 0.02, 1, 4);
  tGeo.rotateX(Math.PI / 2);
  const tMat = new THREE.MeshBasicMaterial({ color: 0xffff88 });
  const tracer = new THREE.Mesh(tGeo, tMat);
  tracer.position.copy(camera.position).addScaledVector(dir, 1.5);
  tracer.lookAt(tracer.position.clone().add(dir));
  scene.add(tracer);
  bullets.push({ mesh: tracer, vel: dir.clone().multiplyScalar(BULLET_SPEED), life: 0.4 });
}

function startReload() {
  if (player.reloading || player.ammo >= player.maxAmmo) return;
  player.reloading = true;
  player.reloadTimer = 1.5;
}

function killBot(bot) {
  bot.alive = false;
  player.kills++;
  scene.remove(bot.mesh);
  addKillFeed(bot.name);
  updateTopHUD();

  // Spawn item drop
  spawnDrop(bot.mesh.position.clone());

  // Check wave clear
  if (bots.filter(b => b.alive).length === 0) {
    setTimeout(nextWave, 2000);
  }
}

// ── Bots ─────────────────────────────────
const bots = [];
let wave = 1;
const BOT_COLORS = [0xff2244, 0xff6600, 0xff44aa];

function spawnBot(x, z) {
  const group = new THREE.Group();

  // Body
  const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.5);
  const bodyMat = new THREE.MeshLambertMaterial({ color: BOT_COLORS[Math.floor(Math.random()*BOT_COLORS.length)], emissive: 0x220000 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  group.add(body);

  // Head
  const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
  const head = new THREE.Mesh(headGeo, bodyMat);
  head.position.y = 0.9;
  head.castShadow = true;
  group.add(head);

  // Eyes
  const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  [-0.15, 0.15].forEach(ex => {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(ex, 0.92, 0.31);
    group.add(eye);
  });

  group.position.set(x, 1, z);
  scene.add(group);

  const bot = {
    mesh: group,
    health: 60 + wave * 15,
    maxHealth: 60 + wave * 15,
    vel: new THREE.Vector3(),
    onGround: false,
    alive: true,
    name: BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)],
    shootTimer: 1 + Math.random() * 2,
    moveTimer: 0,
    moveDir: new THREE.Vector3(),
    state: 'patrol',
  };
  bots.push(bot);
  return bot;
}

function spawnWave(n) {
  const count = 2 + n * 2;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const r = 18 + Math.random() * 8;
    spawnBot(Math.cos(angle) * r, Math.sin(angle) * r);
  }
  showWaveAnnounce(n);
  updateTopHUD();
}

function nextWave() {
  wave++;
  spawnWave(wave);
}

// ── Item drops ───────────────────────────
const drops = [];
function spawnDrop(pos) {
  if (Math.random() > 0.5) return;
  const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  const mat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff4444 : 0x60a5fa, wireframe: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.position.y = 0.5;
  scene.add(mesh);
  drops.push({ mesh, type: Math.random() > 0.5 ? 'health' : 'ammo', life: 8 });
}

// ── Physics / collision ──────────────────
const GRAVITY = -22;
const MOVE_SPEED = 7;
const JUMP_VEL = 8;
const EYE_HEIGHT = 0.8;

function resolveAABB(pos, vel, radius, height) {
  const min = new THREE.Vector3(pos.x - radius, pos.y, pos.z - radius);
  const max = new THREE.Vector3(pos.x + radius, pos.y + height, pos.z + radius);
  let onGround = false;

  for (const c of collidables) {
    if (min.x < c.max.x && max.x > c.min.x &&
        min.y < c.max.y && max.y > c.min.y &&
        min.z < c.max.z && max.z > c.min.z) {
      // Find smallest overlap axis
      const ox = Math.min(max.x - c.min.x, c.max.x - min.x);
      const oy = Math.min(max.y - c.min.y, c.max.y - min.y);
      const oz = Math.min(max.z - c.min.z, c.max.z - min.z);
      if (oy < ox && oy < oz) {
        if (vel.y < 0 && pos.y > c.min.y) { pos.y = c.max.y; vel.y = 0; onGround = true; }
        else if (vel.y > 0)               { pos.y = c.min.y - height; vel.y = 0; }
      } else if (ox < oz) {
        if (vel.x < 0) pos.x = c.max.x + radius;
        else           pos.x = c.min.x - radius;
        vel.x = 0;
      } else {
        if (vel.z < 0) pos.z = c.max.z + radius;
        else           pos.z = c.min.z - radius;
        vel.z = 0;
      }
    }
  }
  return onGround;
}

// ── Bot AI ───────────────────────────────
function updateBots(dt) {
  bots.forEach(bot => {
    if (!bot.alive) return;

    const toPlayer = player.pos.clone().sub(bot.mesh.position);
    const dist = toPlayer.length();

    // Gravity
    bot.vel.y += GRAVITY * dt;
    bot.mesh.position.addScaledVector(bot.vel, dt);
    const bg = resolveAABB(bot.mesh.position, bot.vel, 0.4, 1.8);
    if (bg) { bot.vel.y = 0; bot.onGround = true; }

    // Face player
    bot.mesh.lookAt(bot.mesh.position.clone().setY(bot.mesh.position.y).add(
      new THREE.Vector3(toPlayer.x, 0, toPlayer.z).normalize()
    ));

    // Chase
    if (dist > 3 && dist < 40) {
      const moveDir = new THREE.Vector3(toPlayer.x, 0, toPlayer.z).normalize();
      bot.mesh.position.addScaledVector(moveDir, (2.5 + wave * 0.3) * dt);
    }

    // Random jump over obstacles
    if (bot.onGround && Math.random() < 0.005) {
      bot.vel.y = JUMP_VEL * 0.8;
      bot.onGround = false;
    }

    // Shoot at player
    bot.shootTimer -= dt;
    if (bot.shootTimer <= 0 && dist < 25 && player.alive) {
      bot.shootTimer = (1.5 - wave * 0.08) + Math.random() * 1.5;
      if (Math.random() > 0.35) {
        botShoot(bot);
      }
    }

    // Keep in bounds
    const B = 38;
    bot.mesh.position.x = Math.max(-B, Math.min(B, bot.mesh.position.x));
    bot.mesh.position.z = Math.max(-B, Math.min(B, bot.mesh.position.z));
  });
}

function botShoot(bot) {
  const spread = 0.08;
  const toP = player.pos.clone().add(new THREE.Vector3(0, EYE_HEIGHT, 0)).sub(bot.mesh.position);
  toP.normalize();
  toP.x += (Math.random() - 0.5) * spread;
  toP.z += (Math.random() - 0.5) * spread;
  toP.normalize();

  // Check rough line of sight
  const dist = bot.mesh.position.distanceTo(player.pos);
  if (dist < 28 && player.alive && Math.random() < 0.6) {
    takeDamage(12 + wave * 2);
  }
}

// ── Player damage / heal ─────────────────
let invincibleTimer = 0;
function takeDamage(amount) {
  if (invincibleTimer > 0 || !player.alive) return;
  player.health = Math.max(0, player.health - amount);
  invincibleTimer = 0.4;
  showDamageFlash();
  updateHealthHUD();
  if (player.health <= 0) gameOver();
}

function healPlayer(amount) {
  player.health = Math.min(player.maxHealth, player.health + amount);
  updateHealthHUD();
}

// ── Effects ──────────────────────────────
let hitMarkerTimer = 0;
function showHitMarker() {
  hitMarkerTimer = 0.18;
  const hm = document.getElementById('hitmarker');
  hm.style.opacity = '1';
}

let muzzleTimer = 0;
function showMuzzleFlash() {
  muzzleTimer = 0.05;
}

function showDamageFlash() {
  const el = document.getElementById('damage-flash');
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 150);
}

function addKillFeed(name) {
  const kf = document.getElementById('killfeed');
  const entry = document.createElement('div');
  entry.className = 'kf-entry';
  entry.textContent = `You eliminated ${name}`;
  kf.prepend(entry);
  setTimeout(() => entry.remove(), 3000);
}

function showWaveAnnounce(n) {
  const el = document.getElementById('wave-announce');
  el.textContent = `⚔ WAVE ${n}`;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 2500);
}

// ── HUD updates ──────────────────────────
function updateHealthHUD() {
  document.getElementById('health-bar').style.width = (player.health / player.maxHealth * 100) + '%';
  const pct = player.health / player.maxHealth;
  document.getElementById('health-bar').style.background =
    pct > 0.5 ? 'linear-gradient(90deg,#ef4444,#f97316)' :
    pct > 0.25 ? 'linear-gradient(90deg,#dc2626,#ea580c)' :
                 'linear-gradient(90deg,#991b1b,#c2410c)';
}
function updateAmmoHUD() {
  document.getElementById('ammo-val').textContent = player.ammo;
}
function updateTopHUD() {
  document.getElementById('kills-val').textContent = player.kills;
  document.getElementById('wave-val').textContent  = wave;
  document.getElementById('enemy-val').textContent = bots.filter(b => b.alive).length;
}

// ── Game flow ─────────────────────────────
function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('lock-msg').style.display = 'none';
  gameRunning = true;
  initThree();
  setupLighting();
  buildMap();
  spawnWave(wave);
  renderer.domElement.addEventListener('click', () => {
    if (gameRunning && player.alive) {
      renderer.domElement.requestPointerLock();
      tryShoot();
    }
  });
  document.addEventListener('pointerlockchange', () => {
    const locked = document.pointerLockElement === renderer.domElement;
    document.getElementById('crosshair').style.display = locked && gameRunning ? 'block' : 'none';
    document.getElementById('lock-msg').style.display  = (!locked && gameRunning && player.alive) ? 'block' : 'none';
  });
  renderer.domElement.requestPointerLock();
  updateHealthHUD();
  updateAmmoHUD();
  updateTopHUD();
  gameLoop(0);
}

function gameOver() {
  player.alive = false;
  gameRunning = false;
  document.exitPointerLock();
  document.getElementById('crosshair').style.display = 'none';
  document.getElementById('lock-msg').style.display = 'none';
  const go = document.getElementById('gameover-screen');
  go.style.display = 'flex';
  document.getElementById('gameover-stats').textContent =
    `Wave ${wave} • ${player.kills} kills`;
}

function restartGame() {
  document.getElementById('gameover-screen').style.display = 'none';
  // Clear scene
  while (scene.children.length) scene.remove(scene.children[0]);
  bots.length = 0; bullets.length = 0; drops.length = 0; collidables.length = 0;
  wave = 1;
  player.pos.set(0, 1.8, 5);
  player.vel.set(0, 0, 0);
  player.health = player.maxHealth;
  player.ammo = player.maxAmmo;
  player.kills = 0;
  player.alive = true;
  player.yaw = 0; player.pitch = 0;
  gameRunning = true;
  setupLighting();
  buildMap();
  spawnWave(wave);
  renderer.domElement.requestPointerLock();
  updateHealthHUD();
  updateAmmoHUD();
  updateTopHUD();
}

// ── Game loop ─────────────────────────────
let lastT = 0;
function gameLoop(t) {
  animId = requestAnimationFrame(gameLoop);
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  if (!gameRunning || !player.alive) return;

  // ── Player movement ──
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  const moveInput = new THREE.Vector3();
  if (keys['KeyW']) moveInput.addScaledVector(fwd, 1);
  if (keys['KeyS']) moveInput.addScaledVector(fwd, -1);
  if (keys['KeyA']) moveInput.addScaledVector(right, -1);
  if (keys['KeyD']) moveInput.addScaledVector(right, 1);
  if (moveInput.lengthSq() > 0) moveInput.normalize();

  player.vel.x = moveInput.x * MOVE_SPEED;
  player.vel.z = moveInput.z * MOVE_SPEED;
  player.vel.y += GRAVITY * dt;

  if (keys['Space'] && player.onGround) {
    player.vel.y = JUMP_VEL;
    player.onGround = false;
  }

  player.pos.addScaledVector(player.vel, dt);
  player.onGround = resolveAABB(player.pos, player.vel, 0.35, 1.8);

  // Boundary clamp
  const B = 38;
  player.pos.x = Math.max(-B, Math.min(B, player.pos.x));
  player.pos.z = Math.max(-B, Math.min(B, player.pos.z));

  // Camera
  camera.position.copy(player.pos);
  camera.position.y += EYE_HEIGHT;
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  // ── Timers ──
  if (player.shootCooldown > 0) player.shootCooldown -= dt;
  if (invincibleTimer > 0) invincibleTimer -= dt;

  // Reload
  if (player.reloading) {
    player.reloadTimer -= dt;
    if (player.reloadTimer <= 0) {
      player.reloading = false;
      player.ammo = player.maxAmmo;
      updateAmmoHUD();
    }
  }

  // Hit marker fade
  if (hitMarkerTimer > 0) {
    hitMarkerTimer -= dt;
    if (hitMarkerTimer <= 0) document.getElementById('hitmarker').style.opacity = '0';
  }

  // ── Bullets ──
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.addScaledVector(b.vel, dt);
    b.life -= dt;
    if (b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
  }

  // ── Drops ──
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.mesh.rotation.y += dt * 2;
    d.life -= dt;
    const distD = d.mesh.position.distanceTo(player.pos);
    if (distD < 1.5) {
      if (d.type === 'health') healPlayer(30);
      else { player.ammo = Math.min(player.maxAmmo, player.ammo + 15); updateAmmoHUD(); }
      scene.remove(d.mesh);
      drops.splice(i, 1);
    } else if (d.life <= 0) {
      scene.remove(d.mesh);
      drops.splice(i, 1);
    }
  }

  // ── Bots ──
  updateBots(dt);
  updateTopHUD();

  renderer.render(scene, camera);
}

initThree();
</script>
